<style>

:root{--bg:#050503;--ink:#d9d49c;--dim:#8f8c63;--warn:#d0603f;--line:#3d3a1f;--ui:'VT323','Courier New',monospace;color-scheme:dark}

.bars div{display:flex;align-items:center;gap:6px;letter-spacing:.06em}
.bar{display:inline-block;width:clamp(50px,9vw,110px);height:.6em;border:1px solid var(--dim);background:#0007;position:relative}
.bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ink);width:100%}
#bSan b{background:#b8d0a0}#bBat b{background:#e8d070}
#inv{color:var(--dim);white-space:normal}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#d9d49c88;pointer-events:none}
#prompt{position:absolute;left:0;right:0;top:60%;text-align:center;font-size:clamp(14px,2.8vw,26px);text-shadow:1px 1px 0 #000;pointer-events:none;min-height:1.2em}
#toast{position:absolute;left:8%;right:8%;top:8%;text-align:center;font-size:clamp(14px,2.8vw,26px);text-shadow:1px 1px 0 #000;pointer-events:none;opacity:0;transition:opacity .6s}
#ts{position:absolute;right:3%;bottom:3%;font-size:clamp(15px,3vw,30px);color:#f2f2f2;text-shadow:2px 2px 0 #000;letter-spacing:.05em;pointer-events:none;display:none;text-align:right}

#rec i{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#e33;margin-right:.4em;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#vhsTag{position:absolute;right:3%;top:3%;font-size:clamp(12px,2vw,18px);color:var(--dim);pointer-events:none}
#overlay,#journal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;background:#000d;padding:4%;box-sizing:border-box;overflow:auto}
#overlay[hidden],#journal[hidden]{display:none}
h1{font-weight:400;font-size:clamp(34px,8vw,84px);letter-spacing:.14em;margin:0;color:var(--ink);text-shadow:3px 3px 0 #4a3d12}

.sub{color:var(--dim);font-size:clamp(14px,2.6vw,24px);max-width:34em}
.keys{display:grid;grid-template-columns:auto auto;gap:2px 22px;text-align:left;font-size:clamp(13px,2.3vw,21px);color:var(--ink)}
.keys span:nth-child(odd){color:var(--dim)}

#jlist p small{display:block;color:var(--dim);letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){#rec i{animation:none}#toast{transition:none}}

  if(los){E.loseT=0;E.last=[P.x,P.z]}else E.loseT+=dt;
  if(E.freeze>0)E.freeze-=dt;else if(R()<dt*.22)E.freeze=rnd(.3,.9);
  if(E.freeze<=0){const sp=3.5*(.72+.5*Math.max(0,Math.sin(P.time*2.3+E.ph)));
   if(los&&dist<7){const L=dist||1,st=Math.min(sp*dt,L);E.x+=dx/L*st;E.z+=dz/L*st;moving=true}else{moving=moveAlong(dt,sp)==='moving'}}
  if(E.loseT>7){E.state='search';const ij=tc(E.last[0],E.last[1]);setTarget(ij[0],ij[1]);E.t=0;E.lingerSet=false}
  if(dist<.95&&mode==='play')die('IT FOUND YOU')}
 if(moving&&dist<30){E.stepT-=dt;if(E.stepT<=0){E.stepT=E.state==='chase'?.32:.6;const pan=clamp(Math.sin(Math.atan2(E.x-P.x,E.z-P.z)-(Math.PI+P.yaw)+Math.PI)*.8,-1,1);thud(.5/(1+dist*.22),pan)}}
 E.frameT-=dt;if(E.frameT<=0){E.frameT=E.state==='chase'?.07:.14;E.frame=(E.frame+1+((Math.random()*2)|0))%TX.ent.length;entMat.uniforms.map.value=TX.ent[E.frame]}
 entMesh.position.set(E.x,1.5,E.z);entMesh.rotation.y=Math.atan2(P.x-E.x,P.z-E.z)}
function die(why){if(dying||mode!=='play')return;deathWhy=why;dying=1;if(document.exitPointerLock)document.exitPointerLock();thud(.9,0);burst(.6,3000,'highpass',.3)}
function showDead(){setMode('dead');const s=Math.floor(P.time),mm=Math.floor(s/60),ss=('0'+(s%60)).slice(-2);
 $('overlay').innerHTML=`<h2>${deathWhy}</h2><div class="sub">Tape ran for ${mm}:${ss}. Notes found ${P.notes.length} of ${NOTES.length}. Odd things kept ${P.curios}.</div><button id="go">TRY AGAIN</button>`;
 $('go').onclick=()=>{initAudio();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();newGame(true)}}

/* ---------- interaction ---------- */
function aimTarget(){const fx=-Math.sin(P.yaw)*Math.cos(P.pitch),fz=-Math.cos(P.yaw)*Math.cos(P.pitch);let best=null,bd=.9;
 for(const it of W.items){const dx=it.x-P.x,dz=it.z-P.z,d=Math.hypot(dx,dz);if(d>2.5||d<.01)continue;const dot=(dx*fx+dz*fz)/d/Math.max(.2,Math.hypot(fx,fz));if(dot>bd&&rayClear(P.x,P.z,it.x,it.z)){bd=dot;best={item:it}}}
 if(best)return best;
 for(let d=.4;d<=2.6;d+=.2){const x=P.x+fx/Math.max(.2,Math.hypot(fx,fz))*d,z=P.z+fz/Math.max(.2,Math.hypot(fx,fz))*d,ij=tc(x,z);if(ij[0]<0||ij[1]<0||ij[0]>=N||ij[1]>=N)return null;const k=ij[1]*N+ij[0],di=W.doorAt[k];if(di>=0)return{door:W.doors[di]};if(W.g[k]!==0)return null}
 return null}
function openJournal(hl){const jl=$('jlist');jl.innerHTML='';if(!P.notes.length)jl.innerHTML='<p>Nothing yet.</p>';
 P.notes.slice().reverse().forEach(n=>{const p=document.createElement('p');if(n===hl)p.className='new';p.innerHTML='<small>NOTE '+(n+1)+'</small>';p.appendChild(document.createTextNode(NOTES[n]));jl.appendChild(p)});setMode('journal')}
function pickup(it){const t=it.type;
 if(t==='water'){P.water++;toast('Almond Water. Q to drink.')}
 else if(t==='battery'){P.batt++;toast('A battery. R to swap it in.')}
 else if(t==='flash'){P.hasFlash=true;P.bat=.7;P.flashOn=true;toast('A flashlight. F toggles it.')}
 else if(t==='key'){P.keys++;toast('A brass key. Some doors are locked for a reason.')}
 else if(t==='junk'){P.curios++;toast(JUNK[it.data][1],5000)}
 burst(.08,3000,'highpass',.15);W.items.splice(W.items.indexOf(it),1);root.remove(it.mesh);it.mesh.geometry.dispose();
 if(t==='note'){P.notes.push(it.data);openJournal(it.data)}}
function interact(){const a=aimTarget();if(!a)return;if(a.item){pickup(a.item);return}
 const d=a.door,ij=tc(P.x,P.z);
 if(d.locked){if(P.keys>0){P.keys--;d.locked=false;d.target=1;d.mesh.material=MAT.door;toast('The key turns. Something inside smells of dust.');creak()}else{toast('Locked. It needs a brass key.');burst(.07,500,'lowpass',.2)}return}
 if(d.target===1){if(ij[0]===d.i&&ij[1]===d.j)return;const eij=tc(E.x,E.z);if(eij[0]===d.i&&eij[1]===d.j)return}
 d.target=d.target?0:1;creak()}
function useWater(){if(P.water>0&&P.san<99){P.water--;P.san=Math.min(100,P.san+25);toast('Almond water. Cool and sweet. The walls settle.');for(let k=0;k<3;k++)setTimeout(()=>burst(.14,500,'lowpass',.18),k*260)}}
function swapBattery(){if(P.batt>0&&P.bat<.95&&P.hasFlash){P.batt--;P.bat=1;toast('New battery in.');burst(.05,2200,'highpass',.2)}}
function toggleFlash(){if(!P.hasFlash)return;if(P.bat<=0){toast('No charge. Replace the battery with R.');return}P.flashOn=!P.flashOn;burst(.03,2000,'highpass',.2)}

/* ---------- per-frame update ---------- */
function updHud(){$('bSan').firstChild.style.width=P.san+'%';$('bSta').firstChild.style.width=P.stam*100+'%';$('bBat').firstChild.style.width=(P.hasFlash?P.bat*100:0)+'%';
 const i=[];i.push(P.hasFlash?'FLASHLIGHT '+(P.flashOn?'ON':'OFF'):'NO FLASHLIGHT');i.push('BATTERIES '+P.batt);i.push('ALMOND WATER '+P.water);i.push('KEYS '+P.keys);i.push('NOTES '+P.notes.length+'/'+NOTES.length);$('inv').textContent=i.join(' | ')}
let lastPrompt='';
function setPrompt(s){if(s!==lastPrompt){$('prompt').textContent=s;lastPrompt=s}}
function update(dt){
 P.time+=dt;
 if(K.ArrowLeft)P.yaw+=1.9*dt;if(K.ArrowRight)P.yaw-=1.9*dt;if(K.ArrowUp)P.pitch=clamp(P.pitch+1.4*dt,-1.2,1.2);if(K.ArrowDown)P.pitch=clamp(P.pitch-1.4*dt,-1.2,1.2);
 if(dying){return}
 const fw=(K.KeyW?1:0)-(K.KeyS?1:0),st=(K.KeyD?1:0)-(K.KeyA?1:0),mv=fw||st;
 P.sprinting=!!((K.ShiftLeft||K.ShiftRight)&&P.stam>.02&&mv);let sp=2.8;
 if(P.sprinting){sp=5;P.stam=Math.max(0,P.stam-dt/4.5);P.stamDelay=1.5}else{P.stamDelay-=dt;if(P.stamDelay<=0)P.stam=Math.min(1,P.stam+dt/5)}
 const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);let mx=-sy*fw+cy*st,mz=-cy*fw-sy*st;const ml=Math.hypot(mx,mz)||1;mx=mx/ml*sp*dt;mz=mz/ml*sp*dt;
 if(mv){const r=.34;if(!hitWorld(P.x+mx,P.z,r))P.x+=mx;if(!hitWorld(P.x,P.z+mz,r))P.z+=mz;P.bob+=dt*(P.sprinting?11:7.5);P.stepD+=sp*dt;
  if(P.stepD>(P.sprinting?1.5:1.25)){P.stepD=0;burst(.13,P.sprinting?380:270,'lowpass',P.sprinting?.24:.15)}}
 P.moving=!!mv;
 if(P.hasFlash&&P.flashOn){P.bat=Math.max(0,P.bat-dt/150);if(P.bat<=0){P.flashOn=false;toast('The flashlight dies.')}}
 const ij=tc(P.x,P.z),pk=ij[1]*N+ij[0],L=lightAt(P.x,P.z);
 let drain=.16;if(!(P.flashOn&&P.bat>0)&&L<.4)drain+=.45;
 if(E.state==='stare'||(E.los&&E.dist<16))drain+=1.5*clamp(1-E.dist/18,.2,1);
 P.san=clamp(P.san-drain*dt,0,100);
 if(P.san<=0){P.zeroT+=dt;if(P.zeroT>6)die('YOU LOST YOURSELF')}else P.zeroT=0;
 updateEntity(dt);
 /* hallucination */
 if(P.san<45&&!GH.on&&R()<dt*(.04+(45-P.san)*.004)){const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);for(let a=0;a<20;a++){const ang=rnd(-.5,.5),c=Math.cos(ang),s=Math.sin(ang),dd=rnd(9,16),x=P.x+(fx*c-fz*s)*dd,z=P.z+(fx*s+fz*c)*dd,q=tc(x,z);if(!solidTile(q[0],q[1])&&rayClear(P.x,P.z,x,z)){GH.on=true;GH.x=x;GH.z=z;GH.t=rnd(2.5,5);break}}}
 if(GH.on){GH.t-=dt;if(GH.t<=0||Math.hypot(GH.x-P.x,GH.z-P.z)<6)GH.on=false;ghMesh.visible=GH.on;ghMesh.position.set(GH.x,1.5,GH.z);ghMesh.rotation.y=Math.atan2(P.x-GH.x,P.z-GH.z)}else ghMesh.visible=false;
 /* lights */
 FL.next-=dt;if(FL.next<=0){FL.next=rnd(14,34);const z=R()<.6?W.zone[pk]:ri(0,6),kind=R()<.55?'flicker':'out';FL.ev.push({z,kind,t:kind==='flicker'?rnd(1.5,4):rnd(3,8),n:0});if(R()<.35)FL.quiet=rnd(6,12)}
 FL.quiet=Math.max(0,FL.quiet-dt);const zv=shared.uZone.value;for(let k=0;k<7;k++)zv[k]=1;
 FL.ev=FL.ev.filter(e=>{e.t-=dt;e.n-=dt;if(e.n<=0){e.n=.05+Math.random()*.1;e.v=e.kind==='flicker'?(Math.random()<.5?1:.15):(Math.random()<.08?.6:.08)}zv[e.z]=Math.min(zv[e.z],e.v);return e.t>0});
 /* prompts */
 const a=aimTarget();let pr='';if(a){if(a.item)pr='[E] Take '+a.item.label;else if(a.door.locked)pr=P.keys?'[E] Unlock door':'[E] Locked door';else pr=a.door.target?'[E] Close door':'[E] Open door'}setPrompt(pr);
 for(const d of W.doors){if(d.open!==d.target){d.open+=Math.sign(d.target-d.open)*dt*2.2;if(Math.abs(d.open-d.target)<.05)d.open=d.target;d.mesh.rotation.y=d.open*d.dir*Math.PI/2}}
 /* audio levels */
 if(A.on){const c=A.ctx,tm=c.currentTime,zt=W.ztype[W.zone[pk]],qz=(ZT.quiet[zt]||FL.quiet>0)?.08:1,zf=zv[W.zone[pk]];
  const thr=E.state==='chase'?clamp(1-E.dist/30,.35,1):E.state==='stare'?.55:clamp(1-E.dist/25,0,.4);
  A.buzz.gain.setTargetAtTime(.05*qz*zf,tm,.08);A.vent.gain.setTargetAtTime(.05*(qz>.5?1:.4),tm,.3);A.drone.gain.setTargetAtTime(thr*.2,tm,.3);A.stat.gain.setTargetAtTime(thr*thr*.1+(P.san<30?.03:0),tm,.2);
  A.breath.gain.setTargetAtTime(P.san<50?(.03+(50-P.san)*.0012)*(.5+.5*Math.sin(P.time*(1.8+thr*2))):0,tm,.1);
  A.tFoot-=dt;if(A.tFoot<=0){A.tFoot=rnd(14,34);distantSteps()}A.tVoice-=dt;if(A.tVoice<=0){A.tVoice=rnd(25,60);voices()}
  A.tHeart-=dt;if(thr>.3&&A.tHeart<=0){A.tHeart=1.05-thr*.55;thud(.35*thr,0);setTimeout(()=>thud(.22*thr,0),170)}}
 /* glitch pulses */
 glitchT-=dt;if(glitchT<=0){glitchT=rnd(6,18)/(1+(E.state==='chase'?2:0));glitch=1}glitch=Math.max(0,glitch-dt*3);
 updHud()}

/* ---------- render ---------- */
const fwd=new THREE.Vector3();
function render(tm){
 const amp=P.sprinting?1.5:1,s1=Math.abs(Math.sin(P.bob*.5)),bobY=P.moving?(s1-.5)*.07*amp:0,nod=P.moving?(s1-.5)*.012*amp:0;
 cam.position.set(P.x,1.55+bobY,P.z);cam.rotation.order='YXZ';cam.rotation.set(P.pitch-nod,P.yaw,Math.sin(tm*.7)*.02*Math.pow(1-P.san/100,2));
 cam.getWorldDirection(fwd);shared.uCam.value.copy(cam.position);shared.uDir.value.copy(fwd);
 let fl=P.hasFlash&&P.flashOn&&P.bat>0?1:0;if(fl&&P.bat<.12)fl=Math.random()<.8?1:.15;shared.uFlash.value=fl;
 for(const m of chunkMeshes){m.visible=Math.hypot(m.userData.cx-P.x,m.userData.cz-P.z)<42}
 entMesh.visible=!(E.state==='wander'&&E.dist>40);
 postU.uTime.value=tm;postU.uVHS.value=vhs?1:0;postU.uSan.value=Math.pow(1-P.san/100,2)*.9;
 const thr=E.state==='chase'&&E.los?clamp(1-E.dist/14,0,1):0;postU.uStatic.value=thr*.6+(dying?dying*.8:0);postU.uGlitch.value=vhs?Math.max(glitch,thr*.5*Math.random()):0;postU.uFade.value=fade;
 renderer.setRenderTarget(rt);renderer.setClearColor(new THREE.Color(FOG[0],FOG[1],FOG[2]),1);renderer.clear();renderer.render(scene,cam);
 renderer.setRenderTarget(null);renderer.render(postScene,postCam)}
function fmtTs(){const d=new Date(1996,5,14,23,47,12+Math.floor(P.time)),p=n=>('0'+n).slice(-2);let h=d.getHours();const ap=h>=12?'PM':'AM';h=h%12||12;
 return p(d.getMonth()+1)+'/'+p(d.getDate())+'/'+d.getFullYear()+'<br>'+h+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' '+ap}
function setVhs(on){vhs=on;$('ts').style.display=$('rec').style.display=on?'block':'none';$('vhsTag').textContent='V: VHS '+(on?'ON':'OFF')}
let last=performance.now(),tsT=0,mtime=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;mtime+=dt;
 if(mode==='play'){update(dt);if(dying){dying+=dt;fade=Math.max(0,1-(dying-1)*1.4);E.x+=0;if(fade<=0&&mode==='play')showDead()}}
 else if(mode==='title'||mode==='load'){P.yaw+=dt*.08}
 tsT-=dt;if(vhs&&tsT<=0){tsT=.25;$('ts').innerHTML=fmtTs()}
 if(W)render(mtime)}

/* ---------- input ---------- */
function resize(){const w=Math.max(160,stage.clientWidth),h=Math.max(120,stage.clientHeight);renderer.setSize(w,h,false);postU.uOut.value.set(w,h)}
window.addEventListener('resize',resize);
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===view;if(!locked&&(mode==='play'||mode==='journal')&&!dying)setMode('pause')});
document.addEventListener('mousemove',e=>{if(mode==='play'&&!dying&&(locked||drag)){P.yaw-=(e.movementX||0)*.0023;P.pitch=clamp(P.pitch-(e.movementY||0)*.0023,-1.2,1.2)}});
view.addEventListener('mousedown',()=>{if(mode==='play'&&!locked){drag=true;lockPtr()}});
window.addEventListener('mouseup',()=>{drag=false});
window.addEventListener('blur',()=>{for(const k in K)K[k]=false;if(mode==='play'&&!dying)setMode('pause')});
window.addEventListener('keydown',e=>{
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();
 if(e.repeat)return;K[e.code]=true;
 if(e.code==='KeyV'){setVhs(!vhs);if(mode==='play')toast('VHS camera '+(vhs?'on':'off'),1400)}
 if(mode==='journal'){if(e.code==='KeyN'||e.code==='Escape'||e.code==='KeyE'){setMode('play');lockPtr()}return}
 if(mode!=='play'||dying){if((e.code==='Enter'||e.code==='Space')&&(mode==='title'||mode==='pause'||mode==='dead')){const b=$('go');if(b)b.click()}return}
 if(e.code==='KeyE')interact();else if(e.code==='KeyF')toggleFlash();else if(e.code==='KeyQ')useWater();else if(e.code==='KeyR')swapBattery();
 else if(e.code==='KeyN')openJournal(-1);else if(e.code==='Escape'||e.code==='KeyP')setMode('pause')});
window.addEventListener('keyup',e=>{K[e.code]=false});

/* ---------- boot ---------- */
$('overlay').innerHTML='<h2>GENERATING</h2><div class="sub">Laying carpet. Hanging lights.</div>';setMode('load');
setVhs(false);resize();
setTimeout(()=>{buildScene();P.x=((W.startK%N)+.5)*T;P.z=(((W.startK/N)|0)+.5)*T;E.x=-100;E.z=-100;E.state='wander';E.dist=99;showTitle();resize()},60);
requestAnimationFrame(frame);
})();
</script>
