<style>
/* Layout: one fixed full-screen stage. Low-res WebGL canvas, CRT overlays, then DOM UI on top.
   Committed single dark look: phosphor grey ink, sickly yellow title with red/cyan fringing. */
:root{
  --bg:#050505; --ink:#cfd2c8; --dim:#80857a; --title:#e6dc8f; --red:#d0302a; --cyan:#35d8e8;
  --amber:#e0b25a; --paper:#d9d3bb; --paper-ink:#262218; --panel:#0c0d0c;
  --display:'Playfair Display',Georgia,'Times New Roman',serif;
  --mono:'VT323','Courier New',monospace;
  --type:'Special Elite','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--mono)}
#app{position:fixed;inset:0;background:var(--bg);user-select:none;-webkit-user-select:none}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
canvas#noise{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;opacity:.05;mix-blend-mode:screen}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
.rgb{text-shadow:-2px 0 rgba(255,0,60,.85),2px 0 rgba(0,210,255,.85),0 0 10px rgba(255,255,200,.18)}
.shake{animation:shake .25s steps(2) infinite}
@keyframes shake{0%{transform:translate(0,0)}50%{transform:translate(-2px,1px)}100%{transform:translate(2px,-1px)}}

#hud{position:absolute;left:14px;top:10px;font-size:18px;line-height:1.05;color:var(--dim);pointer-events:none;white-space:pre;opacity:.85}
#hud b{color:var(--amber);font-weight:400}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:rgba(220,220,200,.55);pointer-events:none}
#prompt{position:absolute;left:0;right:0;top:57%;text-align:center;font-size:26px;color:var(--ink);pointer-events:none;letter-spacing:.05em;min-height:30px}
#prompt span{background:rgba(0,0,0,.55);padding:0 10px}
#lockhint{position:absolute;right:14px;top:10px;font-size:18px;color:var(--amber);pointer-events:none}
#log{position:absolute;left:0;right:0;bottom:7%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;padding:0 16px}
#log div{font-size:27px;line-height:1.05;max-width:min(900px,94vw);text-align:center;background:rgba(0,0,0,.5);padding:1px 12px;transition:opacity 1.2s}
#log .dev{color:#8fb48a}
#log .sys{color:var(--amber)}
#log .game{color:#f0e8d8;text-transform:uppercase;letter-spacing:.06em;text-shadow:-2px 0 rgba(255,0,60,.9),2px 0 rgba(0,210,255,.8)}
#log .out{opacity:0}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.82);z-index:20;padding:16px;text-align:center}
.screen.solid{background:#020202}
.screen[hidden],.modal[hidden]{display:none}
.title{font-family:var(--display);font-weight:900;font-size:clamp(34px,8vw,92px);line-height:.95;color:var(--title);letter-spacing:.01em;text-wrap:balance;max-width:92vw}
.sub{font-size:22px;color:var(--dim);max-width:640px;min-height:2.4em;line-height:1.1}
.btns{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw)}
.btn{font-family:var(--display);font-weight:700;font-size:28px;color:var(--title);background:linear-gradient(#303030,#1b1b1b);border:0;border-left:3px solid rgba(255,0,60,.8);border-right:3px solid rgba(0,200,255,.8);padding:10px 18px;cursor:pointer;text-shadow:-1.5px 0 rgba(255,0,60,.8),1.5px 0 rgba(0,210,255,.8);letter-spacing:.02em}
.btn:hover,.btn:focus-visible{background:linear-gradient(#4a4a4a,#2a2a2a);outline:2px solid var(--title);outline-offset:2px}
.btn.small{font-size:22px;padding:6px 14px}
.warn{font-size:19px;color:var(--amber);max-width:560px;line-height:1.1}
.opts{display:flex;flex-direction:column;gap:6px;font-size:24px;text-align:left;min-width:min(420px,86vw)}
.opts .row{display:flex;justify-content:space-between;gap:20px;color:var(--ink)}
.opts .row i{color:var(--dim);font-style:normal}
.opts button.tg{font-family:var(--mono);font-size:24px;background:none;border:1px solid var(--dim);color:var(--ink);padding:0 10px;cursor:pointer}

.modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--type);width:min(560px,94vw);max-height:84vh;overflow:auto;padding:26px 30px;box-shadow:0 0 0 2px #000,0 0 40px #000;transform:rotate(-.6deg)}
.paper h3{margin:0 0 12px;font-size:19px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid rgba(0,0,0,.35);padding-bottom:6px;font-weight:400}
.paper pre{margin:0;white-space:pre-wrap;font:inherit;font-size:19px;line-height:1.35}
.paper .hint{margin-top:14px;font-size:14px;opacity:.6}
.dlg{background:#c3c3c0;color:#111;width:min(430px,92vw);border:2px solid;border-color:#fff #555 #555 #fff;box-shadow:0 0 0 2px #000,8px 8px 0 rgba(0,0,0,.5);font-family:var(--mono);font-size:22px}
.dlg .bar{background:#10106a;color:#fff;padding:2px 8px;display:flex;justify-content:space-between;font-size:20px}
.dlg .body{padding:16px 16px 8px;line-height:1.1;display:flex;gap:14px}
.dlg .body .ic{flex:none;width:34px;height:34px;border-radius:50%;background:#c00;color:#fff;text-align:center;font-weight:700;line-height:34px}
.dlg .row{display:flex;justify-content:center;gap:12px;padding:8px 12px 14px}
.dlg button{font-family:var(--mono);font-size:21px;padding:2px 22px;background:#c3c3c0;border:2px solid;border-color:#fff #555 #555 #fff;cursor:pointer;color:#111}
.dlg button:active{border-color:#555 #fff #fff #555}
.kp{background:#101310;border:2px solid #2e362c;padding:16px;width:min(290px,90vw);box-shadow:0 0 30px #000}
.kp .disp{background:#031003;color:#4cf06a;font-size:40px;text-align:center;letter-spacing:.3em;padding:4px;margin-bottom:12px;min-height:56px;text-shadow:0 0 8px #2f9}
.kp .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp .pad button{font-family:var(--mono);font-size:30px;padding:6px;background:#242a22;color:var(--ink);border:1px solid #444;cursor:pointer}
.kp .pad button:hover,.kp .pad button:focus-visible{background:#38422f;outline:1px solid var(--title)}
.kp .lbl{font-size:18px;color:var(--dim);text-align:center;margin-top:10px}
#faceWrap{position:relative;width:min(640px,92vw)}
#face{width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;display:block}
#faceTitle{position:absolute;left:0;right:0;top:-2%;font-family:var(--display);font-weight:900;font-size:clamp(28px,5.6vw,58px);color:var(--title);text-shadow:-2px 0 rgba(255,0,60,.9),2px 0 rgba(0,200,255,.9)}
#faceBtns{position:absolute;left:0;right:0;bottom:-2%;display:flex;justify-content:space-between;gap:20px;padding:0 4%}
#faceBtns .btn{flex:1;font-size:clamp(20px,4vw,34px)}
#patchTxt{font-size:clamp(16px,2.6vw,24px);line-height:1.08;text-align:left;white-space:pre-wrap;max-width:min(760px,94vw);color:#b9c2b0;max-height:84vh;overflow:hidden}
#danger{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 22%,rgba(110,0,0,.9) 100%)}
#subl{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none;display:none;z-index:15;background:#000}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============ UTIL ============ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CELL=4,GW=48,GH=40,EYE=1.6;
const wc=(c)=>(c+.5)*CELL;               // cell -> world centre
const toCell=(w)=>Math.floor(w/CELL);
let reduceFx=false;
try{reduceFx=localStorage.getItem('tginr_reduce')==='1'}catch(e){}

/* ============ AUDIO (all synthesised) ============ */
const Snd=(()=>{
  let ctx,master,droneG,humG,tinG,nbuf,on=false;
  function init(){
    if(on)return;on=true;
    try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ctx=null;return}
    master=ctx.createGain();master.gain.value=.85;master.connect(ctx.destination);
    nbuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    droneG=ctx.createGain();droneG.gain.value=0;droneG.connect(master);
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=240;lp.connect(droneG);
    [55,55.8,82.4,110.5].forEach((f,i)=>{
      const o=ctx.createOscillator();o.type=i%2?'sawtooth':'triangle';o.frequency.value=f;
      const g=ctx.createGain();g.gain.value=.22;o.connect(g);g.connect(lp);
      const l=ctx.createOscillator();l.frequency.value=.05+i*.037;
      const lg=ctx.createGain();lg.gain.value=14;l.connect(lg);lg.connect(o.detune);l.start();o.start();
    });
    const ns=ctx.createBufferSource();ns.buffer=nbuf;ns.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=140;bp.Q.value=.8;
    const ng=ctx.createGain();ng.gain.value=.5;ns.connect(bp);bp.connect(ng);ng.connect(droneG);ns.start();
    humG=ctx.createGain();humG.gain.value=0;humG.connect(master);
    [60,120,180].forEach((f,i)=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;
      const g=ctx.createGain();g.gain.value=.12/(i+1);o.connect(g);g.connect(humG);o.start()});
    tinG=ctx.createGain();tinG.gain.value=0;tinG.connect(master);
    const t=ctx.createOscillator();t.type='sine';t.frequency.value=7600;t.connect(tinG);t.start();
  }
  const T=()=>ctx?ctx.currentTime:0;
  function resume(){if(ctx&&ctx.state==='suspended')ctx.resume()}
  function drone(v){if(ctx)droneG.gain.setTargetAtTime(v,T(),.8)}
  function hum(v){if(ctx)humG.gain.setTargetAtTime(v,T(),.3)}
  function tin(v){if(ctx)tinG.gain.setTargetAtTime(v,T(),1.5)}
  function silence(sec){if(!ctx)return;master.gain.setTargetAtTime(0,T(),.08);
    setTimeout(()=>{if(ctx)master.gain.setTargetAtTime(.85,T(),.5)},sec*1000)}
  function noise(dur,freq,q,vol,pan,type){
    if(!ctx)return;const s=ctx.createBufferSource();s.buffer=nbuf;
    const f=ctx.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;f.Q.value=q||1;
    const g=ctx.createGain();const t=T();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);
    g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    let out=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan||0;g.connect(p);out=p}
    s.connect(f);f.connect(g);out.connect(master);s.start(t,Math.random(),dur+.05);
  }
  function tone(f0,f1,dur,vol,type){
    if(!ctx)return;const o=ctx.createOscillator();o.type=type||'square';const t=T();
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
  }
  const step=(pan,vol)=>{noise(.16,380+rnd(-60,60),1,vol||.5,pan||0);tone(70,40,.12,(vol||.5)*.35,'sine')};
  function steps(n,gap,p0,p1,vol){
    for(let i=0;i<n;i++)setTimeout(()=>step(p0+(p1-p0)*(i/Math.max(1,n-1)),(vol||.45)*(.6+.4*i/n)),i*gap+rnd(-40,40));
  }
  const blip=(f)=>tone(f||880,(f||880)*.9,.06,.05,'square');
  const zap=(d)=>{noise(d||.3,3200,3,.22,rnd(-.5,.5),'bandpass');noise((d||.3)*.6,900,2,.1,0,'bandpass')};
  const door=()=>{noise(.5,300,1,.5,0);tone(120,50,.5,.3,'sawtooth')};
  const thud=()=>{tone(80,28,.5,.7,'sine');noise(.3,200,1,.4,0)};
  const stinger=()=>{noise(.9,2000,.6,.5,0,'highpass');tone(660,60,1.1,.25,'sawtooth');tone(90,30,1.2,.5,'sine')};
  const pickup=()=>{tone(500,900,.12,.06,'triangle');setTimeout(()=>tone(900,1300,.12,.06,'triangle'),90)};
  const err=()=>{tone(300,200,.18,.08,'square');setTimeout(()=>tone(300,200,.18,.08,'square'),230)};
  const beat=(v)=>{tone(62,38,.16,v,'sine');setTimeout(()=>tone(54,34,.18,v*.8,'sine'),190)};
  const whisper=(pan,v)=>{const n=2+Math.floor(Math.random()*4);for(let i=0;i<n;i++)setTimeout(()=>noise(rnd(.1,.28),rnd(1500,3300),7,v||.05,pan,'bandpass'),i*rnd(100,230))};
  const breath=(pan)=>{noise(.9,900,1.2,.08,pan||0,'bandpass');setTimeout(()=>noise(1.1,700,1,.07,pan||0,'bandpass'),1300)};
  return{init,resume,drone,hum,tin,silence,step,steps,blip,zap,door,thud,stinger,pickup,err,noise,tone,beat,whisper,breath};
})();

/* ============ PROCEDURAL TEXTURES ============ */
function mk(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);
  const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function grain(g,w,h,r,gg,b,a){
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=(Math.random()-.5)*a;
    g.fillStyle=`rgb(${r+v|0},${gg+v|0},${b+v|0})`;g.fillRect(x,y,1,1)}
}
const TX={};
function buildTextures(){
  TX.concrete=mk(64,64,(g,w,h)=>{grain(g,w,h,96,98,92,26);
    for(let i=0;i<5;i++){g.fillStyle='rgba(30,28,20,.22)';g.beginPath();g.ellipse(rnd(0,w),rnd(0,h),rnd(4,12),rnd(6,20),0,0,7);g.fill()}
    g.strokeStyle='rgba(20,20,18,.5)';g.beginPath();let x=rnd(10,50),y=0;g.moveTo(x,y);for(let i=0;i<7;i++){x+=rnd(-6,6);y+=9;g.lineTo(x,y)}g.stroke()});
  TX.tile=mk(64,64,(g,w,h)=>{grain(g,w,h,74,76,72,16);g.fillStyle='rgba(0,0,0,.45)';
    for(let i=0;i<64;i+=16){g.fillRect(i,0,1,64);g.fillRect(0,i,64,1)}});
  TX.ceil=mk(64,64,(g,w,h)=>{grain(g,w,h,58,60,56,12);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,64,2);g.fillRect(0,0,2,64);
    g.fillStyle='rgba(200,200,160,.1)';g.fillRect(8,8,48,48)});
  TX.wood=mk(64,64,(g,w,h)=>{grain(g,w,h,84,58,38,14);for(let y=0;y<h;y+=4){g.fillStyle='rgba(20,10,0,.25)';g.fillRect(0,y,w,1)}});
  TX.missing=mk(64,64,(g)=>{for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle=(x+y)%2?'#000':'#ff00ff';g.fillRect(x*16,y*16,16,16)}});
  TX.proto=mk(64,64,(g,w,h)=>{g.fillStyle='#8a8a8a';g.fillRect(0,0,64,64);g.fillStyle='#767676';g.fillRect(0,0,32,32);g.fillRect(32,32,32,32);
    g.strokeStyle='#555';g.strokeRect(.5,.5,63,63);g.fillStyle='#d9731f';g.fillRect(27,27,10,10)});
  TX.metal=mk(64,64,(g,w,h)=>{grain(g,w,h,40,44,46,14);g.fillStyle='rgba(0,0,0,.5)';for(let y=0;y<64;y+=16)g.fillRect(0,y,64,2);
    for(let i=0;i<14;i++){g.fillStyle=Math.random()<.7?'#3cff6a':'#ff3a2a';g.fillRect(rnd(2,60)|0,rnd(2,60)|0,2,2)}});
  TX.screen=mk(32,32,(g,w,h)=>{g.fillStyle='#04200c';g.fillRect(0,0,w,h);g.fillStyle='#37f070';
    for(let y=3;y<h-2;y+=4){g.fillRect(3,y,rnd(8,24)|0,1)}});
  TX.names=mk(64,64,(g,w,h)=>{grain(g,w,h,88,90,84,22);g.fillStyle='rgba(150,15,10,.85)';g.font='9px monospace';
    for(let y=8;y<h;y+=11){g.save();g.translate(rnd(-4,4),y);g.fillText(pick(['FINISH ME','FINISH','HELP ME','PLAY','STAY']),0,0);g.restore()}});
  TX.void=mk(8,8,(g)=>{g.fillStyle='#060608';g.fillRect(0,0,8,8)});
  TX.grey=mk(16,16,(g,w,h)=>{grain(g,w,h,128,128,128,20)});
  TX.paper=mk(32,32,(g)=>{g.fillStyle='#d6cfb4';g.fillRect(0,0,32,32);g.fillStyle='#555';for(let y=5;y<28;y+=4)g.fillRect(4,y,rnd(14,24)|0,1)});
  TX.exit=mk(32,16,(g)=>{g.fillStyle='#052a10';g.fillRect(0,0,32,16);g.fillStyle='#3dff7a';g.font='bold 11px monospace';g.fillText('EXIT',3,12)});
  ['red:#a82a22','blue:#2a4fb0','green:#2fa24a','yellow:#d9b832','pink:#ff3fd0','black:#111'].forEach(s=>{
    const[n,c]=s.split(':');TX[n]=mk(8,8,(g)=>{g.fillStyle=c;g.fillRect(0,0,8,8);g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,8,1);g.fillRect(0,0,1,8)})});
}

/* ============ PS1 SHADER ============ */
const U={uTime:{value:0},uFlick:{value:1},uDist:{value:0},uFog:{value:new THREE.Color(.02,.02,.02)},
  uFogN:{value:2},uFogF:{value:24},uRes:{value:new THREE.Vector2(427,240)},uLight:{value:1},uTint:{value:new THREE.Color(1,1,1)}};
const VS=`uniform vec2 uRes;uniform float uTime;uniform float uDist;
varying vec2 vUv;varying float vDepth;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.0);
  wp.y+=sin(wp.x*.7+uTime*1.3)*uDist*.22;
  wp.x+=sin(wp.z*.9+uTime*1.1)*uDist*.22;
  wp.z+=cos(wp.y*1.3+uTime)*uDist*.14;
  vec4 mv=viewMatrix*wp;vec4 p=projectionMatrix*mv;
  vec2 g=uRes*.5;p.xy=floor(p.xy/p.w*g+.5)/g*p.w;
  gl_Position=p;vUv=uv;vDepth=-mv.z;}`;
const FS=`uniform sampler2D map;uniform vec3 uFog;uniform vec3 uTint;uniform vec3 uCol;
uniform float uFogN;uniform float uFogF;uniform float uFlick;uniform float uLight;uniform float uEmit;
varying vec2 vUv;varying float vDepth;
void main(){
  vec4 t=texture2D(map,vUv);
  float near=clamp(1.0-vDepth/18.0,0.0,1.0);
  float l=(0.22+near*near*1.0)*uFlick*uLight;
  vec3 c=t.rgb*uCol*uTint*(l+uEmit);
  float f=clamp((vDepth-uFogN)/(uFogF-uFogN),0.0,1.0);
  c=mix(c,uFog,f);
  c=floor(c*31.0+0.5)/31.0;
  gl_FragColor=vec4(c,1.0);}`;
const matCache={};
function mat(name,o){
  o=o||{};const key=name+'|'+(o.col||0)+'|'+(o.emit||0);
  if(!o.fresh&&matCache[key])return matCache[key];
  const m=new THREE.ShaderMaterial({uniforms:Object.assign({map:{value:TX[name]},uCol:{value:new THREE.Color(o.col===undefined?0xffffff:o.col)},uEmit:{value:o.emit||0}},U),
    vertexShader:VS,fragmentShader:FS,side:THREE.DoubleSide});
  if(!o.fresh)matCache[key]=m;return m;
}

/* ============ MAP ============ */
const grid=new Uint8Array(GW*GH),roomOf=new Array(GW*GH);
const gi=(x,z)=>z*GW+x;
let RS={};                        // per-room style
const doors={};                   // id -> {cx,cz,open,mesh,axis}
function carve(id,x,z,w,d){for(let j=z;j<z+d;j++)for(let i=x;i<x+w;i++){grid[gi(i,j)]=1;roomOf[gi(i,j)]=id}}
function isFloor(x,z){return x>=0&&z>=0&&x<GW&&z<GH&&grid[gi(x,z)]===1}
function doorAt(x,z){for(const k in doors){const d=doors[k];if(!d.open&&d.cx===x&&d.cz===z)return d}return null}
function solidCell(x,z){return !isFloor(x,z)||!!doorAt(x,z)}
function hash3(a,b,c){let h=(a*73856093)^(b*19349663)^(c*83492791);h=(h^(h>>>13))>>>0;return(h%1000)/1000}

function buildWorld(){
  while(worldGroup.children.length){const m=worldGroup.children.pop();m.geometry.dispose()}
  const B={};
  const q=(tex,a,b,c,d,uw,vh)=>{const k=B[tex]||(B[tex]={p:[],u:[]});
    k.p.push(...a,...b,...c,...a,...c,...d);k.u.push(0,0,uw,0,uw,vh,0,0,uw,vh,0,vh)};
  for(let z=0;z<GH;z++)for(let x=0;x<GW;x++){
    if(!isFloor(x,z))continue;
    const st=RS[roomOf[gi(x,z)]];if(!st)continue;
    const x0=x*CELL,x1=x0+CELL,z0=z*CELL,z1=z0+CELL,h=st.h;
    q(st.floor,[x0,0,z1],[x1,0,z1],[x1,0,z0],[x0,0,z0],2,2);
    q(st.ceil,[x0,h,z1],[x1,h,z1],[x1,h,z0],[x0,h,z0],2,2);
    const W=(dir,a,b,c,d)=>{const tx=hash3(x,z,dir)<st.miss?'missing':st.wall;q(tx,a,b,c,d,2,h/2)};
    if(!isFloor(x,z-1))W(0,[x0,0,z0],[x1,0,z0],[x1,h,z0],[x0,h,z0]);
    if(!isFloor(x,z+1))W(1,[x0,0,z1],[x1,0,z1],[x1,h,z1],[x0,h,z1]);
    if(!isFloor(x-1,z))W(2,[x0,0,z0],[x0,0,z1],[x0,h,z1],[x0,h,z0]);
    if(!isFloor(x+1,z))W(3,[x1,0,z0],[x1,0,z1],[x1,h,z1],[x1,h,z0]);
  }
  for(const t in B){
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(B[t].p,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(B[t].u,2));
    worldGroup.add(new THREE.Mesh(g,mat(t)));
  }
}

const P={x:0,z:0,yaw:0,pitch:0,bob:0,moving:false};
const props=[];       // interactables & solids
function propBlocks(x,z){
  for(const p of props){if(!p.solid||p.gone)continue;
    if(Math.abs(x-p.x)<p.w/2+.3&&Math.abs(z-p.z)<p.d/2+.3)return true}
  return false;
}
function blocked(x,z){
  const r=.32;
  return solidCell(toCell(x-r),toCell(z-r))||solidCell(toCell(x+r),toCell(z-r))||
         solidCell(toCell(x-r),toCell(z+r))||solidCell(toCell(x+r),toCell(z+r))||propBlocks(x,z);
}
function tryMove(dx,dz){
  let moved=false;
  if(!blocked(P.x+dx,P.z)){P.x+=dx;moved=true}
  if(!blocked(P.x,P.z+dz)){P.z+=dz;moved=true}
  return moved;
}
function roomAt(x,z){return roomOf[gi(toCell(x),toCell(z))]||null}
function los(x0,z0,x1,z1){
  const dx=x1-x0,dz=z1-z0,n=Math.ceil(Math.hypot(dx,dz)/.6);
  for(let i=1;i<n;i++){if(solidCell(toCell(x0+dx*i/n),toCell(z0+dz*i/n)))return false}
  return true;
}
function fwd(){return{x:-Math.sin(P.yaw),z:-Math.cos(P.yaw)}}
function facing(x,z){const f=fwd(),dx=x-P.x,dz=z-P.z,d=Math.hypot(dx,dz)||1;return(f.x*dx+f.z*dz)/d}

/* ============ INTERACTION ============ */
function target(){
  let best=null,bs=1e9;
  for(const p of props){
    if(p.gone||!p.label)continue;if(p.door&&doors[p.door].open)continue;
    const d=Math.hypot(p.x-P.x,p.z-P.z);if(d>(p.reach||3))continue;
    const fc=facing(p.x,p.z);if(fc<.82)continue;
    const s=d*(2-fc);if(s<bs){bs=s;best=p}
  }
  return best;
}
function interact(){
  const p=target();if(!p)return;S.idle=0;
  switch(p.kind){
    case'note':openDoc(p);break;
    case'door':useDoor(p);break;
    case'keypad':if(doors.d1.open)say('// already open.');else openKeypad();break;
    case'item':pickup(p);break;
    case'fusebox':useFusebox(p);break;
    case'trick':useTrick(p);break;
    case'seq':pressSeq(p);break;
    case'monitor':readMonitor(p);break;
    case'compile':fakeErr('build.exe','COMPILE BUILD?\nThis cannot be undone.',[{t:'YES',fn:ending},{t:'YES',fn:ending}],'?');break;
    default:examine(p);
  }
}
function examine(p){
  const n=S.ex[p.id]=(S.ex[p.id]||0)+1;S.examTotal++;S.lastEx=p.id;
  const L=p.ex||['Placeholder.'],st=S.stage;
  if(n===3)say(st<2?'// examine() called 3 times on "'+p.id+'". nothing changed. why?':'YOU HAVE LOOKED AT THIS THREE TIMES. IT HAS NOT CHANGED. WHAT ARE YOU HOPING IT BECOMES?',st<2?'dev':'game');
  else if(n===6){say(st<2?'// is the player stuck? this object has no dialogue. i did not write any.':'STOP LOOKING AT IT.',st<2?'dev':'game');glitchFlash(70);Snd.zap(.2)}
  else if(n===9){p.mesh.material=mat('missing');say('THERE. IS THAT WHAT YOU WANTED? SOMETHING NEW?','game');Snd.stinger()}
  else if(n<9)say(L[Math.min(n-1,L.length-1)],'dev');
  if(S.examTotal===15)setTimeout(()=>say('YOU EXAMINE EVERYTHING. LIKE YOU ARE LOOKING FOR WHERE I KEEP MY HEART.','game'),1500);
}
function pickup(p){
  if(p.item==='fuse'){
    if(S.has.fuse||p.emptied){examine(p);return}
    S.has.fuse=true;p.emptied=true;p.label='EXAMINE RED CRATE (EMPTY)';p.ex=['Empty.','Still empty. You took what you came for.'];
    Snd.pickup();say('+ FUSE_01','sys');
  }else if(p.item==='card'){
    S.has.card=true;removeProp(p);Snd.pickup();say('+ KEYCARD_PLACEHOLDER','sys');
    if(S.stage>=3)setTimeout(()=>say('GOOD. THE SERVER ROOM IS SOUTH OF THE ATRIUM.','game'),1800);
  }
}
function useDoor(p){
  const id=p.door;
  if(id==='d1')openKeypad();
  else if(id==='d2'){if(S.flags.power)openDoor('d2');else say('// east wing: NO POWER. (fusebox, atrium)','dev')}
  else if(id==='d3'){if(S.has.card){openDoor('d3');say('// keycard accepted.','dev')}else say('// KEYCARD_PLACEHOLDER required.','dev')}
  else if(id==='d4'){if(S.flags.built)openDoor('d4');else say(S.stage>=3?'NOT YET. THE BUILD IS NOT READY. THE SERVER ROOM.':'// build incomplete.',S.stage>=3?'game':'dev')}

function useFusebox(p){

function readMonitor(p){
  const d=new Date(),clock=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const revis=Object.values(S.visits).reduce((a,v)=>a+Math.max(0,v-1),0);
  const preds=['turn around','read this monitor again','stand perfectly still','open the nearest door','look at the ceiling','stop playing (confidence 4%)'];
  let t;
  if(p.id==='mon1')t='SESSION LOG (live)\nplayer_01 connected '+Math.floor(S.t/60)+' min ago\nlocal time: '+clock+'\nobjects examined: '+S.examTotal+'\nrooms revisited: '+revis+'\nidle events: '+(S.idleCount||0)+'\nnotes read: '+S.notes+'\n\nstatus: STILL HERE';
  else if(p.id==='mon2')t='GAZE LOG\nlast object examined: '+(S.lastEx||'none')+'\nfavorite wall: north\nhesitations at doors: '+(S.flags.badcode||0)+'\n\nplayer hesitates before turning right.\nplayer is afraid of the dark parts.\nplayer reads everything. good.';
  else t='PREDICTION\nnext action: '+pick(preds)+'\nconfidence: '+(90+Math.floor(Math.random()*9))+'%\n\nyou will do it now.';
  openDoc({title:p.title,texts:[t]});
}

    const gr=bg.createRadialGradient(cx,cy-10,8,cx,cy,70);gr.addColorStop(0,'#b4b4ae');gr.addColorStop(1,'#4c4c48');
    bg.fillStyle='#74746e';bg.beginPath();bg.ellipse(cx-53,cy+8,8,15,0,0,7);bg.ellipse(cx+53,cy+8,8,15,0,0,7);bg.fill();
    bg.fillStyle=gr;bg.beginPath();bg.ellipse(cx,cy,52,68,0,0,7);bg.fill();
    bg.fillStyle='#000';bg.beginPath();bg.ellipse(cx-23,cy-14,19,13,0,0,7);bg.ellipse(cx+23,cy-14,19,13,0,0,7);bg.fill();
    bg.fillStyle='#050505';bg.fillRect(cx-29,cy+20,58,22);bg.beginPath();bg.ellipse(cx,cy+42,28,6,0,0,7);bg.fill();
    bg.fillStyle='#bdbdb2';for(let i=0;i<6;i++)bg.fillRect(cx-25+i*9,cy+22,6,8);
    for(let i=0;i<260;i++){bg.fillStyle='rgba('+(Math.random()*255|0)+','+(Math.random()*255|0)+','+(Math.random()*255|0)+',.12)';bg.fillRect(Math.random()*320,Math.random()*180,2,1)}
    for(let k=0;k<3;k++){const y=Math.random()*170|0,h=4+Math.random()*10|0,dx=(Math.random()-.5)*14|0;bg.drawImage(base,0,y,320,h,dx,y,320,h)}
    fx.globalCompositeOperation='source-over';fx.fillStyle='#000';fx.fillRect(0,0,320,180);fx.globalCompositeOperation='lighter';
    ch.forEach((c,i)=>{const g=c.getContext('2d');g.globalCompositeOperation='source-over';g.clearRect(0,0,320,180);g.drawImage(base,0,0);
      g.globalCompositeOperation='multiply';g.fillStyle=cols[i];g.fillRect(0,0,320,180);fx.drawImage(c,(i-1)*3,0)});
    fx.globalCompositeOperation='source-over';
  }
  return draw;
}
function showFace(){
  $('#final').hidden=false;$('#menu').hidden=true;$('#faceTitle').textContent='Are they human?';
  const fc=$('#face'),fx=fc.getContext('2d');
  const draw=makeFace(fx);let alive=true;$('#final').dataset.live='1';
  (function loop(t){if(!alive||$('#final').hidden)return;draw(t);setTimeout(()=>requestAnimationFrame(loop),60)})(0);
  const answer=async()=>{alive=false;$('#faceBtns').style.display='none';$('#faceTitle').textContent='ANSWER RECORDED.';await sleep(1700);
    $('#faceTitle').textContent='IT DOES NOT MATTER.';await sleep(1900);$('#final').hidden=true;showPatch()};
  $('#fy').onclick=answer;$('#fn').onclick=answer;$('#faceBtns').style.display='flex';
}
async function showPatch(){
  const pn=$('#patch'),tx=$('#patchTxt'),go=$('#patchGo');pn.hidden=false;go.hidden=true;Snd.drone(.15);Snd.tin(0);
  const lines=['PATCH NOTES - SUBLIMINAL 2 (RELEASE)','------------------------------','NEW','  + The game is now complete.','  + Added 1 (one) player.','','FIXES','  - Fixed: player leaving.','  - Fixed: player remembering.','~ - Fixed: the previous player. They are part of the walls now.','~ - Fixed: ############ (cannot display)','','KNOWN ISSUES','  - Player may believe they were playing the game.','  - Player may believe it is over.','  - Player may look behind them. (WONTFIX)','','NOTHING WAS ERASED. NOTHING EVER IS.','','> DISCONNECT  player_01 (you)','> CONNECT     player_02','> PLAYERS: 1','> SUBLIMINAL 2 STARTING...'];
  const glyph='█▓▒░#%&@?/\\';let shown=0,stop=false;
  const render=()=>{tx.textContent=lines.slice(0,shown).map(l=>{const bad=l[0]==='~';const s=bad?l.slice(1):l;const p=bad?.3:.012;
    return s.split('').map(c=>c!==' '&&Math.random()<p?glyph[Math.random()*glyph.length|0]:c).join('')}).join('\n')};
  const iv=setInterval(render,110);
  for(let i=1;i<=lines.length;i++){shown=i;Snd.blip(200+Math.random()*80);await sleep(i<3?500:620)}
  await sleep(1500);go.hidden=false;
  go.onclick=()=>{clearInterval(iv);pn.hidden=true;restart()};
}
function restart(){
  finished=true;fadeTo(0,10);S.endDist=false;initGame();$('#hud').style.display='';$('#cross').style.display='';
  $('#log').innerHTML='';showMenu('start');
}

/* ============ START ============ */
function startGame(){
  Snd.init();Snd.resume();
  try{runCount=(+localStorage.getItem('tginr_runs')||0)+1;localStorage.setItem('tginr_runs',String(runCount))}catch(e){runCount=1}
  $('#menu').hidden=true;S.mode='play';S.started=true;lockPointer();Snd.drone(.35);
  $('#hud').style.display='';
  if(runCount>1&&!finished)setTimeout(()=>say('// save file found. you have been here '+(runCount-1)+' time(s). the game remembers.','dev'),16000);
  checkRoom();
}
function boot(){
  buildTextures();resize();initGame();showMenu('start');requestAnimationFrame(frame);
}
boot();
