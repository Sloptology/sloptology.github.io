<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Realms of Ruin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:dark;--bg:#0d0c11;--ink:#e9e1cc;--dim:#938b76;--ember:#e0672c;--gold:#e3b653;--panel:#17141bee;--line:#3b3545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2a1a14ee,#0d0c11f2 70%);padding:16px;overflow:auto;text-align:center}
#ov h1{font-size:clamp(40px,8vw,84px);margin:0;font-weight:700;letter-spacing:.02em;color:var(--ember);text-shadow:0 0 30px #e0672c55,0 4px 0 #000}
#ov p{max-width:560px;color:var(--dim);line-height:1.5;margin:8px 0 18px}
#cls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px}
.c{width:165px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--k);color:var(--ink);padding:12px;text-align:left;font:inherit;cursor:pointer;border-radius:3px}
.c:hover,.c:focus-visible{border-color:var(--k);outline:2px solid var(--k);outline-offset:2px}
.c b{display:block;font-size:18px;color:var(--k);margin-bottom:4px}.c span{font-size:13px;color:var(--dim);line-height:1.35}
#inv{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:270px;max-height:38vh;overflow:auto;font-size:12px;line-height:1.35;background:var(--panel);border:1px solid var(--line);padding:6px 8px;display:none;pointer-events:none}
#inv div{margin:2px 0}
</style></head><body>
<canvas id="c"></canvas><div id="inv"></div>
<div id="ov"><h1>Realms of Ruin</h1><p>Survive the rising dark. Open chests, stack relics, and break the world with combinations nobody should have. Slay each stage’s boss to descend.<br>WASD move · mouse aim · click attack · Space or right-click special · E open chests and shrines</p><div id="cls"></div></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),WS=2200,FT='Palatino,Georgia,serif';
let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
const K={},M={x:0,y:0,d:0},cam={x:0,y:0};
addEventListener('keydown',e=>{K[e.key.toLowerCase()]=1;if(e.key==' ')e.preventDefault()});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
cv.addEventListener('mousemove',e=>{M.x=e.clientX;M.y=e.clientY});
cv.addEventListener('mousedown',e=>{M.x=e.clientX;M.y=e.clientY;if(e.button==2)K.rmb=1;else M.d=1});
addEventListener('mouseup',e=>{if(e.button==2)K.rmb=0;else M.d=0});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const CL={
warrior:{n:'Warrior',d:'Heavy blade arcs, huge health. Special: Shield Slam stuns and hurls foes back.',hp:170,sp:140,col:'#c9ced6',cd:.5,sc:6},
mage:{n:'Mage',d:'Exploding, igniting fireballs. Special: Frost Nova chills everything near.',hp:100,sp:150,col:'#ff8a3a',cd:.55,sc:7},
wizard:{n:'Wizard',d:'Piercing arcane missiles. Special: Blink, leaving a curse that amplifies damage.',hp:95,sp:150,col:'#a58cff',cd:.3,sc:5},
summoner:{n:'Summoner',d:'Raises skeleton thralls that fight for you. Special: Call the Horde.',hp:110,sp:145,col:'#5fe0b0',cd:.55,sc:10},
assassin:{n:'Assassin',d:'Fast daggers, high crit. Special: Shadowstep makes your next hit a triple backstab.',hp:90,sp:185,col:'#d04a72',cd:.22,sc:5}};
const IT=[
['whet','Whetstone',0,'+12% damage'],['boots','Worn Boots',0,'+8% move speed'],['ring','Iron Ring',0,'+25 max health'],
['charm','Rabbit’s Foot',0,'+6% crit chance'],['herb','Healing Moss',0,'+1.2 health regen per second'],['sand','Hourglass Sand',0,'+10% attack and special speed'],
['serr','Serrated Edge',1,'Hits cause stacking bleed'],['frost','Frost Rune',1,'Hits slow enemies'],['vial','Venom Vial',1,'Hits poison enemies'],
['fang','Vampire Fang',1,'Heal 3% of damage dealt'],['tot','Bone Totem',1,'+1 skeleton thrall, stronger thralls'],['ember','Pyre Brand',1,'Hits set enemies ablaze'],
['bomb','Blood Bomb',2,'Bleeding enemies explode on death'],['spark','Stormcaller Sigil',2,'12% per hit: lightning chains to 3 foes'],
['shard','Shatter Shard',2,'Slowed enemies take +35% damage'],['echo','Echo Rune',2,'12% chance attacks repeat'],
['thorn','Thornmail',2,'-8% damage taken, reflects damage'],['pyre','Cinderheart',2,'Burning enemies spread fire and burst on death'],
['phoenix','Phoenix Feather',3,'Revive once in a fiery nova'],['scythe','Reaper’s Scythe',3,'Kills heal 3 and trim special cooldown 1s'],
['wyrm','Wyrm Tooth',3,'Crits inflict bleed, burn and poison'],
['ruin','Crown of Ruin',4,'+50% damage; every 6th attack unleashes a shockwave'],['abyss','Abyss Heart',4,'Every kill explodes for 20% of its max health']];
const RN=['Common','Uncommon','Rare','Legendary','Mythical'],RC=['#b9b3a0','#6fcf8f','#5aa8f0','#f0a63c','#e04ab0'];
const BI=[{n:'Cursed Forest',g:'#111d17',p:'#1b3527',a:'#2f6044'},{n:'Ruined Castle',g:'#18171e',p:'#2c2a38',a:'#55516a'},{n:'Forgotten Dungeon',g:'#1a1511',p:'#33271d',a:'#6a4e36'},{n:'Ember Realm',g:'#1d0f0d',p:'#40201a',a:'#9a3d22'}];
const BO=['The Hollow King','Gravewarden Morrow','Ashen Wyrmling','Lord of Ruin'];
const ET={skel:{hp:30,sp:70,d:8,r:12,c:'#d9d3bd',g:4,x:6},imp:{hp:16,sp:125,d:6,r:9,c:'#e6553a',g:3,x:4},
arch:{hp:22,sp:55,d:9,r:11,c:'#7fc78c',g:5,x:7,rng:1},brute:{hp:130,sp:42,d:20,r:20,c:'#8f6aa3',g:14,x:20},boss:{hp:900,sp:50,d:24,r:36,c:'#c23a4a',g:120,x:150}};
let P,G,E=[],PR=[],EP=[],AL=[],FX=[],CH=[],PRP=[],TS=[],run=0;
const n=id=>P.items[id]||0,rn=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),ds=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const dif=()=>1+G.t/60*.32+(G.st-1)*.45,dm=()=>1+(dif()-1)*.55,pd=()=>1+.12*n('whet')+.5*(n('ruin')>0)+.04*(P.lv-1);
const angd=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
const aim=()=>Math.atan2(M.y+cam.y-P.y,M.x+cam.x-P.x);
const toast=(s,c='#e9e1cc')=>TS.push({s,c,l:3});
const el=document.getElementById('ov'),inv=document.getElementById('inv');
function menu(msg){el.style.display='flex';el.querySelector('p').innerHTML=msg||el.querySelector('p').innerHTML;
const d=document.getElementById('cls');d.innerHTML='';for(const k in CL){const b=document.createElement('button');b.className='c';b.style.setProperty('--k',CL[k].col);b.innerHTML='<b>'+CL[k].n+'</b><span>'+CL[k].d+'</span>';b.onclick=()=>start(k);d.appendChild(b)}}
function start(k){G={k,t:0,st:1,stT:0,boss:0,sp:1,mt:1,opened:0,kills:0,next:0,near:0};
P={x:WS/2,y:WS/2,hp:CL[k].hp,mh:CL[k].hp,lv:1,xp:0,gold:60,items:{},cd:0,scd:0,inv:0,ih:0,n:0};
AL=[];genStage();el.style.display='none';inv.style.display='block';invUp();run=1}
function genStage(){const b=BI[(G.st-1)%4];G.stT=0;G.boss=0;E=[];PR=[];EP=[];FX=[];CH=[];PRP=[];
for(let i=0;i<110;i++)PRP.push({x:rn(0,WS),y:rn(0,WS),r:rn(14,34),t:G.st%2==0&&Math.random()<.5});
for(let i=0;i<9;i++)CH.push({x:rn(150,WS-150),y:rn(150,WS-150),t:'c',u:0});
for(let i=0;i<3;i++)CH.push({x:rn(150,WS-150),y:rn(150,WS-150),t:'s',u:0});
P.x=WS/2;P.y=WS/2;P.hp=Math.min(P.mh,P.hp+P.mh*.35);AL.forEach(a=>{a.x=P.x;a.y=P.y});
toast('Stage '+G.st+': '+b.n,'#e3b653')}
function roll(min){const w=[60,27,9*(1+G.st*.15),2.5*(1+G.st*.2),.5*(1+G.st*.3)];let t=0;for(let i=min;i<5;i++)t+=w[i];let r=Math.random()*t,k=4;
for(let i=min;i<5;i++){if(r<w[i]){k=i;break}r-=w[i]}const p=IT.filter(i=>i[2]==k);return p[Math.random()*p.length|0]}
function give(it){P.items[it[0]]=n(it[0])+1;if(it[0]=='ring')P.hp+=25;
toast(RN[it[2]]+': '+it[1]+' - '+it[3],RC[it[2]]);if(it[2]>=3)FX.push({t:'ring',x:P.x,y:P.y,R:260,l:.6,c:RC[it[2]]});invUp()}
function invUp(){inv.innerHTML=IT.filter(i=>n(i[0])).map(i=>'<div style="color:'+RC[i[2]]+'"><b>'+i[1]+(n(i[0])>1?' x'+n(i[0]):'')+'</b> <span style="color:#938b76">'+i[3]+'</span></div>').join('')||'<div style="color:#938b76">No relics yet. Find a chest (E).</div>'}
const pop=(x,y,d,cr)=>FX.push({t:'tx',x,y,s:Math.round(d),c:cr?'#ffd34d':'#fff',l:.7});
function boom(x,y,R,d,c){FX.push({t:'ring',x,y,R,l:.3,c});for(const e of E)if(!e.dead&&Math.hypot(e.x-x,e.y-y)<R+e.r)hurt(e,d,{dot:1})}
function hurt(e,d,o={}){const cr=!o.dot&&Math.random()<.05+.06*n('charm')+(G.k=='assassin'?.25:0);
if(cr)d*=2;if(e.slow>0)d*=1+.35*n('shard');if(e.cu>0)d*=1.25;e.hp-=d;
if(!o.dot){e.fl=.08;pop(e.x,e.y-e.r,d,cr);P.hp=Math.min(P.mh,P.hp+d*.03*n('fang'));
if(n('serr')||cr&&n('wyrm')){e.bleed=4;e.bs=Math.min(10,(e.bs||0)+Math.max(1,n('serr')))}
if(n('frost'))e.slow=2;if(n('vial')||cr&&n('wyrm'))e.pois=4;if(n('ember')||cr&&n('wyrm'))e.burn=3;
if(Math.random()<.12*n('spark')){let c=0;for(const o2 of E)if(o2!=e&&!o2.dead&&c<3&&ds(o2,e)<150){c++;FX.push({t:'ln',x:e.x,y:e.y,x2:o2.x,y2:o2.y,l:.2});hurt(o2,10*pd(),{dot:1})}}}
if(e.hp<=0&&!e.dead)kill(e)}
function kill(e){e.dead=1;G.kills++;P.gold+=Math.round(e.g*(1+(G.st-1)*.25));P.xp+=e.xp;
while(P.xp>=22*Math.pow(P.lv,1.35)){P.xp-=22*Math.pow(P.lv,1.35);P.lv++;P.hp+=12;toast('Level '+P.lv,'#e3b653')}
if(e.bleed>0&&n('bomb'))boom(e.x,e.y,75,25*n('bomb')*pd(),'#c0203a');
if(e.burn>0&&n('pyre')){for(const o of E)if(!o.dead&&ds(o,e)<120)o.burn=3;boom(e.x,e.y,65,12*n('pyre')*pd(),'#ff7a20')}
if(n('abyss'))boom(e.x,e.y,95,.2*e.mh*n('abyss'),'#b040e0');
if(n('scythe')){P.scd-=n('scythe');P.hp=Math.min(P.mh,P.hp+3*n('scythe'))}
if(e.boss){FX.push({t:'ring',x:e.x,y:e.y,R:400,l:.8,c:'#e3b653'});give(roll(2));P.gold+=150;G.next=3.5;toast(e.nm+' has fallen','#e3b653')}}
function hurtP(d,s){if(P.ih>0)return;d/=1+.08*n('thorn');P.hp-=d;P.ih=.35;
if(s&&n('thorn'))hurt(s,8*n('thorn')*pd(),{dot:1});FX.push({t:'tx',x:P.x,y:P.y-18,s:Math.round(d),c:'#ff5a5a',l:.7});
if(P.hp<=0){if(n('phoenix')){P.items.phoenix--;P.hp=P.mh;P.ih=1.5;boom(P.x,P.y,230,90*pd(),'#ffb040');toast('The Phoenix Feather burns away','#f0a63c');invUp()}else over()}}
function over(){run=0;inv.style.display='none';menu('Fallen on stage '+G.st+' ('+BI[(G.st-1)%4].n+') after '+Math.floor(G.t/60)+'m '+Math.floor(G.t%60)+'s. Level '+P.lv+', '+G.kills+' kills, '+IT.filter(i=>n(i[0])).reduce((a,i)=>a+n(i[0]),0)+' relics. Choose a class to descend again.')}
function strike(e,b){if(P.inv>0){b*=3;P.inv=0}hurt(e,b)}
function atk(echo){const k=G.k,a=aim(),d=pd();P.n++;
if(k=='warrior'||k=='assassin'){const R=k=='warrior'?80:54,ar=k=='warrior'?1.7:2.1,b=(k=='warrior'?24:13)*d;
FX.push({t:'arc',x:P.x,y:P.y,a,R,ar,l:.15,c:CL[k].col});
for(const e of E)if(!e.dead&&ds(e,P)<R+e.r&&Math.abs(angd(Math.atan2(e.y-P.y,e.x-P.x),a))<ar/2)strike(e,b)}
else{const o={x:P.x,y:P.y,vx:Math.cos(a)*440,vy:Math.sin(a)*440,life:1.3,h:[]};
if(k=='mage')Object.assign(o,{d:18*d,r:7,aoe:58,c:'#ff8a3a'});
if(k=='wizard')Object.assign(o,{d:14*d,r:5,pi:2,home:1,c:'#a58cff'});
if(k=='summoner')Object.assign(o,{d:10*d,r:5,c:'#5fe0b0'});PR.push(o)}
if(n('ruin')&&P.n%6==0)boom(P.x,P.y,160,30*d,'#e04ab0');
if(!echo&&Math.random()<.12*n('echo'))setTimeout(()=>run&&atk(1),120)}
function special(){const k=G.k,a=aim(),d=pd();P.scd=CL[k].sc/(1+.1*n('sand'));
if(k=='warrior'){FX.push({t:'ring',x:P.x,y:P.y,R:125,l:.3,c:'#c9ced6'});for(const e of E)if(!e.dead&&ds(e,P)<125+e.r){const m=ds(e,P)||1;e.st=1.3;e.kx=(e.x-P.x)/m*500;e.ky=(e.y-P.y)/m*500;hurt(e,32*d)}}
if(k=='mage'){FX.push({t:'ring',x:P.x,y:P.y,R:170,l:.4,c:'#8fd8ff'});for(const e of E)if(!e.dead&&ds(e,P)<170+e.r){e.slow=3.5;hurt(e,16*d)}}
if(k=='wizard'){for(const e of E)if(!e.dead&&ds(e,P)<140)e.cu=5;FX.push({t:'ring',x:P.x,y:P.y,R:140,l:.5,c:'#a58cff'});
const m=Math.min(320,Math.hypot(M.x+cam.x-P.x,M.y+cam.y-P.y));P.x=cl(P.x+Math.cos(a)*m,15,WS-15);P.y=cl(P.y+Math.sin(a)*m,15,WS-15);P.ih=.5;
for(const e of E)if(!e.dead&&ds(e,P)<140)e.cu=5;FX.push({t:'ring',x:P.x,y:P.y,R:140,l:.5,c:'#a58cff'})}
if(k=='summoner')for(let i=0;i<3;i++)AL.push({x:P.x+rn(-30,30),y:P.y+rn(-30,30),hp:50,mh:50,cd:0,tmp:10});
if(k=='assassin'){P.x=cl(P.x+Math.cos(a)*190,15,WS-15);P.y=cl(P.y+Math.sin(a)*190,15,WS-15);P.inv=3.5;P.ih=.4;toast('Shadowstep: next hit deals triple damage','#d04a72')}}
function spawn(t,x,y,boss){const b=ET[t],s=dif();E.push({t,x:cl(x,20,WS-20),y:cl(y,20,WS-20),hp:b.hp*s,mh:b.hp*s,sp:b.sp*(1+(s-1)*.12),d:b.d,r:b.r,c:b.c,g:b.g,x:0,xp:b.x,rng:b.rng,cd:rn(0,1),slow:0,st:0,cu:0,fl:0,kx:0,ky:0,boss:boss,bt:2,nm:boss?BO[(G.st-1)%4]:''});
const e=E[E.length-1];e.xp=b.x;e.x=cl(x,20,WS-20)}
function shot(e,a,sp,d){EP.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,d,l:3})}
function upd(dt){G.t+=dt;G.stT+=dt;cam.x=P.x-W/2;cam.y=P.y-H/2;const pdv=pd();
let mx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),my=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0),ml=Math.hypot(mx,my)||1,sp=CL[G.k].sp*(1+.08*n('boots'));
P.x=cl(P.x+mx/ml*sp*dt,15,WS-15);P.y=cl(P.y+my/ml*sp*dt,15,WS-15);P.cd-=dt;P.scd-=dt;P.inv-=dt;P.ih-=dt;
P.mh=CL[G.k].hp+12*(P.lv-1)+25*n('ring');P.hp=Math.min(P.mh,P.hp+(.6+1.2*n('herb'))*dt);
if(M.d&&P.cd<=0){P.cd=CL[G.k].cd/(1+.1*n('sand'));atk(0)}if((K[' ']||K.rmb)&&P.scd<=0)special();
G.near=0;let bd=60;for(const o of CH)if(!o.u&&ds(o,P)<bd){bd=ds(o,P);G.near=o}
if(K.e&&!K.eh){K.eh=1;const o=G.near;if(o){const c=Math.round(25*(1+.35*(G.st-1))*Math.pow(1.18,G.opened));
if(o.t=='c'){if(P.gold>=c){P.gold-=c;G.opened++;o.u=1;give(roll(0))}else toast('Need '+c+' gold','#ff8a8a')}
else if(P.hp>P.mh*.4){P.hp-=P.mh*.3;o.u=1;give(roll(1))}else toast('Too weak for the Blood Shrine','#ff8a8a')}}if(!K.e)K.eh=0;
if(G.next>0){G.next-=dt;if(G.next<=0){G.st++;genStage()}}
else if(!G.boss&&G.stT>75){G.boss=1;const a=rn(0,6.28);spawn('boss',P.x+Math.cos(a)*500,P.y+Math.sin(a)*500,1);toast(BO[(G.st-1)%4]+' awakens','#e0672c')}
G.sp-=dt;if(G.sp<=0&&E.length<110&&!G.next){const c=1+Math.floor(dif()/2.5);for(let i=0;i<c;i++){const a=rn(0,6.28),r=rn(480,650),w=Math.random(),t=G.stT>40&&w<.2?'arch':G.stT>20&&w<.45?'imp':(G.st>1||G.stT>50)&&w>.88?'brute':'skel';spawn(t,P.x+Math.cos(a)*r,P.y+Math.sin(a)*r)}G.sp=Math.max(.35,1.6/(1+dif()*.35))}
G.mt-=dt;const cap=(G.k=='summoner'?3:0)+n('tot');if(G.mt<=0){G.mt=3.5;if(AL.filter(a=>!a.tmp).length<cap)AL.push({x:P.x,y:P.y,hp:40+P.lv*6,mh:40+P.lv*6,cd:0})}
for(const e of E){if(e.dead)continue;e.fl-=dt;e.cd-=dt;e.slow-=dt;e.st-=dt;e.cu-=dt;
if(e.bleed>0){e.bleed-=dt;hurt(e,e.bs*3*pdv*dt,{dot:1})}if(e.pois>0){e.pois-=dt;hurt(e,5*pdv*dt,{dot:1})}if(e.burn>0){e.burn-=dt;hurt(e,7*pdv*dt,{dot:1})}if(e.dead)continue;
e.x=cl(e.x+e.kx*dt,0,WS);e.y=cl(e.y+e.ky*dt,0,WS);e.kx*=.9;e.ky*=.9;
let t=P,td=ds(e,P);if(P.inv>0&&td>90){t=null;let b=1e9;for(const a of AL){const q=ds(a,e);if(q<b){b=q;t=a}}}
const spd=e.sp*(e.slow>0?.5:1)*(e.st>0?0:1);
if(t){const dx=t.x-e.x,dy=t.y-e.y,d=Math.hypot(dx,dy)||1;let dir=1;
if(e.rng){dir=d>260?1:d<190?-1:0;if(e.cd<=0&&d<430&&e.st<=0){e.cd=2.2;shot(e,Math.atan2(dy,dx),210,e.d*dm())}}
e.x+=dx/d*spd*dir*dt;e.y+=dy/d*spd*dir*dt;
if(!e.rng&&d<e.r+(t==P?13:11)&&e.cd<=0&&e.st<=0){e.cd=.8;if(t==P)hurtP(e.d*dm(),e);else t.hp-=e.d*dm()}}
if(e.boss){e.bt-=dt;if(e.bt<=0){e.bt=2.6;const o=rn(0,6);for(let i=0;i<14;i++)shot(e,o+i*Math.PI*2/14,170,12*dm());
if(e.hp<e.mh*.5)for(let i=0;i<3;i++)spawn('imp',e.x+rn(-60,60),e.y+rn(-60,60))}}}
for(const a of AL){a.cd-=dt;if(a.tmp&&(a.tmp-=dt)<=0)a.hp=0;let t=null,b=380;for(const e of E)if(!e.dead&&ds(e,a)<b){b=ds(e,a);t=e}
