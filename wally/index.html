<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#050303;font:13px Tahoma,Verdana,sans-serif;color:var(--ink);user-select:none}
#desk{position:fixed;inset:0 0 34px 0;background:radial-gradient(ellipse at 30% 20%,#2a1515,#050303 75%);overflow:hidden}
#icons{position:absolute;inset:0}

.ic{position:absolute;touch-action:none;width:78px;text-align:center;color:#fff;cursor:pointer;padding:4px;text-shadow:1px 1px 2px #000;font-size:12px}
.ic i{font-style:normal;font-size:32px;display:block}
.ic:hover,.ic.sel{background:rgba(255,255,255,.18)}
.ic.new{animation:pop 1.2s 3}

.win{position:absolute;background:var(--face);border:2px outset var(--hi);box-shadow:3px 3px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;max-width:calc(100vw - 8px);max-height:calc(100% - 4px)}
.tb{background:linear-gradient(90deg,#2a0b0e,#6b1d1d);color:#fff;padding:3px 6px;display:flex;justify-content:space-between;cursor:move;font-weight:bold}
.tb button{width:20px;height:18px;padding:0;line-height:14px}
.bd{overflow:auto;flex:1;background:var(--paper);margin:3px;border:2px inset var(--hi);padding:10px;user-select:text}
button{font:inherit;background:var(--face);border:2px outset var(--hi);padding:2px 10px;cursor:pointer;color:var(--ink)}
button:active{border-style:inset}
#bar{position:fixed;left:0;right:0;bottom:0;height:34px;background:var(--face);border-top:2px outset var(--hi);display:flex;align-items:center;gap:4px;padding:2px 4px;padding-bottom:calc(2px + env(safe-area-inset-bottom,0px))}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden}
#tray{border:2px inset var(--hi);padding:3px 8px;white-space:nowrap}
.addr{display:flex;gap:4px;margin-bottom:4px}.addr input{flex:1;font:inherit;padding:2px 4px;min-width:0}
.bm{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--sh)}
.bm button{font-size:12px;padding:1px 8px}
a.l{color:#1a3fa8;text-decoration:underline;cursor:pointer}
.post{border:1px solid #6b6552;margin:8px 0;background:#cfc8b4}
.post h5{margin:0;padding:4px 8px;background:#b9b199;font-size:12px}
.post p{margin:0;padding:8px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.72))}
#desk{filter:brightness(calc(1 - var(--dk,0)))}
.mention{background:#d8c98a}
.me{color:#7a1a1a}
.nf{position:absolute;right:10px;bottom:10px;background:#2a1a14;color:#e8d9b5;border:1px solid #7a1d1d;padding:8px 10px;max-width:240px;cursor:pointer;z-index:99}
h3,h4{margin:4px 0 8px}
.fz{animation:fz 4s infinite}.late .fz{animation-duration:1.2s}
@keyframes fz{0%,94%,100%{transform:none;opacity:1}95%{transform:translateX(2px);opacity:.6}97%{transform:translateX(-2px) skewX(2deg)}}
.wb{display:flex;gap:2px}
.fh{background:#3a2f55;color:#fff;display:flex;align-items:center;gap:12px;padding:6px 10px;margin:-10px -10px 8px}
.bt{cursor:pointer;font-size:18px;color:#fff}
.bdg{background:#d33;color:#fff;border-radius:8px;padding:0 5px;font-size:11px;position:relative;top:-8px;left:-3px}
.avs{display:inline-flex;width:22px;height:22px;background:#7a5c9e;color:#fff;align-items:center;justify-content:center;font-weight:bold}
.post.mine h5{background:#9aaec0}
.rowu{padding:7px 4px;border-bottom:1px solid #ddd;cursor:pointer}
canvas{background:#000;display:block;max-width:100%}
.pix{image-rendering:pixelated;width:100%;display:block;border:2px inset #fff}
</style>
</head>
<body>
<div id="desk"><div id="icons"></div></div>
<div id="bar"><button onclick="startMenu()"><b>Start</b></button><div id="tasks"></div><div id="tray"></div></div>
<script>
const $=s=>document.querySelector(s);

const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const ME="jason1983";
let S={day:1,phase:0,min:8*60+12,wins:{},z:10,url:"home",hist:[],replied:false,mention:true,bin:[
 {n:"homework_final.doc",t:"Essay on the Industrial Revolution. 3 paragraphs. No grade."},

 {id:"pics",l:"Pictures",e:"🖼️",p:0,o:()=>openPics()},
 {id:"mailbox",l:()=>"Mail"+(S.mail.filter(m=>!m.read).length?" ("+S.mail.filter(m=>!m.read).length+")":""),e:"📧",p:0,o:()=>openMail()},

 {id:"tape",l:"scan_01.avi",e:"🎞️",p:1,o:()=>openPlayer()},
 {id:"nts",l:"notes_re_wally.txt",e:"📄",p:0,d:5,o:()=>openText("notes_re_wally.txt",NOTES())},

/* ---- clock & phases ---- */
function clock(){const h=Math.floor(S.min/60)%24,m=S.min%60;return (h%12||12)+":"+String(m).padStart(2,"0")+(h<12?" AM":" PM")}
function adv(m){S.min+=m;tray()}
function tray(){$("#tray").textContent=DATES[S.day-1]+" · "+clock()+(S.day>=12?" · 3":"");document.body.className=S.phase>=1?"late":"";document.body.style.setProperty("--dk",Math.min(.5,S.day*.03+((S.min%1440>=1140||S.min%1440<360)?.12:0)))}
function setPhase(p){S.phase=p;icons(true)}
/* ---- windows ---- */
function win(id,title,html,w,x,y){
 if(S.wins[id]){const e=S.wins[id];e.style.display="flex";e.style.zIndex=++S.z;e.querySelector(".bd").innerHTML=html;tasks();return e}
 const e=document.createElement("div");e.className="win";e.style.cssText=`width:${Math.min(w||460,innerWidth-8)}px;left:${Math.max(4,Math.min(x||60,innerWidth-(w||460)-8))}px;top:${y||30}px;z-index:${++S.z}`;
 e.innerHTML=`<div class="tb"><span>${esc(title)}</span><span class="wb"><button data-a="min">_</button><button data-a="max">&#9633;</button><button data-a="x">x</button></span></div><div class="bd">${html}</div>`;
 $("#desk").appendChild(e);S.wins[id]=e;e.dataset.t=title;
 e.onmousedown=()=>e.style.zIndex=++S.z;
 e.querySelector(".wb").onclick=ev=>{const a=ev.target.dataset.a;if(a==="x"){e.remove();delete S.wins[id]}else if(a==="min")e.style.display="none";else if(a==="max")maxToggle(e);tasks()};
 const tb=e.querySelector(".tb");let dx,dy,dr=0;
 tb.ondblclick=ev=>{if(ev.target.tagName!=="BUTTON")maxToggle(e)};
 tb.onpointerdown=ev=>{if(ev.target.tagName==="BUTTON"||e.dataset.max)return;dr=1;dx=ev.clientX-e.offsetLeft;dy=ev.clientY-e.offsetTop;tb.setPointerCapture(ev.pointerId)};
 tb.onpointermove=ev=>{if(dr){e.style.left=Math.max(0,ev.clientX-dx)+"px";e.style.top=Math.max(0,ev.clientY-dy)+"px"}};
 tb.onpointerup=()=>dr=0;
 tasks();return e}
function maxToggle(e){if(e.dataset.max){const g=JSON.parse(e.dataset.max);e.style.left=g.l;e.style.top=g.t;e.style.width=g.w;e.style.height=g.h;e.style.maxWidth="";e.style.maxHeight="";delete e.dataset.max}else{e.dataset.max=JSON.stringify({l:e.style.left,t:e.style.top,w:e.style.width,h:e.style.height});e.style.left="0";e.style.top="0";e.style.width="100%";e.style.height="100%";e.style.maxWidth="100%";e.style.maxHeight="100%"}e.style.zIndex=++S.z}
function tasks(){$("#tasks").innerHTML=Object.keys(S.wins).map(k=>{const e=S.wins[k];return `<button style="${e.style.display==="none"?"":"border-style:inset"}" onclick="tg('${k}')">${esc(e.dataset.t).slice(0,18)}</button>`}).join("")}
function tg(k){const e=S.wins[k];if(e.style.display==="none"){e.style.display="flex";e.style.zIndex=++S.z}else if(+e.style.zIndex===S.z)e.style.display="none";else e.style.zIndex=++S.z;tasks()}
function note(t,m,fn){const n=document.createElement("div");n.className="nf";n.innerHTML=`<b>${esc(t)}</b><br>${esc(m)}`;n.onclick=()=>{n.remove();fn&&fn()};$("#desk").appendChild(n);setTimeout(()=>n.remove(),9000)}
function openText(t,txt){win("t"+t,t,`<pre style="margin:0;white-space:pre-wrap;font:13px 'Courier New',monospace">${esc(txt)}</pre>`,360,90,60)}
function openDocs(){did("docs");win("docs","My Documents",`<h4>My Documents</h4>📄 resume_2024.doc<br>📄 budget.xls<br>📁 <a class="l" onclick="openPics()">Pictures</a><br>📁 Downloads (empty)`,320,120,80)}
function openBin(){
 const h=`<h4>Recycle Bin</h4>`+(S.bin.length?S.bin.map((f,i)=>`<div>📄 <a class="l" onclick="openText('${f.n}',S.bin[${i}].t)">${esc(f.n)}</a></div>`).join(""):"<i>Empty.</i>")+`<br><button onclick="S.bin=[];openBin()">Empty Recycle Bin</button>`;
 win("bin","Recycle Bin",h,340,100,70)}
/* ---- browser ---- */
const BM=[["forum","NostalgiaTV"],["home","SearchLite"],["wiki","OddPedia"],["tapes","TapeTrader"],["news","Gazette"],["bank","Harbor CU"],["game","Pop!"]];
const URLS={home:"http://searchlite.net",forum:"http://nostalgiatv.net",wiki:"http://oddpedia.org",game:"http://popgames.biz/pop",cache:"http://cache.searchlite.net/2009/wally",tapes:"http://tapetrader.example",news:"http://meadowbrook-gazette.example/archive",bank:"https://online.harborcu.example"};
function openNet(){S.hist=[];go("forum")}
function go(u,arg){S.url=u;S.arg=arg;
 const bm=BM.map(([k,l])=>`<button onclick="go('${k}')">★ ${esc(l)}</button>`).join("");
 const html=`<div class="addr"><button onclick="go('forum')">Home</button><input value="${esc(u==='forum'&&arg?URLS.forum+'/'+String(arg).replace(':','/'):(URLS[u]||URLS.wiki))}" readonly></div><div class="bm">${bm}</div><div id="pg">${SITE[u](arg)}</div>`;
 const e=win("net","Internet Explorer",html,560,70,16);if(!e.dataset.max)e.style.height=Math.min(innerHeight-70,560)+"px";
 if(u==="game")startGame()}
const SITE={
 home(){return `<div style="text-align:center"><h2 style="margin:6px">SearchLite</h2><input id="q" size="26" onkeydown="if(event.key==='Enter')srch()"> <button onclick="srch()">Search</button><p style="color:#555">The small, fast web.</p><div id="res" style="text-align:left"></div></div>`},
 wiki(a){return wikiPage(a)},
 game(){return `<h3>Pop!</h3>Click the squares before they fade. <b id="sc">Score: 0</b><canvas id="cv" width="360" height="220"></canvas>`},
 cache(){return `<h3>wally_wisp_${ME}.html</h3><div class="meta">cached Mar 4, 2009 3:00 AM</div><p>Show notes by ${ME}: Today we count. If you are reading this, you are already watching. Nobody leaves before the count ends.</p>`},
 forum(a){return forumPage(a)}
};
/* ---- tiny game ---- */
let gi;function startGame(){clearInterval(gi);const c=$("#cv");if(!c)return;const g=c.getContext("2d");let sq=[],sc=0;
 c.onclick=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;const i=sq.findIndex(q=>x>q.x&&x<q.x+34&&y>q.y&&y<q.y+34);if(i>=0){sq.splice(i,1);sc++;$("#sc").textContent="Score: "+sc}};
 gi=setInterval(()=>{if(!$("#cv")){clearInterval(gi);return}if(Math.random()<.35)sq.push({x:Math.random()*320,y:Math.random()*180,a:1});g.clearRect(0,0,360,220);sq.forEach(q=>{q.a-=.03;g.fillStyle=`rgba(217,164,65,${Math.max(q.a,0)})`;g.fillRect(q.x,q.y,34,34)});sq=sq.filter(q=>q.a>0)},50)}
/* ---- witnesses (randomized each load) ---- */
const HOSTS=["Wally, the blue rabbit","Mr. Thistle, the smiling scarecrow","a host nobody can describe above the shoulders","Wally, who was a lamp with a face"];

const ALLN=["static_lullaby","m0thwing_77","cathodeKiln","bluehour_ferris","analog_orchard","tapewyrm","plasticSundae","11pm_gravel","velvet_signal","dust_on_the_dial","hollowtoaster","kmart_ghost","paperlantern_rex","fuzzbucket4","lowtide.radio","moonpie_deluxe"];
const NAMES=shuf(ALLN);const WN=NAMES.splice(0,5),OP=NAMES.pop(),MEN=NAMES.pop(),REPLIER=NAMES.pop(),DMN=NAMES.pop();
const TAG=["Member","Veteran","New member","Parent","Lurker"],WHEN=["Feb 7","Feb 11","Feb 21","Feb 25","Mar 1"];
const VOICE=[
 w=>`Lurker for years, first post. Everything I can verify says this program wasn’t real, yet I can still hum the opening. The host (${w.host}) waved with both hands, and it came on ${w.chan}. What I can’t explain is feeling sad when it ended, because it ended mid-sentence.`,
 w=>`ok this is going to sound insane but “${w.ep}”?? me and my cousin used to reenact it in the garage. the song was “${w.song}” and you counted DOWN not up. i think we got it ${w.chan} but honestly idk. ask him, he’ll say the same`,

const W=WN.map((h,i)=>({h,host:pick(HOSTS),song:pick(SONGS),ep:pick(EPS),chan:pick(CHANS)}));
S.notifs=[{id:"n1",txt:MEN+" mentioned you in “Wally Wisp’s Wonder Hour — anyone??”",arg:"t:wally",read:false}];
S.dms=[{id:"d0",from:"NostalgiaTV",subj:"Welcome back, "+ME,read:true,txt:"Your account was created in March 2009. 212 posts, 0 warnings."}];
const THREADS=[
 {id:"rules",t:"Read first: forum rules & posting etiquette",c:"Announcements",v:9120,r:3,la:"1w",pin:1,ps:["Be kind. Search before you post. If you’re hunting a lost show, tell us the year, the region and the channel.","Please don’t post copyrighted full episodes. Short clips are fine.","Reminder: ‘I think I dreamed it’ is a valid thing to say here."]},
 {id:"cube",t:"Saturday cartoon intro was just a spinning cube and a trumpet?",c:"Cartoons",v:2310,r:41,la:"2h",ps:["Early 90s. No characters, just a cube turning over a trumpet riff. Thought I dreamed it.","That was the Kids Block ident from a cable network out of Tulsa. The trumpet came from a car commercial.","Bless you. I’ve wondered for 25 years."]},
 {id:"pizza",t:"Game show set inside a pizza restaurant, host in a paper chef hat",c:"Game Shows",v:1288,r:17,la:"5h",ps:["Contestants answered trivia to ‘earn’ toppings. The loser got plain cheese and a pat on the head.","Regional. I was on it in 1992. They never gave me the pizza."]},
 {id:"fox",t:"Claymation fox PSA about talking to strangers",c:"PSAs",v:3011,r:64,la:"8h",ps:["The fox wore a yellow raincoat. The ending was surprisingly dark for a PSA.","Safety Fox! My teacher showed it twice a year."]},
 {id:"lighthouse",t:"Theme song to a kids’ show about a lighthouse (Canadian?)",c:"Theme Songs",v:874,r:9,la:"1d",ps:["Whistling, then a choir of kids singing ‘keep the lamp on’. Anyone?","Possibly ‘Lamplight Cove’. I’ll dig through my old guides."]},
 {id:"nine",t:"Channel 9 ident: the floating blue 9 with the humming sound",c:"Idents",v:1950,r:28,la:"1d",ps:["Slowly rotating 9, gentle hum underneath. Aired before sign-off.","The hum was a 60 Hz tone. They slowly bent the pitch down at the end."]},
 {id:"snack",t:"What did you eat in front of the TV after school?",c:"Off-Topic",v:5400,r:132,la:"2d",ps:["Buttered toast cut into triangles and a glass of orange drink.","Cold pizza, no contest."]},
 {id:"signoff",t:"Test patterns and sign-off messages: share yours",c:"Broadcast",v:4102,r:77,la:"3d",ps:["Local station played the anthem over a flag, then a test pattern with a tone.","Ours just said ‘Good night, see you tomorrow’ in a handwriting font."]},
 {id:"pockets",t:"Looking for: ‘Professor Pockets’ science segment",c:"Lost Media",v:640,r:6,la:"4d",ps:["He pulled bizarre objects out of a coat to explain physics. Never found a single listing.","There’s a thread on the old board. It was deleted."]}];

 [["wiki","pics"],["pics","bank"],["tapes","wiki"],["news","docs"],["wiki","bank"],["tapes","news"],["bank","wiki"],["pics","tapes"],["news","docs"],["tet","wiki"],["bank","news"],["wiki","pics"],["docs","news"],["pics","tape"]][S.day-1].forEach(k=>{if(k==="tet"&&!S.f.tetris)k="docs";if(!T.some(x=>x[0]===k))T.push([k,XT[k]])});
 if(S.day>=2&&S.tw<TAPE.filter(t=>t[0]<=S.day).length&&!T.some(x=>x[0]==="tape"))T.push(["tape",XT.tape]);return T}

function tickDay(){if(!S.started||S.crashing||!S.sched)return;adv(15);S.sched.forEach(e=>{if(!e.done&&S.min>=e.m){e.done=1;e.f()}});
 if(S.min>=1380&&!S.f["late"+S.day]){S.f["late"+S.day]=1;note("","It’s getting late.")}

function ps1(cv,sc,anim){const w=128,h=96;cv.width=w;cv.height=h;const g=cv.getContext("2d");let t=0;const id=cv._t=(cv._t||0)+1;
