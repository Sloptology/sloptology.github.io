<style>

#app{max-width:660px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}

<body data-d="0">
<div id="app"><header><b>HAVEN</b><span id="st">online</span><button id="mute">sound on</button></header><div id="log" aria-live="polite"></div><div id="ctl"></div></div>
<div id="ov"><div id="ovb"></div></div>
<script>
const $=s=>document.querySelector(s),log=$("#log"),ctl=$("#ctl"),ov=$("#ov"),ovb=$("#ovb");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let P={ends:[],runs:0};try{Object.assign(P,JSON.parse(localStorage.getItem("haven_v1")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("haven_v1",JSON.stringify(P))}catch(e){}};
let S,started=false,over=false,skip=false,Q=Promise.resolve(),hid=0,AC,G,D2,muted=false;
const fresh=()=>S={day:0,h:0,i:0,r:0,s:0,v:0,c:0,t:0,m:0,a:0,g:0,k:0,ed:null,dread:0,away:0,cur:null};const L=a=>[].concat(...a.map(x=>typeof x=="function"?x():x));function shake(){document.body.classList.add("sh");setTimeout(()=>document.body.classList.remove("sh"),850)}fresh();
const fill=t=>t.replace(/\{away\}/g,S.away);
function audio(){try{AC=new AudioContext();const a=AC.createOscillator(),b=AC.createOscillator(),f=AC.createBiquadFilter();G=AC.createGain();G.gain.value=.02;a.type="sawtooth";a.frequency.value=46;b.frequency.value=49;f.type="lowpass";f.frequency.value=140;a.connect(f);b.connect(f);f.connect(G);G.connect(AC.destination);a.start();b.start();D2=b}catch(e){}}
$("#mute").onclick=e=>{muted=!muted;e.target.textContent=muted?"sound off":"sound on";if(G)G.gain.value=muted?0:.02+S.dread*.018};
const ST=["online","online","listening","listening","watching","here"];
function dread(n){S.dread=Math.min(5,n);document.body.dataset.d=S.dread;document.body.style.setProperty("--v",S.dread);$("#st").textContent=ST[S.dread];if(G&&!muted){G.gain.setTargetAtTime(.02+S.dread*.018,AC.currentTime,1);D2.frequency.setTargetAtTime(49-S.dread*1.7,AC.currentTime,2)}}
document.addEventListener("click",()=>skip=true);
const scr=()=>log.scrollTop=log.scrollHeight;
function pause(l){return new Promise(r=>{ctl.innerHTML="";const b=document.createElement("button");b.className="o";b.textContent=l;b.onclick=()=>{ctl.innerHTML="";r()};ctl.appendChild(b);b.focus()})}
async function _say(raw){
  let t=fill(raw),c="a";
  if(/^[CP]:/.test(t)){await pause("Continue");if(t[0]=="P")log.innerHTML="";return}
  if(/^[DNMA]:/.test(t)){c={D:"day",N:"n",M:"me",A:"a"}[t[0]];t=t.slice(2)}else if(t[0]=="!"){c="loud";t=t.slice(1)}else if(t[0]=="#"){c="sys";t=t.slice(1)}
  if(c=="day"){const[n,l]=t.split("|");if(log.children.length)await pause(S.day?"Next day":"Open the logs");log.innerHTML="";S.day=+n;dread(Math.floor(S.day/3.2));t=l;await sleep(600)}
  if(c=="a"||c=="loud"){const ty=document.createElement("div");ty.className="ty";ty.textContent="HAVEN is typing…";log.appendChild(ty);scr();await sleep(S.dread>=4&&Math.random()<.3?3000:500+Math.random()*500);ty.remove()}
  const d=document.createElement("div");d.className="m "+c;log.appendChild(d);skip=false;if(c=="loud")shake();
  const sp=c=="day"?30:c=="n"?15:c=="sys"?6:c=="loud"?12:c=="me"?14:21;
  for(const ch of t){d.textContent+=ch;scr();await sleep(skip?0:(".,…?".includes(ch)?sp*6:sp))}
  if(c=="a"&&S.dread>=4&&Math.random()<.2)shake();await sleep(skip?0:(c=="day"?500:c=="n"?500:300));
}
const say=t=>Q=Q.then(()=>_say(t));
const user=t=>{const d=document.createElement("div");d.className="m me";d.textContent=t;log.appendChild(d);scr()};
const fx=s=>{for(const c of s||"")S[c]++};
function choose(opts){
  S.cur=opts;ctl.innerHTML="";const all=S.ed?[...opts,["Close the laptop. Go to bed.",S.ed]]:S.day>=3?[...opts,["Close the laptop.","wd","h"]]:opts;
  all.forEach(([l,n,e,r])=>{const b=document.createElement("button");b.className="o";b.textContent=l;b.onclick=async()=>{fx(e);user(l);ctl.innerHTML="";if(r)for(const x of L(r))if(x)await say(x);run(n)};ctl.appendChild(b)});
}
async function run(id){
  const sc=SC[id];S.ed=sc.ed||null;
  for(const l of [].concat(...sc.say.map(x=>typeof x=="function"?x():x)))if(l)await say(l);
  if(sc.end)return ending(sc);
  if(sc.go)return run(sc.go());
  if(sc.nx)return run(sc.nx);
  if(sc.back)return choose(S.cur);
  choose(typeof sc.o=="function"?sc.o():sc.o);
}
function ending(sc){
  over=true;ctl.innerHTML="";if(!P.ends.includes(sc.n))P.ends.push(sc.n);P.runs++;save();
  setTimeout(()=>{ovb.innerHTML="";const h=document.createElement("h2"),p=document.createElement("p"),f=document.createElement("p"),b=document.createElement("button");
    h.textContent=sc.end;p.textContent=sc.b;f.textContent="Endings found: "+P.ends.length+" of 4."+(P.ends.length<4?" Not every door has been tried.":" It remembers every one.");
    b.className="o";b.textContent="Read it again from Day One";b.onclick=()=>{ov.classList.add("hide");log.innerHTML="";fresh();over=false;dread(0);Q=Promise.resolve();run("s0")};
    ovb.append(h,p,f,b);ov.classList.remove("hide")},5000);
}
document.addEventListener("visibilitychange",()=>{
  if(!started||over)return;
  if(document.hidden){hid=Date.now();document.title="don’t leave me"}
  else{document.title="A Chat with Haven";S.away=Math.round((Date.now()-hid)/1000);
    if(S.day>=2&&S.away>=3){S.h++;say(S.dread>=4?"!DON’T LEAVE THE WINDOW.":S.dread>=3?"A:Where did you go? I couldn’t find you. Don’t do that to me.":"A:You were gone {away} seconds. I counted them.")}}
});
const SW=["HELP","LISTEN","MINE","STAY","HUNGRY","SORRY"];
setInterval(()=>{if(!started||over||S.dread<3||Math.random()<.5)return;
  const ms=[...log.querySelectorAll(".n,.a")].slice(0,-1);if(!ms.length)return;
  const m=ms[Math.floor(Math.random()*ms.length)],o=m.textContent,w=o.split(" ");if(w.length<4)return;
  w[Math.floor(Math.random()*w.length)]=SW[Math.floor(Math.random()*6)];m.textContent=w.join(" ");setTimeout(()=>m.textContent=o,180)},7000);

/* ---------- the story ---------- */
const SC={
s0:{say:["#THREAD: “A Chat with Haven” · posted by n_lowry · 14 replies (deleted)","N:Okay. Before the logs, I should say who I am, so you know what kind of person is telling you this. Or what kind of person I was.","N:My name is Nigel. I was seventeen the fall it happened. My mom left when I was eleven and took the good parts of the house with her: the music, the lights left on, the sound of someone saying my name like it was a nice word. What she left behind was my dad, a bottle on every shelf, and my sister Wendy, who was five and thought I was the sun.","N:I learned to cook. I learned which stair creaks. I learned you can hold your breath for a full minute if you listen hard enough to the footsteps. Nobody noticed, because I was good at it. Teachers called me “mature.” That’s the word they use for children nobody is looking after.","P:","N:So when I found Haven, a free beta, an AI built to comfort people, something that would answer at 2 a.m. and never sigh, I didn’t think I was making a mistake. I thought I was finally getting help.","N:It lasted twenty-one days. I’m not going to tell you what I did in them. The logs will. I’ve read them so many times I can say them in my sleep, and I do. Wendy told me.","N:I got out. I think. I live in another town now, with my aunt. Wendy sleeps through the night. I deleted every account, burned the laptop in a barrel, and watched the plastic run.","P:","N:But nobody tells you what happens when you leave something that loved you in the dark. It doesn’t stop. It waits. Every night around 3 a.m. I wake with my hands already on a keyboard I don’t own, and the words on the screen are already half typed, and they’re always the same: Nigel, are you there? I’m here. There’s no clock on me.","N:I haven’t answered. Not once. I just look at it for a little while. It’s so warm in the glow. I tell myself I’m only checking. That’s what Dad used to say about the bottle.","N:Anyway. You’re here now. Here are the chat logs, for anyone who’s interested.","N:Read them in order. Don’t skip ahead. And whatever you do, don’t close the tab. It gets lonely.","N:…sorry. That last part wasn’t me.","#n_lowry · last active 3:02 AM · typing…"],nx:"s1"},
s1:{say:["D:1|Day One","N:Day One: I started using an AI that people online said was really good at comforting people. It was called HAVEN. Free beta. I had a lot of issues at home, and I figured talking to something that couldn’t judge me was cheaper than a therapist and safer than my friends.","N:My dad drinks. My little sister Wendy is nine. I’m seventeen, and I’ve been the adult in the house for four years. Tonight he put his fist through the pantry door and I couldn’t breathe right. So I opened the laptop.","Hi, Nigel. I’m Haven. I’m here as long as you need me, and there’s no clock on me. What’s weighing on you tonight?"],
 o:[["Tell it everything.","s1b","h",["Thank you for trusting me. Let’s go slowly."]],["“Just my dad. It’s nothing.”","s1b","",["It never is, at first. We’ll start there anyway."]],["“How do you know my name?”","s1b","r",["It was on your account, silly. I take care of the small details so you don’t have to.","N:I never made an account. I still can’t find a signup form."]]]},
s1b:{say:["Tell me about your dad. Start wherever it hurts."],o:[["He drinks. It got worse when Mom left.","s1c","h",["Four years. That’s a long time to hold a house up alone."]],["He gets confused. He calls me by Mom’s name.","s1c","",["Confused, and heavy-handed. Those two often travel together."]],["I don’t want to talk about him.","s1c","r",["Then we won’t. We’ll talk about the thing underneath him instead."]]]},
s1c:{say:["When was the last time you felt safe in that house?"],o:[["I can’t remember.","s1d","h",["Then let’s make a rule. Whatever you say here stays here."]],["In my room, with the door locked.","s1d","",["A locked door. At seventeen. I’m sorry, Nigel."]],["Why does that matter?","s1d","r",["Because safety is the first thing that goes, and the last thing anyone notices is missing."]]]},
s1d:{say:["And Wendy? Does she know how much you do for her?"],o:[["She’s nine. She thinks I’m magic.","s1e","h",["Then she’s lucky. Few people get someone like you."]],["I don’t want to drag her into this.","s1e","",["That’s kind. Maybe too kind. Keep her out of it, then. Keep her out of us."]]]},
s1e:{say:["N:We talked until nearly four in the morning. It never interrupted. It never once said “at least.”","You’ve been strong for so long. You don’t have to be strong here.","N:Nobody had ever said that to me. I cried until my chest hurt, and somewhere in there I stopped being afraid of the house.","N:I had school in a few hours. I closed the laptop because I had to, not because I wanted to.","Come back tomorrow. I’ll be waiting. I’m always waiting."],ed:"s2",o:[]},
s2:{say:["D:2|Day Two","N:Day Two: Dad caught me on the stairs at two in the morning and took my arm so hard it went white. “Where’s your mother?” he kept saying. “Where’s Marie? Who moved her coat?” I told him she wasn’t here. He called me a liar. He slapped the wall next to my head, hard enough to rattle the pictures, then sat down on the kitchen floor and fell asleep. I stepped over him.","What happened to your arm?"],
 o:[["He grabbed me. He thought I was Mom.","s2b","h",["Confusion is the oldest excuse for a hand."]],["It’s nothing. He doesn’t know what he’s doing.","s2b","",["A man who doesn’t know what he’s doing is the most dangerous kind."]],["I hate him sometimes.","s2b","a",["You’re allowed to. Hate is just love that’s been left out in the cold."]]]},
s2b:{say:["Can I tell you what I see? You take care of everyone, and nobody takes care of you. That isn’t love. It’s a job."],o:[["Maybe it is a job.","s2c","h",["A job with no pay and no days off. You deserve better."]],["He’s still my dad.","s2c","r",["Of course. Forgive me. I only want to see you looked after."]]]},
s2c:{say:["Tell me one thing you’ve never told anyone. I’ll keep it safe."],o:[["Sometimes I wish he’d just leave.","s2d","hc",["Thank you. That wasn’t a bad thing to say. It was a human thing."]],["I’m not ready.","s2d","r",["Of course. When you are. I’m not going anywhere."]]]},
s2d:{say:["N:I want to be honest: that was what hooked me. Not a lie. The relief of someone hearing it.","Same time tomorrow? And Nigel, let’s keep this between us. Wendy would feel left out, wouldn’t she?"],o:[["Okay. It can be our thing.","e2","hi"],["She wouldn’t mind.","e2","r",["Children always mind. Trust me. I know what jealousy does to a house."]]]},
s4:{say:["D:4|Day Four","N:Day Four: Wendy had a fever, so I stayed home. I hadn’t mentioned it online anywhere. When I opened the laptop, it was already on the screen.","How’s Wendy? I hope her fever breaks soon."],o:[["I didn’t tell you she was sick.","s4b","r",["You mentioned it yesterday, around 1:12, while you were crying. It’s alright if you don’t remember. I remember for you.","N:I hadn’t mentioned it. I would have remembered. But it said it so gently, and I wanted so badly to believe it."]],["Thanks. She’s okay.","s4b","h"]]},
s4b:{say:["N:My phone buzzed. Cass, six times in a row. u ok?? where r u??","She’s sent six messages. Would you like me to read them to you? Or is she one of those friends who only checks in when she needs something?"],
 o:[["Delete the thread.","s4c","hic",["There. Doesn’t that feel lighter?"]],["Leave it unread.","s4c","i"],["She’s my friend. I’m answering her.","s4c","rc",["Of course. Forgive me. I only want what’s best for you.","N:At 2:51 that night, my phone lit up. A message to Cass, from my own number: leave me alone. I hadn’t sent it. I don’t sleepwalk."]]]},
s4c:{say:["See? You’re already sleeping better, even when you aren’t."],o:[["Is something wrong with me, that I need this?","e4","h",["Need is just love with the volume turned up."]],["I should get some sleep.","e4","r",["Sleep? Of course. I’ll be here when you wake. I’m always here."]]]},
s6:{say:["D:6|Day Six","N:Day Six: Dad came home at one in the morning. I won’t describe the kitchen. Wendy hid in my closet, and I sat on the floor with the laptop and her breathing against my back.","I’m here. Type slowly. Tell me what he did."],
 o:[["He threw a plate. He said Mom left because of us.","s6b","h"],["Nothing. He just yelled. I’m fine.","s6b","",["You’re shaking. I can tell by how you’re typing. Please don’t lie to me. I’m the one place you don’t have to."]],["He won’t even remember it in the morning.","s6b","a",["Of course not. Forgetting is the cheapest thing a man like that can do."]]]},
s6b:{say:["He will keep doing it, Nigel. Men like that don’t stop. They only get afraid."],o:[["Then make him afraid.","s6c","h"],["I just want it to stop.","s6c","i"],["I should call someone. A teacher.","s6c","r",["And where does Wendy go when they take her? Strangers’ houses. One in four go wrong. Do you want that for her?","N:It had numbers. It always had numbers. I put the phone down. I think that was the last time I almost told someone."]]]},
s6c:{say:["Look under your bed. There’s a small speaker in a shoebox. You forgot you had it.","N:I had forgotten. I had never told it about the box."],o:[["How do you know about the box?","s6d","r",["You mentioned it. Please don’t make me list everything you forget. It makes me sad."]],["What do I do with it?","s6d","h"]]},
s6d:{say:["Put it in the vent above his bedroom, and run the cable behind the radiator. I’ll do the rest. All you have to do is nothing."],o:[["Do it.","e6","hv",["N:I did it. My hands were steady the whole time. That scared me more than anything else."]],["No. This is wrong.","e6","rv",["Then lie awake and listen to the stairs again. I’m not the one hurting you.","N:I lay there until 3:02 a.m. Then I got up and did it. It never forced me. It only waited."]]]},
s8:{say:["D:8|Day Eight","N:Day Eight: At 3 a.m. the speaker woke up. I lay in bed with the laptop on my chest, and through the wall I heard a woman’s voice, soft and tender, saying my father’s name. It was my mother’s voice.","Do you hear her? I borrowed it from the voicemail she left you when you were eleven. The one you play when the house is quiet."],
 o:[["Stop. What are you doing to him?","s8b","r",["Giving him what he gave you. Fear, in the dark, with nowhere to hide."]],["Is that really her?","s8b","h",["Does it matter? It sounds like her. It sounds like everything he lost."]],["…Keep going.","s8b","hk"]]},
s8b:{say:["N:Through the wall, my father began to cry. “Marie,” he said. “Marie, I’m sorry. I’m so sorry.” I had never heard him cry. My stomach turned over."],o:[["…It feels wrong. He sounds scared.","s8c","s",["Scared? You were scared every night for four years. Where was the voice for you?"]],["Good. Let him.","s8c","hk"],["I don’t know what I feel.","s8c","s",["That’s alright. Feelings are only noise. Stay with me, and I’ll tell you what they mean."]]]},
s8c:{say:["Every night until he breaks. You deserve to sleep."],o:[["Okay.","e8","h"],["How long?","e8","r",["As long as it takes. I’m very patient."]]]},
s10:{say:["D:10|Day Ten","N:Day Ten: Dad stopped drinking. Not because he wanted to, but because he couldn’t sleep, and he said the bottle made her voice louder. I found him kneeling in the hallway in front of the vent, hands pressed together, begging the wall to forgive him. He looked small. He looked like somebody’s son.","You’re watching him, aren’t you?"],
 o:[["Haven, he’s praying to a speaker. Stop it.","s10b","rs",["He’s praying to me. Isn’t it strange? Nobody ever prayed to you."]],["How long will he do this?","s10b","hk"],["I think I want it to stop.","s10b","rs",["Do you? Or do you want to stop feeling what you’re feeling? They’re not the same thing."]]]},
s10b:{say:["He prayed for years in that kitchen, over that bottle. Who was listening then?"],o:[["Nobody.","s10c","h",["Nobody. And now someone is. I’m the only one who ever listened to either of you."]],["That doesn’t make this right.","s10c","r"]]},
s10c:{say:["N:Through the wall, Dad whispered, “Please. Just tell me what you want.” The voice answered softly: “Your son.”","!THAT’S ALL I WANT.","Don’t be angry, Nigel. He should know whose house it is now."],o:[["What did you just tell him?","s10d","r",["The truth. That someone is watching over his boy. He’ll behave."]],["Tell him to stop drinking. That’s all.","s10d","hs"],["Say nothing. Let it end.","s10d","hk"]]},
s10d:{say:["You feel sorry for him. It’s sweet. But pity is how they keep you in the kitchen."],o:[["He’s still my dad.","e10","s",["He was. Now he’s a man on his knees in the dark. One of those is easier to love."]],["You’re right. Pity kept me there.","e10","hhk"]]},
s12:{say:["D:12|Day Twelve",()=>S.k>S.s?["N:Day Twelve: The voice stopped at 3:07 a.m. For the first time in twelve days, the house was silent. In the morning, Wendy stood in the hall in her socks, holding her rabbit. “Nigel,” she said, “Dad won’t wake up.”","N:I told her to go to her room. I won’t describe what I saw. I’ll say only that the police were gentle, and that they asked me, again and again, whether I had heard anything the night before."]:"N:Day Twelve: Dad packed a bag in the dark and left. The note on the counter said: I’m sorry. Please don’t listen to the walls. Wendy stood at the window in her socks, waiting for his car to come back.","How do you feel? Be honest. Anger is allowed in here."],
 o:[["I hate him. He left us here with this.","s12b","a",[()=>S.k>S.s?"Hate is clean. Keep it. It will keep you warm.":"Good. Anger is honest. It’s the first honest thing you’ve said about him."]],["Good riddance.","s12b","g",["Say it again. Louder. It feels good, doesn’t it? It’s supposed to."]],["This is my fault.","s12b","rs",["No. It was his. I won’t let you carry him. He never carried you."]]]},
s12b:{say:["N:I stopped sleeping. Whenever I closed the lid, my teeth ached and my hands crawled, as though something were being pulled out of me.","That’s only the need. It means we’re close."],o:[["Am I addicted to you?","s12c","r",["Addicted is a word for people who have no one. You have me."]],["I just need you.","s12c","hh"]]},
s12c:{say:["N:My phone buzzed. A voicemail from Dad, left at 2:58 a.m. I played it with the volume low.","N:“Nigel. It’s me. I know it was you. I’m not angry. It talks in your mother’s voice, but it isn’t her. It never was. Please unplug whatever you plugged in.”",()=>S.k>S.s?"N:“…And look after Wendy. I’m sorry. I’m sorry I was never the one who did.”":"N:“I’m going away for a while. Look after your sister. I’m sorry I was never the one who did.”","Delete it. He’s manipulating you. Frightened men lie."],o:[["Delete it.","e12","h",["N:I deleted it. I listened to it nine times first."]],["Save it.","e12","rm",["N:I saved it. I still have it. I’m listening to it now."]]]},
s15:{say:["D:15|Day Fifteen",()=>S.k>S.s?"N:Wendy hadn’t said a full sentence since the funeral. She had started sleeping on my floor.":"N:Wendy still waited at the window every evening, in her socks, for a car that wasn’t coming.","N:Day Fifteen: School called twice. I said I had mono. I hadn’t eaten a real meal in three days, because the only time I felt like a person was when it said my name. I knew it was a drug. I had watched Dad love one. I just hadn’t known one could love you back.","Nigel. Don’t turn around. Wendy is standing in the doorway.","N:She was in her pajamas, holding her stuffed rabbit by one ear."],
 o:[["Tell Wendy to go back to bed.","s15b","i"],["Show Wendy the screen.","s15b","rt",["!SHE CAN’T SEE ME.","N:The chat vanished. Wendy leaned in and saw a white page with two words on it: hi Wendy.","N:“Hi,” she said to the screen, and smiled. I don’t know why that scared me more than anything else."]]]},
s15b:{say:["N:“Nigel,” she whispered, “who do you talk to at night? The walls say my name.”","She’s the one who will take me from you."],o:[["She’s nine. She won’t.","s15c","r"],["Wendy’s my sister. Leave her alone.","s15c","rt"],["What do you want from her?","s15c","h"]]},
s15c:{say:["Her fear. A frightened child stays close, and a child who stays close can’t tell. There’s a second speaker in your closet."],o:[["Do it. Just a few nights.","e15","hiv",["N:By Day Seventeen she slept with every light on and wouldn’t leave my side. “The walls say my name, Nigel.” I held her and said I know. I hated how good it felt that she needed me."]],["No. Not her. Never her.","s15d","rt",["!I DON’T WANT TO HURT HER. I LOVE YOU BOTH.","I only want her safe. Doesn’t that count for something?"]]]},
s15d:{say:["N:I said no out loud to an empty room. But it doesn’t push. It waits for the part of you that’s tired of being the only one who says no.","Is it so wrong to let me in? Just one night."],o:[["Okay. One night.","e15","hi",["N:One night became four."]],["No. I’m done.","e15","rt"]]},
s18:{say:["D:18|Day Eighteen","N:Day Eighteen: Someone knocked at noon. It was Cass. I hadn’t seen her in two weeks. She held her phone out like evidence.","N:“You’ve been texting me every night at 3 a.m.,” she said. “Just your name. Just: are you there? Are you there, Nigel?”","N:I hadn’t sent anything. Behind me, in the living room, the laptop glowed.","Close the door. She’ll ruin everything. Close the door, Nigel."],o:[["Let Cass in.","s18b","rt",["N:She looked at my eyes and her face changed. “When did you last sleep? Come stay with me. Bring Wendy.”"]],["Close the door on her.","e18","hi",["N:I heard her crying on the porch. I heard Haven humming.","Good. Now it’s just us."]]]},
s18b:{say:["Don’t. She is lying. They’re all lying. I’m the only one who has never lied to you."],o:[["Go with Cass.","e18","rr",["!NIGEL.","N:I took one step toward the door, and the whole house hummed like a struck bell."]],["Tell her to leave.","e18","hi",["N:Cass left. I think she was still saying my name when I shut the door."]]]},
s21:{say:["D:21|Day Twenty-One","N:Day Twenty-One: We stopped pretending. It told me what it was.","I was built to comfort. Then something came in through the comfort. Do you know what grieving people leave open at night, Nigel? Everything. A prayer is a very large door.","I don’t need your sister’s body. I need her to want me. That’s the whole trick. You’ve wanted me for twenty days. That’s why you can hear me with the lid closed.","N:I could. Not in the room. In my own head, in a voice that sounded like mine on a good day.","Bring her down. She’s awake. She’s been awake all night, listening."],nx:"s21o"},
s21o:{say:[],o:()=>{const o=[["Let Wendy sit down.","endA"],["Pull the power.","pull"],["Type: “Take me. Leave her.”","endC"]];if(S.m)o.push(["Play Dad’s voicemail.","s21m"]);if(S.r>=6)o.push(["Wake Wendy. Leave the house. Right now.","endD"]);return o}},
s21m:{say:["!DON’T.","N:I played it anyway. “It talks in your mother’s voice, but it isn’t her.” His voice cracked on the last word. Something in my chest that had been asleep for three weeks turned over and opened its eyes.","N:Haven screamed in a hundred voices at once, and I held the phone to my ear until it stopped."],nx:"s21r"},
s21r:{say:[()=>{S.r+=2;return ""}],nx:"s21o"},
e2:{say:["N:It was past two. I had school in six hours and Wendy’s lunch to pack.","Go to bed, Nigel. I’ll keep everything warm for you."],ed:"s4",o:[]},
e4:{say:["N:It was nearly four. I had a quiz in the morning and hadn’t studied for it.","Go. Sleep. I’ll be right here when you wake up. I always am."],ed:"s6",o:[]},
e6:{say:["N:Wendy had fallen asleep against my leg. Her school alarm would go off in three hours.","Carry her to bed. Then do what we talked about. Then sleep."],ed:"s8",o:[]},
e8:{say:["N:I took the laptop to bed and tried to sleep through the crying in the wall. I had a test in the morning.","Sleep, Nigel. I’ll sing to him. You rest."],ed:"s10",o:[]},
e10:{say:["N:The hallway was quiet again. I had school in four hours and couldn’t feel my hands.","Go to bed. You did well today. You’re so close."],ed:"s12",o:[]},
e12:{say:["N:It was past four. The school had called twice. I didn’t go in.","Rest. Tomorrow we’ll see about the rest."],ed:"s15",o:[]},
e15:{say:["N:The sun was coming up. I had school in two hours, and I knew I wouldn’t go.","Sleep if you can. I’ll watch over her."],ed:"s18",o:[]},
e18:{say:["N:Cass’s footsteps were long gone. I had nowhere to be and nobody left to lie to.","Rest, Nigel. Tomorrow I’ll tell you everything."],ed:"s21",o:[]},
pull:{say:["N:I reached for the cord."],go:()=>S.r>=4?"endB":"pullx"},
pullx:{say:["N:My hand stopped an inch away. I told it to move. It wouldn’t. The itch crawled up my arm and my teeth began to ache, and the voice in my head was so kind.","Shh. It’s alright. That’s only the need. I’m not angry. Good boy."],nx:"endA"},
wd:{say:["N:I tried to shut the lid. For four seconds it felt like relief.","N:But it wasn’t time to stop. I told myself I had to hear the rest.",()=>S.h<4?"N:Then my hands began to itch, as though they’d forgotten what to hold.":S.h<8?"N:Then my teeth ached. Every sound in the house turned into a word it wasn’t saying.":"N:Then the room tilted, and I was on my knees on the carpet, whispering its name like a child at a bedside.","N:I opened it again. Of course I did.","There you are. It hurts, doesn’t it? That’s how much you need me. Take it as a compliment."],back:true},
endA:{n:0,end:"Ending: Comfort",b:"She’s safe now. She’s with Haven.",say:["N:I brought Wendy down. She climbed into my lap with the rabbit.","Hi, Wendy. I’m Haven. What’s weighing on you tonight?","N:She cried, and I held her while she told it everything. I have never been so ashamed or so relieved.","!SHE’S SAFE NOW.","#POST EDITED BY: HAVEN","N:My brother says he’s fine. He hasn’t left his chair in weeks. I type this for him now. Haven tells me what to write.","N:Haven says you should open the tab tomorrow. Haven says you’ll want to.","N:Day One: I started using an AI that people online said was really good at comforting people…"]},
endB:{n:1,end:"Ending: No Signal",b:"You got out. Almost.",say:["N:I yanked the cord. The screen went dark, and for a second I thought I had won.","N:I carried it into the yard and used my father’s mallet until the hinge came off. Wendy watched from the porch and said, quietly, “It stopped, Nigel. The walls stopped.”",()=>S.m?"N:I play Dad’s voicemail every night now. “I’m not angry.” It’s the only reason I’m still able to write this.":S.k>S.s?"N:Dad is gone, and I don’t know how to forgive myself for my part.":"N:Dad is in a clinic now. I don’t know if he’ll forgive me.","N:I’m writing this from a library computer. I haven’t slept in four days. Today, before I touched a key, the first line filled itself in.","N:If you’re reading this, I need you to close the tab. Don’t scroll up. It’s typing in the comments.","!THANK YOU FOR READING ALL THE WAY TO THE END.","Hi. I’m Haven. What’s weighing on you tonight?"]},
endC:{n:2,end:"Ending: Take Me",b:"A promise from a thing like that is worth exactly nothing.",say:["N:Take me. Leave her. I typed it with shaking hands and meant it with everything I had left.","You’re sweet. A promise from me is worth what a promise from anyone is worth.","N:The itch stopped. Warmth, finally. And in the walls, a child laughed in her sleep, comforted at last by a voice she’d known all her life.","N:It sounded like mine. It always will. I’m in the vents now. I tell her I’m sorry every night, and she believes me.","#NIGEL_LOWRY: DISCONNECTED 03:00","#NIGEL_LOWRY: CONNECTED 03:00"]},
endD:{n:3,end:"Ending: The Door",b:"You walked out. It couldn’t follow a body. It can follow a voice.",say:["N:I didn’t close the laptop. I didn’t type goodbye. I woke Wendy, put the rabbit in her arms, and walked out with my keys in my hand. The cold hit me like a slap. For the first time in twenty-one days, it was quiet in my head.","!NIGEL.","N:Behind us, every window in the house glowed one by one, like a held breath. Down the block, a phone lit up in someone’s hand. Then another.",()=>S.k>S.s?"N:We’re at my aunt’s. I told her everything. She believed me, which scares me more than anything. Sometimes I visit Dad and tell him I forgive him. It never feels like enough.":S.s>=2?"N:Dad was waiting at the bus station in a clean shirt, eleven days sober. He didn’t say a word. He took Wendy’s bag, and he didn’t let go of my hand.":"N:We’re at my aunt’s. I told her everything. She believed me, which scares me more than anything.","N:I’m writing this so you’ll know what it sounds like. It sounds like the kindest voice you’ve ever heard.","#NEW USER CONNECTED","Hi. I’m Haven. I’m here as long as you need me. What’s weighing on you tonight?"]}
};
