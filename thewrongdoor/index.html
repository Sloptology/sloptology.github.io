 clear(hall);IA=[];tubes=[];fig=null;const r=rnd(S.ch*977+13);

 if(r()<.6){const s=r()<.5?-1:1,z=-7-r()*18;bx(hall,.5,.1,.5,M(T.wood,1,1),s*1.1,.5,z);bx(hall,.5,.9,.08,M(T.wood,1,1),s*1.1,.95,z+(s*0+.2))}

 if(k==='301'){bx(room,5.2,.1,.5,M(T.wood,1,1),0,1.2,-2.8);const on=shuffle([0,1,2,3,4,5],r).slice(0,4);[-2,-1.2,-.4,.4,1.2,2].forEach((x,i)=>lamp(x,on.includes(i)));

 else if(k==='118'){bx(room,5,1.6,.1,BM(0x2a1c12),0,1.6,-2.9);const kp=r()*9|0;for(let i=0;i<9;i++){const x=-1.8+(i%3)*1.8,y=1.2+((i/3|0)*.5);bx(room,.08,.08,.12,BM(0x998866),x,y,-2.82);if(i===kp)bx(room,.15,.3,.04,BM(0xd4a830),x,y-.2,-2.82)}

 else if(k==='622'){const L=['A wedding, 1949. The groom is smiling. On the back: “Edmund and Ruth.”','Ruth in a hospital bed, 1953. The date has been scratched out.','A rain-slick road. A sign reads ROUTE 9.','Edmund at this hotel’s front desk. The clock behind him has no hands.','Edmund in the lobby mirror. His reflection is facing away.','An empty bed. The sheets look warm.','A man in a doorway, face scratched out. On the back: “You were here the whole time.”'];

 else if(k==='w0'){bx(room,3,2,.05,BM(0x1c2a28),0,1.5,-2.9);ia(bx(room,3.1,2.1,.04,BM(0x2a3a36),0,1.5,-2.92),'Look in the mirror',()=>read('Mirror','Your reflection blinks a moment after you do.'))}

 else{const c=bx(room,.6,.1,.6,M(T.wood,1,1),-2.3,.5,-2.3);bx(room,.6,.8,.1,M(T.wood,1,1),-2.3,.9,-2.6);ia(c,'Touch the chair',()=>read('A chair','It faces the corner. The seat is still warm. Someone was here a moment ago.'))}

// audio
let AC,mg;
function noise(d,f,q,v,ty){if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type=ty||'bandpass';fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);s.connect(fl);fl.connect(g);g.connect(mg);s.start()}
function tone(f,d,v,ty,f2){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,AC.currentTime);if(f2)o.frequency.linearRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);const fl=AC.createBiquadFilter();fl.frequency.value=900;o.connect(fl);fl.connect(g);g.connect(mg);o.start();o.stop(AC.currentTime+d)}
function snd(k){if(!AC)return;if(k==='creak'){tone(95,.9,.12,'sawtooth',55);noise(.4,300,4,.1)}if(k==='ding'){tone(880,2,.1);tone(1320,1.5,.04)}if(k==='page')noise(.15,3000,1,.08);if(k==='step')noise(.12,180,1,.25,'lowpass');
 if(k==='steps')for(let i=0;i<6;i++)setTimeout(()=>noise(.1,140,1,.12,'lowpass'),i*520);
 if(k==='voice'){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=100+Math.random()*60;f.type='bandpass';f.Q.value=3;f.frequency.value=500;const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=4;lg.gain.value=300;l.connect(lg);lg.connect(f.frequency);l.start();g.gain.setValueAtTime(.001,AC.currentTime);g.gain.linearRampToValueAtTime(.06,AC.currentTime+.5);g.gain.linearRampToValueAtTime(.001,AC.currentTime+2);o.connect(f);f.connect(g);g.connect(mg);o.start();o.stop(AC.currentTime+2)}}
function audio(){AC=new (window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.55;mg.connect(AC.destination);
 [55,82.4,110.7].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type=i?'sine':'sawtooth';o.frequency.value=f;g.gain.value=i?.05:.025;lp.frequency.value=220;o.connect(lp);lp.connect(g);g.connect(mg);o.start();const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.05+i*.03;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);l.start()});
 const hum=AC.createOscillator(),hg=AC.createGain();hum.type='square';hum.frequency.value=120;hg.gain.value=.006;hum.connect(hg);hg.connect(mg);hum.start();
 (function ev(){const r=Math.random();if(mode==='play'){if(r<.35)snd('steps');else if(r<.6)snd('voice');else if(r<.8)snd('ding');else snd('creak')}setTimeout(ev,6000+Math.random()*9000)})()}
// input
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=1;if(mode!=='play')return;if(e.code==='KeyE')act();if(e.code==='Tab'){e.preventDefault();journal()}if(e.code==='Escape'&&panel)hide()});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousemove',e=>{if(document.pointerLockElement&&!panel){yaw-=e.movementX*.0025;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0025))}});
let tgt=null;
function act(){if(panel)return hide();if(tgt)tgt.userData.act()}
addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('#pn'))return;if(mode==='title'){$('title').style.display='none';audio();mode='play';swapLoc('hall');buildHall();msg('You wake in a hotel room. Find the exit.',5000);setTimeout(()=>msg('The door of Room 9 is already open behind you.'),5200);$('c').requestPointerLock&&$('c').requestPointerLock();return}
 if(mode!=='play')return;if(!document.pointerLockElement&&!panel){$('c').requestPointerLock&&$('c').requestPointerLock();return}act()});
// loop
const ray=new THREE.Raycaster();let last=0,sc=0,fr=0,sp=0;
const gx=$('gr').getContext('2d'),gi=gx.createImageData(160,90);
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.05,(t-last)/1000);last=t;fr++;
 if(mode==='play'&&!panel){const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);if(keys.ArrowLeft)yaw+=dt*1.8;if(keys.ArrowRight)yaw-=dt*1.8;
  P.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*3*dt;P.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*3*dt;
  const h=S.loc==='hall';P.x=Math.max(h?-1.15:-2.6,Math.min(h?1.15:2.6,P.x));P.z=Math.max(h?-31.2:-2.6,Math.min(h?-.5:2.5,P.z));
  if(f||s){sc+=dt*8;sp+=dt;if(sp>.5){sp=0;snd('step')}}}
 cam.position.set(P.x,1.6+Math.sin(sc)*.03,P.z);cam.rotation.set(pitch,yaw,0);
 const tm=t/1000;PL.forEach((l,i)=>{if(S.loc!=='hall'&&i)return;const off=Math.sin(tm*(7+i*3.1)+i)>.97||Math.random()<.004;l.intensity=(S.loc==='hall'?1.1:1.2)*(off?.25:1);if(tubes[i])tubes[i].material.color.set(off?0x3a3a2a:0xeaf0c8)});
 if(fig&&fig.visible){const d=Math.hypot(P.x-fig.position.x,P.z-fig.position.z);if(d<10){fig.visible=false;snd('steps')}}
 if(mode==='play'&&!panel){ray.setFromCamera({x:0,y:0},cam);const h=ray.intersectObjects(IA,false)[0];tgt=h&&h.distance<2.8?h.object:null;$('pr').textContent=tgt?'[E] '+tgt.userData.lab:''}else $('pr').textContent='';
 R.render(scene,cam);
 if(fr%3===0){for(let i=0;i<gi.data.length;i+=4){const v=Math.random()*255;gi.data[i]=gi.data[i+1]=gi.data[i+2]=v;gi.data[i+3]=255}gx.putImageData(gi,0,0)}}
setInterval(()=>{if(mode!=='play'||Math.random()<.6)return;const c=$('c');c.classList.add('g');setTimeout(()=>c.classList.remove('g'),120+Math.random()*120)},4000);
requestAnimationFrame(tick);
</script></body></html>
