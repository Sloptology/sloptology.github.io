const MI=['Play','Help &amp; Guide','Settings','Exit'],MENUBG='<div class=bg><div class=fog></div><svg viewBox="0 0 1000 600" preserveAspectRatio="xMaxYMax slice"><defs><linearGradient id=lb x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#9fb4aa" stop-opacity=".22"/><stop offset=1 stop-color="#9fb4aa" stop-opacity="0"/></linearGradient><radialGradient id=cg><stop offset=0 stop-color="#ffb060" stop-opacity=".55"/><stop offset=1 stop-color="#ffb060" stop-opacity="0"/></radialGradient></defs><rect x=120 y=80 width=360 height=250 fill="#8fa39a" opacity=".13"/><path d="M210 80V330M300 80V330M390 80V330M120 170H480M120 250H480" stroke="#050606" stroke-width="9"/><polygon points="120,330 480,330 760,600 20,600" fill="url(#lb)"/><rect x=50 y=395 width=340 height=95 fill="#101314"/><rect x=50 y=380 width=340 height=32 fill="#2b3030"/><path d="M520 40V570M470 250L425 575M575 250L620 575M455 215H595" stroke="#040404" stroke-width="13"/><rect x=478 y=190 width=95 height=190 fill="#070808"/><rect x=760 y=170 width=210 height=400 fill="#090a09"/><circle class=fl cx=800 cy=205 r=34 fill="url(#cg)"/><circle class=fl cx=850 cy=198 r=40 fill="url(#cg)"/><circle cx=800 cy=205 r=3 fill="#ffc27a"/><circle cx=850 cy=198 r=3 fill="#ffc27a"/></svg><div class=grain></div><div class=shade></div></div>';
function mainMenu(){if(NET.on)netClose();mode='menu';setMood(0);show('<div class=mm><h1 class=tt>The Haunted<br>Collector</h1><ul id=mi>'+MI.map((t,i)=>'<li class="'+(i==msel?'on':'')+'" onmouseenter="msel='+i+';mSel()" onclick="msel='+i+';mGo()">'+t+'</li>').join('')+'</ul><div class=press>Press Enter to Continue</div></div>'+MENUBG,'menu')}
function mSel(){snd(520,.05,'square',.03);document.querySelectorAll('#mi li').forEach((li,i)=>li.className=i==msel?'on':'')}
function mGo(){ac();snd(110,.4,'sawtooth',.12);[newRun,help,settings,()=>show('<div class=p style="text-align:center"><h1>Signal lost</h1><p>You can close this tab now.</p><button onclick="mainMenu()">Return</button></div>')][msel]()}
function mapSelOld(){mode='menu';setMood(0);show('<div class=p style="max-width:780px"><h1>Select location</h1><div class=cards>'+MAPS.map((m,i)=>'<div class="card'+(DONE.includes(i)?' done':'')+'" onclick="startMap('+i+')"><b>'+m.n+'</b><span>'+m.d+'</span><em>'+(m.fl>1?'2 floors':'1 floor')+(DONE.includes(i)?' · cleared':'')+'</em></div>').join('')+'</div><label>Difficulty</label>'+DFS.map((d,i)=>'<button class="'+(i==dif?'sel':'')+'" onclick="dif='+i+';mapSel()">'+d.n+'</button>').join('')+'<p style="opacity:.6;font-size:15px">Harder: smarter ghost, more haunt events, more decoy items, weaker readings.</p><button onclick="mainMenu()">Back</button></div>')}
function startMap(i){ac();curJob=JB(i);dif=curJob.d;const seed=Math.floor(Math.random()*4294967296);if(NET.on&&NET.host){NET.started=true;NET.startMsg={t:'start',m:i,seed,job:curJob};netAll(NET.startMsg)}load(i,seed);resume()}
function help(){show('<div class=p><h1>Help &amp; Guide</h1><p>You start at the <b>van</b>. Walk into the building and find the <b>one haunted item</b> hidden among the furniture.</p><p>Only <b>one tool</b> (EMF, thermometer or spirit box) reacts to the real item. The rest only give false alarms, as do the ghost and decoy items. Speak into the spirit box with your microphone, or press T.</p><p>You start with no tools. Press <b>E</b> at the van to open the equipment locker and carry up to 2. Press <b>Tab</b> for your job journal, and click to shoot Polaroids with the camera. Press <b>E</b> to pick up an item and bring it to the van to scan it. Walk to the front of the van and press <b>E</b> to leave at any time. The client pays in full only if the haunted item is removed, and photos earn bonus cash. Only ONE item is truly haunted; the rest just throw false flags. Clean items are discarded. A poltergeist slams doors, hurls objects and flings furniture around you. The ghost wanders, hides, and hunts. Hide in wardrobes and lockers with E, stay still, and it may lose you. The yard is safe.</p><p style="opacity:.7">WASD move · Shift sprint · mouse look · 1 / 2 / 3 tools · E interact · G drop · F flashlight · T ask spirit box</p><button onclick="mainMenu()">Back</button></div>')}
function settings(){show('<div class=p><h1>Settings</h1><label>Mouse sensitivity<input type=range min=1 max=6 step=.1 value='+SENS*1000+' oninput="SENS=this.value/1000"></label><label>Volume<input type=range min=0 max=1 step=.05 value='+VOL+' oninput="VOL=+this.value;musVol()"></label><label>Music<input type=range min=0 max=1 step=.05 value='+MUS+' oninput="MUS=+this.value;musVol()"></label><button onclick="mainMenu()">Back</button></div>')}
addEventListener('keydown',e=>{if(OPT.sprintT&&e.code==='ShiftLeft'){if(!e.repeat)keys.ShiftLeft=keys.ShiftLeft?0:1}else keys[e.code]=1;if(e.code==='Tab'){e.preventDefault();if(mode==='play')journal();else if(mode==='journal')resume()}
 if(mode==='menu'&&$('ov').className==='menu'){if(e.code==='ArrowDown'||e.code==='KeyS'){msel=(msel+1)%4;mSel()}if(e.code==='ArrowUp'||e.code==='KeyW'){msel=(msel+3)%4;mSel()}if(e.code==='Enter')mGo()}
 if(mode==='play'){const ix=['Digit1','Digit2','Digit3','Digit4'].indexOf(e.code);if(ix>=0){const t=INV[ix];if(t){tool=t;snd(400,.05,'square',.04)}else msg('Empty slot. Pick up tools at the van (E).',2200)}if(e.code==='KeyC')useTool();if(e.code==='KeyF')fl.visible=!fl.visible;if(e.code==='KeyT'&&tool==3)ask();if(e.code==='KeyE')interact();if(e.code==='KeyG')drop()}});
addEventListener('keyup',e=>{if(!(OPT.sprintT&&e.code==='ShiftLeft'))keys[e.code]=0});
addEventListener('mousemove',e=>{if((mode==='play'||mode==='lobby')&&document.pointerLockElement){P.yaw-=e.movementX*SENS;if(HID)P.yaw=Math.max(HID.y0-.7,Math.min(HID.y0+.7,P.yaw));P.pitch=Math.max(-1.4,Math.min(1.4,P.pitch-(OPT.inv?-1:1)*e.movementY*SENS))}});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&mode==='play'){mode='pause';pauseMenu()}});
let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;step(dt);fpsTick(dt);R.setRenderTarget(RT);R.render(sc,cam);R.setRenderTarget(null);R.render(PQ,PC);if(PH&&--PH.w<=0)capture()})(last);
/* ===== options, focus handling and background simulation ===== */
let SRET='mainMenu';
function applyRes(){const h=OPT.res||innerHeight;RT.setSize(Math.round(h*innerWidth/innerHeight),h);PU.r.value.set(RT.width,RT.height)}
function applyOpts(){VOL=OPT.vol;MUS=OPT.mus;SENS=OPT.sens/1000;musVol();cam.fov=OPT.fov;cam.updateProjectionMatrix();SNAPU.value.x=OPT.wob?170:4096;SNAPU.value.y=OPT.wob?128:2304;PU.lv.value=OPT.dith?31:0;PU.br.value=OPT.bright;applyRes();
 $('vig').style.display=OPT.vig?'block':'none';$('fps').style.display=OPT.fps?'block':'none';$('hint').style.display=OPT.hints?'block':'none';$('dot').style.display=OPT.dot?'block':'none'}
function setOpt(k,v){OPT[k]=+v;applyOpts();try{localStorage.setItem('hcs',JSON.stringify(OPT))}catch(e){}}
function resetOpts(){OPT=Object.assign({},OD);applyOpts();try{localStorage.setItem('hcs',JSON.stringify(OPT))}catch(e){}settings()}
function fpsTick(dt){if(!OPT.fps)return;FPSS.a+=dt;FPSS.n++;if(FPSS.a>.5){$('fps').textContent=Math.round(FPSS.n/FPSS.a)+' FPS';FPSS.a=0;FPSS.n=0}}
function step(dt){const bg=floors.length&&INJOB&&(NET.on?MPRUN.includes(mode):(!OPT.pause&&(mode==='journal'||mode==='locker'||mode==='leave'||mode==='pause')));
 if(mode==='play'||bg)tick(dt);else if(mode==='scare')scareTick(dt);else if(mode==='lobby')lobbyTick(dt);if(NET.on)netTick(dt)}
const FMT={vol:v=>Math.round(v*100)+'%',mus:v=>Math.round(v*100)+'%',sfx:v=>Math.round(v*100)+'%',tts:v=>Math.round(v*100)+'%',bright:v=>Math.round(v*100)+'%',fov:v=>v+'\u00b0',mic:v=>v.toFixed(2)};
const fmtOpt=(k,v)=>FMT[k]?FMT[k](+v):(+v).toFixed(1);
const rg=(k,l,a,b,s)=>'<label>'+l+': <b id=o_'+k+'>'+fmtOpt(k,OPT[k])+'</b><input type=range data-k='+k+' min='+a+' max='+b+' step='+s+' value='+OPT[k]+' oninput="optIn(this)"></label>';
const ck=(k,l)=>'<label class=ck><input type=checkbox data-k='+k+(OPT[k]?' checked':'')+' onchange="optIn(this)"> '+l+'</label>';
function optIn(el){setOpt(el.dataset.k,el.type==='checkbox'?(el.checked?1:0):el.value);const o=$('o_'+el.dataset.k);if(o)o.textContent=fmtOpt(el.dataset.k,OPT[el.dataset.k])}
function settings(ret){if(ret)SRET=ret;const h=t=>'<h2 class=sh>'+t+'</h2>';
 show('<div class="p set"><h1>Settings</h1><div class=g><div>'+h('Audio')+rg('vol','Master volume',0,1,.05)+rg('mus','Music',0,1,.05)+rg('sfx','Sound effects',0,1,.05)+rg('tts','Ghost voices (spirit box and radio)',0,1,.05)+
  h('Mouse and controls')+rg('sens','Mouse sensitivity',.5,8,.1)+ck('inv','Invert Y axis')+rg('fov','Field of view',60,100,1)+ck('sprintT','Sprint: toggle instead of hold')+rg('mic','Spirit box mic threshold (lower = more sensitive)',.02,.3,.01)+ck('bob','Head bob')+'</div><div>'+
  h('Graphics')+'<label>Render quality<select data-k=res onchange="optIn(this)">'+[[240,'Retro 240p'],[360,'Crisp 360p'],[480,'Sharp 480p'],[0,'Native resolution (slow)']].map(([v,t])=>'<option value='+v+(OPT.res==v?' selected':'')+'>'+t+'</option>').join('')+'</select></label>'+rg('bright','Brightness',.6,1.8,.05)+ck('wob','PlayStation vertex wobble')+ck('dith','Color dithering')+ck('vig','Dark vignette')+ck('fps','Show FPS')+
  h('Gameplay and comfort')+ck('strobe','Flashing effects and light flicker')+rg('shake','Screen shake',0,1,.1)+ck('hints','Show control hints')+ck('dot','Crosshair dot')+ck('pause','Pause the game while menus are open (single-player)')+'</div></div>'+
  '<p class=ref>WASD move · Shift sprint · Mouse look · 1 / 2 equip tools · E interact · G drop · F flashlight · T ask the spirit box · C or click: camera · Tab journal · Esc menu</p><button onclick="settingsBack()">Back</button><button onclick="resetOpts()">Reset to defaults</button></div>')}
function settingsBack(){const f=window[SRET];SRET='mainMenu';if(f)f()}
function settingsFromPause(){settings('pauseMenu')}
function settingsFromLobby(){settings('lobbyMenu')}
function pauseMenu(){show('<div class=p><h1>'+(OPT.pause?'Paused':'Menu')+'</h1>'+(OPT.pause?'':'<p style="opacity:.8">The game is still running.</p>')+'<button onclick="resume()">Resume</button><button onclick="settingsFromPause()">Settings</button><button onclick="leaveAsk()">Leave job</button><button onclick="mainMenu()">Main menu</button></div>')}
function lobbyMenu(){mode='lobbyui';show('<div class=p><h1>HQ</h1><button onclick="lobbyResume()">Resume</button><button onclick="modeSel()">Invite friends</button><button onclick="settingsFromLobby()">Settings</button><button onclick="mainMenu()">Main menu</button></div>')}
addEventListener('blur',()=>{keys={}});
setInterval(()=>{const n=performance.now();if(document.hidden)step(Math.min((n-FPSS.bg)/1000,.1));FPSS.bg=n},50);
applyOpts();
loadModels();mainMenu();addEventListener('pointerdown',ac);addEventListener('keydown',ac);addEventListener('keydown',e=>{if(mode==='lobby'&&e.code==='KeyE')lobbyInteract()});document.addEventListener('pointerlockchange',()=>{if(mode==='lobby'&&!document.pointerLockElement){mode='lobbyui';lobbyMenu()}});autoJoin();addEventListener('mousedown',()=>{if(mode==='play'&&document.pointerLockElement&&!HID)useTool()});
