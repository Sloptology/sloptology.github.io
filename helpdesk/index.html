<style>
/* Layout: a framed chat-app window (rail | ticket list | conversation) on a desk-coloured ground. On phones it shows the list or the conversation, one at a time. */
:root{
  --bg:#e9e7f4; --panel:#ffffff; --panel-2:#f6f5fc; --rail:#2d2a63; --rail-ink:#c9c6f0;
  --ink:#1d1b32; --muted:#6a6786; --line:#e1deef; --accent:#5a4fcf; --accent-ink:#ffffff;
  --me:#e6e3fb; --them:#f1f0f9; --good:#1b7f55; --warn:#9a5700; --bad:#c0304a;
  --shadow:0 10px 40px rgba(40,30,100,.16);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100f22; --panel:#1b1a34; --panel-2:#221f40; --rail:#0c0b1c; --rail-ink:#9c98d4;
  --ink:#eceaf9; --muted:#9a97bb; --line:#2e2b52; --accent:#8c83ff; --accent-ink:#12102b;
  --me:#332f70; --them:#262348; --good:#4cc790; --warn:#e5a63b; --bad:#ff7a90; --shadow:0 10px 40px rgba(0,0,0,.4);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#100f22; --panel:#1b1a34; --panel-2:#221f40; --rail:#0c0b1c; --rail-ink:#9c98d4;
  --ink:#eceaf9; --muted:#9a97bb; --line:#2e2b52; --accent:#8c83ff; --accent-ink:#12102b;
  --me:#332f70; --them:#262348; --good:#4cc790; --warn:#e5a63b; --bad:#ff7a90; --shadow:0 10px 40px rgba(0,0,0,.4);
  color-scheme:dark;}

*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:56px 340px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);max-width:1280px;margin:0 auto}

/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:9px 14px;background:var(--rail);color:#fff}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.mark{position:relative;width:24px;height:20px;flex:none}
.mark::before,.mark::after{content:"";position:absolute;top:0;width:14px;height:20px;border-radius:5px}
.mark::before{left:0;background:#8c83ff}
.mark::after{right:0;background:#f4f3ff;mix-blend-mode:normal;opacity:.92;clip-path:inset(0 0 0 0 round 5px)}
.shift{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.bar{flex:1;min-width:30px;height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#8c83ff;border-radius:3px;transition:width .4s}
.clock{font-family:var(--font-mono);font-size:14px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--rail-ink);white-space:nowrap}
.stats b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.out{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.out:hover{background:rgba(255,255,255,.1)}
.out.arm{background:var(--bad);border-color:var(--bad)}

/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.rail div{width:44px;height:44px;display:grid;place-items:center;color:var(--rail-ink);opacity:.6;position:relative;border-radius:8px}
.rail div.on{opacity:1;color:#fff}
.rail div.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:2px;background:#8c83ff}
.rail svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* list */
.list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.list-head{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 10px}
.list-head h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.list-head span{font-size:12.5px;color:var(--muted)}
#rows{overflow-y:auto;flex:1;min-height:0}
.empty-list{padding:20px 16px;color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;align-items:center;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 16px;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row.sel{background:var(--me)}
.row.done{opacity:.62}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;position:relative}
.row-main{min-width:0}
.row-top{display:flex;align-items:center;gap:7px}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pri{font-family:var(--font-mono);font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:5px;flex:none;letter-spacing:.03em}
.pri.p1{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pri.p2{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pri.p3{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
.prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.sla{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.sla.urgent{color:var(--bad);font-weight:500}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:11.5px;display:grid;place-items:center}
.stars{color:var(--accent);letter-spacing:1px;font-size:12px}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.chat-empty{margin:auto;padding:24px;text-align:center;color:var(--muted);max-width:360px}
.chat-empty h3{font-family:var(--font-display);color:var(--ink);font-size:22px;margin:0 0 6px}
.chat-head{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.back{display:none;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;padding:4px 8px 4px 0;color:var(--ink)}
.ch-main{min-width:0;flex:1}
.ch-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sla{font-family:var(--font-mono);font-size:12px;text-align:right;white-space:nowrap}
.ch-sla.urgent{color:var(--bad)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-end;min-width:0}
.msg.me{justify-content:flex-end}
.msg .av{width:30px;height:30px;font-size:11px}
.bubble{max-width:min(560px,86%);padding:9px 13px;border-radius:12px;background:var(--them);overflow-wrap:anywhere}
.me .bubble{background:var(--me);border-bottom-right-radius:4px}
.them .bubble{border-bottom-left-radius:4px}
.meta{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-bottom:2px}
.sys{align-self:flex-start;margin-left:40px;max-width:min(600px,90%);font-family:var(--font-mono);font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 10px;overflow-wrap:anywhere}
.do{align-self:flex-end;max-width:min(560px,92%);font-family:var(--font-mono);font-size:12.5px;border:1px dashed var(--accent);border-radius:9px;padding:8px 12px;overflow-wrap:anywhere}
.do b{color:var(--accent);font-weight:500;margin-right:6px}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.close{align-self:center;width:min(520px,100%);border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel-2);margin-top:6px}
.close h4{margin:0 0 4px;font-size:12px;font-family:var(--font-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.close .big{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--accent);letter-spacing:2px}
.close p{margin:6px 0 0;font-size:14px}
.flag{display:inline-block;margin-top:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);padding:2px 8px;border-radius:5px}

.choices{border-top:1px solid var(--line);background:var(--panel-2);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.choices-label{font-size:11.5px;font-family:var(--font-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);
  border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .tag{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:5px;padding:2px 6px;white-space:nowrap}
.opt .txt{overflow-wrap:anywhere}
.opt .cost{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.opt.runs .txt{font-family:var(--font-mono);font-size:13px}
.notice{padding:14px 16px;border-top:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:13.5px}

/* toast + overlay */
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 70px);z-index:30;background:var(--ink);color:var(--panel);
  padding:10px 14px;border-radius:10px;max-width:min(340px,calc(100% - 32px));font-size:13.5px;box-shadow:var(--shadow)}
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow-y:auto;background:color-mix(in srgb,var(--rail) 78%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay[hidden],.toast[hidden]{display:none!important}
.card{background:var(--panel);border-radius:16px;padding:28px;width:min(560px,100%);max-height:100%;overflow-y:auto;box-shadow:var(--shadow)}
.card h1{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
.card h2{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.05;margin:0 0 4px;letter-spacing:-.01em}
.lede{font-weight:600;margin:0 0 14px;color:var(--accent)}
.card p{margin:0 0 12px}
.go{margin-top:6px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:11px 20px;cursor:pointer;font-size:15px}
.go:hover{filter:brightness(1.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
.stat b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.rank{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--accent);margin:4px 0 12px;text-wrap:balance}
.rep{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column}
.rep li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rep li span:first-child{min-width:0;overflow-wrap:anywhere}
.rep .x{color:var(--muted);white-space:nowrap}
.rep .sec{color:var(--bad)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .list,.chat{grid-column:1}
  .app[data-view="list"] .chat{display:none}
  .app[data-view="chat"] .list{display:none}
  .back{display:block}
  .stats .hide-s{display:none}
  .top{gap:12px}
  .bar{display:none}
  .shift{justify-content:flex-end}
  .stats{flex:none}
  .card h1{font-size:36px}
  .card{padding:22px}
  .opt{grid-template-columns:minmax(0,1fr);gap:6px}
  .opt .cost{justify-self:start}
}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}.bar i{transition:none}}

 {do:"Switch his client to the TCP 443 (SSTP) fallback profile",to:'eGreat',t:10},

DATA.forEach(t=>Object.values(t.nodes).forEach(n=>{if(n.c==='VPN_FIX')n.c=VPN_FIX;}));

const NUDGE={
 P1:["I really need an update on this. It's urgent.","Hello?? Are you still there?"],
 P2:["Any update? I'm still stuck.","Just checking in. Still not working on my end."],
 P3:["Hi, any news on this? No rush, but it's been a while.","Following up on my ticket whenever you get a chance."]
};

/* ---------- State ---------- */
let S=null,GEN=0,armTimer=null,toastTimer=null;
function newGame(){
  GEN++;
  S={clock:START,gen:GEN,active:null,over:false,
    tickets:DATA.map(d=>({...d,arrived:false,status:'new',node:d.start,log:[],unread:0,busy:false,sat:0,breached:false,stars:null,sec:false,outcome:null,closedAt:null,note:''}))};
}
const act=()=>S&&S.tickets.find(t=>t.id===S.active);

function toast(txt){
  const el=$('#toast');el.textContent=txt;el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},3600);
}
function push(t,msg){
  t.log.push({time:S.clock,...msg});
  if(msg.k==='them'&&S.active!==t.id)t.unread++;
  render();
}
function arrive(t){
  t.arrived=true;t.status='open';
  t.nodes[t.start].m.forEach(s=>{
    const sys=s[0]==='~';
    t.log.push({time:t.at,k:sys?'sys':'them',text:sys?s.slice(1):s});
    if(!sys)t.unread++;
  });
  if(S.clock>START||t.at>START)toast('New ticket from '+t.who+' ('+t.pri+')');
}
function arrivals(){S.tickets.forEach(t=>{if(!t.arrived&&t.at<=S.clock)arrive(t)});}
function breaches(){
  S.tickets.forEach(t=>{
    if(t.arrived&&t.status==='open'&&!t.breached&&S.clock>t.at+t.sla){
      t.breached=true;t.sat-=1;
      push(t,{k:'them',text:pick(NUDGE[t.pri])});
      toast(t.who+"'s ticket is past its deadline");
    }
  });
}
function tick(mins){
  S.clock+=mins;
  arrivals();breaches();
  if(S.clock>=END)endShift();
}

/* ---------- Gameplay ---------- */
function choose(i){
  const t=act();
  if(!t||S.over||t.busy||t.status!=='open')return;
  const c=t.nodes[t.node].c[i];if(!c)return;
  push(t,c.say?{k:'me',text:c.say}:{k:'do',text:c.do});
  t.sat+=c.sat||0;t.busy=true;
  tick(c.t||12);
  if(S.over)return;
  go(t,c.to);
}
function go(t,nid){
  const node=t.nodes[nid],gen=S.gen;
  t.node=nid;t.busy=true;render();
  node.m.forEach((s,i)=>setTimeout(()=>{
    if(S.gen!==gen)return;
    const sys=s[0]==='~';
    push(t,{k:sys?'sys':'them',text:sys?s.slice(1):s});
  },(i+1)*950));
  setTimeout(()=>{
    if(S.gen!==gen)return;
    if(node.end)closeTicket(t,node);else{t.busy=false;render();}
  },node.m.length*950+600);
}
function closeTicket(t,node){
  let st=Math.round({great:5,good:4,ok:3,bad:1}[node.end]+t.sat);
  st=Math.max(1,Math.min(5,st));if(node.end==='bad')st=Math.min(st,2);
  Object.assign(t,{busy:false,status:'done',stars:st,sec:!!node.sec,outcome:node.end,closedAt:S.clock,note:node.note||''});
  push(t,{k:'close',stars:st,note:t.note,sec:t.sec,late:t.breached});
  idleCheck();
}
function idleCheck(){
  if(S.over)return;
  const open=S.tickets.some(t=>t.arrived&&t.status==='open');
  if(open)return;
  const next=S.tickets.filter(t=>!t.arrived).sort((a,b)=>a.at-b.at)[0];
  if(next){
    if(next.at>S.clock){S.clock=next.at;toast('Quiet spell. The clock moves to '+fmt(next.at)+'.');}
    arrivals();render();
  }else{
    const gen=S.gen;setTimeout(()=>{if(S.gen===gen)endShift();},1800);
  }
}
function endShift(){
  if(S.over)return;
  S.over=true;S.gen=++GEN;
  S.tickets.forEach(t=>{if(t.status==='open')t.status='abandoned';});
  render();showReport();
}

/* ---------- Rendering ---------- */
function deadline(t){return t.at+t.sla-S.clock;}
function renderHud(){
  $('#clock').textContent=fmt(Math.min(S.clock,END));
  $('#bar').style.width=Math.min(100,(S.clock-START)/(END-START)*100)+'%';
  const done=S.tickets.filter(t=>t.status==='done');
  $('#csat').textContent=done.length?(done.reduce((a,t)=>a+t.stars,0)/done.length).toFixed(1):'–';
  $('#solved').textContent=done.length+'/'+S.tickets.length;
}
function renderList(){
  const vis=S.tickets.filter(t=>t.arrived);
  const open=vis.filter(t=>t.status==='open'||t.status==='abandoned').sort((a,b)=>(a.at+a.sla)-(b.at+b.sla));
  const done=vis.filter(t=>t.status==='done').sort((a,b)=>b.closedAt-a.closedAt);
  $('#openCount').textContent=open.filter(t=>t.status==='open').length+' open';
  if(!vis.length){$('#rows').innerHTML='<div class="empty-list">No conversations yet. Tickets arrive here.</div>';return;}
  $('#rows').innerHTML=[...open,...done].map(t=>{
    const last=[...t.log].reverse().find(m=>m.k!=='close');
    const l=deadline(t);
    const side=t.status==='done'?'<span class="stars" aria-label="'+t.stars+' of 5 stars">'+starTxt(t.stars)+'</span>'
      :t.status==='abandoned'?'<span class="sla urgent">Unresolved</span>'
      :'<span class="sla'+(l<=30?' urgent':'')+'">'+leftTxt(l)+'</span>'+(t.unread?'<span class="badge">'+t.unread+'</span>':'');
    return '<button class="row'+(S.active===t.id?' sel':'')+(t.status==='done'?' done':'')+'" data-id="'+t.id+'" type="button">'
      +'<span class="av" style="background:hsl('+t.hue+' 42% 40%)" aria-hidden="true">'+esc(initials(t.who))+'</span>'
      +'<span class="row-main"><span class="row-top"><span class="nm">'+esc(t.who)+'</span><span class="pri '+t.pri.toLowerCase()+'">'+t.pri+'</span></span>'
      +'<span class="prev" style="display:block">'+esc(last?last.text:t.subject)+'</span></span>'
      +'<span class="row-side">'+side+'</span></button>';
  }).join('');
}
function msgHtml(t,m){
  const meta=(who)=>'<span class="meta">'+esc(who)+' · '+fmt(m.time)+'</span>';
  if(m.k==='them')return '<div class="msg them"><span class="av" style="background:hsl('+t.hue+' 42% 40%)" aria-hidden="true">'+esc(initials(t.who))+'</span><div class="bubble">'+meta(t.who)+esc(m.text)+'</div></div>';
  if(m.k==='me')return '<div class="msg me"><div class="bubble">'+meta('You')+esc(m.text)+'</div></div>';
  if(m.k==='do')return '<div class="do"><b>RUN</b>'+esc(m.text)+'</div>';
  if(m.k==='sys')return '<div class="sys">'+esc(m.text)+'</div>';
  if(m.k==='close')return '<div class="close"><h4>Ticket closed · '+t.id+'</h4><div class="big" aria-label="'+m.stars+' of 5 stars">'+starTxt(m.stars)+'</div>'
    +(m.note?'<p>'+esc(m.note)+'</p>':'')+(m.late?'<span class="flag" style="margin-right:6px">Missed deadline</span>':'')+(m.sec?'<span class="flag">Security slip</span>':'')+'</div>';
  return '';
}
function renderChat(){
  const t=act(),el=$('#chat');
  if(!t){
    el.innerHTML='<div class="chat-empty"><h3>Pick a conversation</h3><p>Open a ticket from the list. Every action costs shift time, and everyone else keeps waiting while you work.</p></div>';
    return;
  }
  const l=deadline(t);
  const sla=t.status==='done'?'Closed '+fmt(t.closedAt):t.status==='abandoned'?'Unresolved':leftTxt(l);
  let foot='';
  if(t.status==='open'&&!t.busy&&!S.over){
    const cs=t.nodes[t.node].c;
    foot='<div class="choices"><div class="choices-label">Your move</div>'+cs.map((c,i)=>
      '<button class="opt'+(c.do?' runs':'')+'" data-i="'+i+'" type="button"><span class="tag">'+(i+1)+' · '+(c.do?'Run':'Say')+'</span><span class="txt">'+esc(c.say||c.do)+'</span><span class="cost">~'+(c.t||12)+' min</span></button>').join('')+'</div>';
  }else if(t.status==='done'){foot='<div class="notice">This ticket is closed. Pick another conversation.</div>';}
  else if(t.status==='abandoned'||S.over){foot='<div class="notice">The shift is over.</div>';}
  const typing=(t.busy&&t.status==='open')?'<div class="msg them"><span class="av" style="background:hsl('+t.hue+' 42% 40%)" aria-hidden="true">'+esc(initials(t.who))+'</span><div class="bubble"><span class="typing" aria-label="typing"><i></i><i></i><i></i></span></div></div>':'';
  el.innerHTML='<div class="chat-head"><button class="back" id="back" type="button" aria-label="Back to conversations">&lsaquo;</button>'
    +'<span class="av" style="background:hsl('+t.hue+' 42% 40%)" aria-hidden="true">'+esc(initials(t.who))+'</span>'
    +'<div class="ch-main"><div class="ch-name">'+esc(t.who)+'</div><div class="ch-sub">'+esc(t.role)+' · '+t.id+' · '+t.pri+' · '+esc(t.subject)+'</div></div>'
    +'<div class="ch-sla'+(t.status==='open'&&l<=30?' urgent':'')+'">'+sla+'</div></div>'
    +'<div class="msgs" id="msgs">'+t.log.map(m=>msgHtml(t,m)).join('')+typing+'</div>'+foot;
  const ms=$('#msgs');ms.scrollTop=ms.scrollHeight;
}
function render(){renderHud();renderList();renderChat();}

function openTicket(id){
  S.active=id;const t=act();t.unread=0;
  $('#app').dataset.view='chat';render();
}
function showBrief(){
  const o=$('#overlay');o.hidden=false;
  o.innerHTML='<div class="card"><h1 id="ovTitle">Tier One</h1><p class="lede">Thursday, 9:00 AM. You are the entire help desk at Brightwell Logistics.</p>'
   +'<p>Employees message you in Tandem. Open a conversation, then choose what to say or which fix to run. Each choice shows how many minutes it costs on the shift clock.</p>'
   +'<p>Every waiting ticket keeps aging while you work on another. The deadline is next to each name, and P1 means someone is blocked right now. Your shift ends at 5:00 PM.</p>'
   +'<p>You are graded on customer satisfaction, deadlines met, and whether you kept the company safe.</p>'
   +'<button class="go" id="start" type="button">Clock in</button></div>';
  $('#start').focus();
}
function showReport(){
  const T=S.tickets,done=T.filter(t=>t.status==='done');
  const avg=done.length?done.reduce((a,t)=>a+t.stars,0)/done.length:0;
  const breaches=T.filter(t=>t.breached).length,sec=T.filter(t=>t.sec).length,miss=T.length-done.length;
  const score=done.reduce((a,t)=>a+t.stars*20,0)-sec*50-miss*30;
  const rank=score>=680?'Help Desk Legend':score>=520?'Senior Technician':score>=360?'Solid Tier 1':score>=200?'Probationary Hire':'Have you tried turning yourself off and on again?';
  const o=$('#overlay');o.hidden=false;
  o.innerHTML='<div class="card"><h2 id="ovTitle">Shift report</h2><p class="lede">Clocked out at '+fmt(Math.min(S.clock,END))+'</p>'
   +'<div class="rank">'+esc(rank)+'</div>'
   +'<div class="grid"><div class="stat"><span>Score</span><b>'+score+'</b></div><div class="stat"><span>Avg CSAT</span><b>'+(done.length?avg.toFixed(1):'–')+'</b></div>'
   +'<div class="stat"><span>Solved</span><b>'+done.length+'/'+T.length+'</b></div><div class="stat"><span>Late</span><b>'+breaches+'</b></div><div class="stat"><span>Security</span><b>'+sec+'</b></div></div>'
   +'<ul class="rep">'+T.map(t=>'<li><span>'+esc(t.who)+' · '+esc(t.subject)+(t.sec?' <span class="sec">(security slip)</span>':'')+'</span><span class="x">'
     +(t.status==='done'?starTxt(t.stars):t.arrived?'Unresolved':'Never picked up')+'</span></li>').join('')+'</ul>'
   +'<button class="go" id="again" type="button">Clock in again</button></div>';
  $('#again').focus();
}
function startShift(){
  $('#overlay').hidden=true;
  arrivals();$('#app').dataset.view='list';render();
}

/* ---------- Events ---------- */
$('#rows').addEventListener('click',e=>{const b=e.target.closest('.row');if(b)openTicket(b.dataset.id);});
$('#chat').addEventListener('click',e=>{
  if(e.target.closest('#back')){$('#app').dataset.view='list';S.active=null;render();return;}
  const o=e.target.closest('.opt');if(o)choose(+o.dataset.i);
});
$('#overlay').addEventListener('click',e=>{
  if(e.target.id==='start')startShift();
  if(e.target.id==='again'){newGame();startShift();}
});
$('#out').addEventListener('click',()=>{
  const b=$('#out');
  if(!S||S.over)return;
  if(b.classList.contains('arm')){clearTimeout(armTimer);b.classList.remove('arm');b.textContent='Clock out';endShift();return;}
  b.classList.add('arm');b.textContent='Sure? Click again';
  armTimer=setTimeout(()=>{b.classList.remove('arm');b.textContent='Clock out';},3000);
});
document.addEventListener('keydown',e=>{
  if(!$('#overlay').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key))choose(+e.key-1);
});

newGame();render();showBrief();
</script>

</body></html>
