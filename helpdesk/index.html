<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Help Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a framed chat-app window (rail | ticket list | conversation) on a desk-coloured ground. On phones it shows the list or the conversation, one at a time. */
:root{
  --bg:#e9e7f4; --panel:#ffffff; --panel-2:#f6f5fc; --rail:#2d2a63; --rail-ink:#c9c6f0;
  --ink:#1d1b32; --muted:#6a6786; --line:#e1deef; --accent:#5a4fcf; --accent-ink:#ffffff;
  --me:#e6e3fb; --them:#f1f0f9; --good:#1b7f55; --warn:#9a5700; --bad:#c0304a;
  --shadow:0 10px 40px rgba(40,30,100,.16);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100f22; --panel:#1b1a34; --panel-2:#221f40; --rail:#0c0b1c; --rail-ink:#9c98d4;
  --ink:#eceaf9; --muted:#9a97bb; --line:#2e2b52; --accent:#8c83ff; --accent-ink:#12102b;
  --me:#332f70; --them:#262348; --good:#4cc790; --warn:#e5a63b; --bad:#ff7a90; --shadow:0 10px 40px rgba(0,0,0,.4);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#100f22; --panel:#1b1a34; --panel-2:#221f40; --rail:#0c0b1c; --rail-ink:#9c98d4;
  --ink:#eceaf9; --muted:#9a97bb; --line:#2e2b52; --accent:#8c83ff; --accent-ink:#12102b;
  --me:#332f70; --them:#262348; --good:#4cc790; --warn:#e5a63b; --bad:#ff7a90; --shadow:0 10px 40px rgba(0,0,0,.4);
  color-scheme:dark;}

*{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:56px 340px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);max-width:1280px;margin:0 auto}

/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:9px 14px;background:var(--rail);color:#fff}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.mark{position:relative;width:24px;height:20px;flex:none}
.mark::before,.mark::after{content:"";position:absolute;top:0;width:14px;height:20px;border-radius:5px}
.mark::before{left:0;background:#8c83ff}
.mark::after{right:0;background:#f4f3ff;mix-blend-mode:normal;opacity:.92;clip-path:inset(0 0 0 0 round 5px)}
.shift{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.bar{flex:1;min-width:30px;height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#8c83ff;border-radius:3px;transition:width .4s}
.clock{font-family:var(--font-mono);font-size:14px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--rail-ink);white-space:nowrap}
.stats b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.stats b.hot{color:#ff9db0}
.out{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:7px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.out:hover{background:rgba(255,255,255,.1)}
.out.arm{background:var(--bad);border-color:var(--bad)}

/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.rail div{width:44px;height:44px;display:grid;place-items:center;color:var(--rail-ink);opacity:.6;position:relative;border-radius:8px}
.rail div.on{opacity:1;color:#fff}
.rail div.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;border-radius:2px;background:#8c83ff}
.rail svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* list */
.list{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.list-head{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 10px}
.list-head h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.list-head span{font-size:12.5px;color:var(--muted)}
#rows{overflow-y:auto;flex:1;min-height:0}
.empty-list{padding:20px 16px;color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:11px;align-items:center;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 16px;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row.sel{background:var(--me)}
.row.done{opacity:.62}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;position:relative}
.row-main{min-width:0}
.row-top{display:flex;align-items:center;gap:7px}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pri{font-family:var(--font-mono);font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:5px;flex:none;letter-spacing:.03em}
.pri.p1{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pri.p2{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pri.p3{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
.pri.boss{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.pri.p4{color:var(--muted);background:transparent;border:1px solid var(--line)}
.prev{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.sla{font-family:var(--font-mono);font-size:11px;font-variant-numeric:tabular-nums}
.sla.urgent{color:var(--bad);font-weight:500}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:11.5px;display:grid;place-items:center}
.stars{color:var(--accent);letter-spacing:1px;font-size:12px}

/* chat */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.chat-empty{margin:auto;padding:24px;text-align:center;color:var(--muted);max-width:360px}
.chat-empty h3{font-family:var(--font-display);color:var(--ink);font-size:22px;margin:0 0 6px}
.chat-head{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.back{display:none;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;padding:4px 8px 4px 0;color:var(--ink)}
.ch-main{min-width:0;flex:1}
.ch-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sla{font-family:var(--font-mono);font-size:12px;text-align:right;white-space:nowrap}
.ch-sla.urgent{color:var(--bad)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-end;min-width:0}
.msg.me{justify-content:flex-end}
.msg .av{width:30px;height:30px;font-size:11px}
.bubble{max-width:min(560px,86%);padding:9px 13px;border-radius:12px;background:var(--them);overflow-wrap:anywhere}
.me .bubble{background:var(--me);border-bottom-right-radius:4px}
.them .bubble{border-bottom-left-radius:4px}
.meta{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-bottom:2px}
.sys{align-self:flex-start;margin-left:40px;max-width:min(600px,90%);font-family:var(--font-mono);font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 10px;overflow-wrap:anywhere}
.do{align-self:flex-end;max-width:min(560px,92%);font-family:var(--font-mono);font-size:12.5px;border:1px dashed var(--accent);border-radius:9px;padding:8px 12px;overflow-wrap:anywhere}
.do b{color:var(--accent);font-weight:500;margin-right:6px}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.close{align-self:center;width:min(520px,100%);border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel-2);margin-top:6px}
.close h4{margin:0 0 4px;font-size:12px;font-family:var(--font-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.close .big{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--accent);letter-spacing:2px}
.close p{margin:6px 0 0;font-size:14px}
.flag{display:inline-block;margin-top:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);padding:2px 8px;border-radius:5px}

.choices{border-top:1px solid var(--line);background:var(--panel-2);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.choices-label{font-size:11.5px;font-family:var(--font-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);
  border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .tag{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:5px;padding:2px 6px;white-space:nowrap}
.opt .txt{overflow-wrap:anywhere}
.opt .cost{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.opt.runs .txt{font-family:var(--font-mono);font-size:13px}
.notice{padding:14px 16px;border-top:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:13.5px}

/* toast + overlay */
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 70px);z-index:30;background:var(--ink);color:var(--panel);
  padding:10px 14px;border-radius:10px;max-width:min(340px,calc(100% - 32px));font-size:13.5px;box-shadow:var(--shadow)}
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow-y:auto;background:color-mix(in srgb,var(--rail) 78%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.overlay[hidden],.toast[hidden]{display:none!important}
.card{background:var(--panel);border-radius:16px;padding:28px;width:min(560px,100%);max-height:100%;overflow-y:auto;box-shadow:var(--shadow)}
.card h1{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
.card h2{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.05;margin:0 0 4px;letter-spacing:-.01em}
.lede{font-weight:600;margin:0 0 14px;color:var(--accent)}
.card p{margin:0 0 12px}
.go{margin-top:6px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:11px 20px;cursor:pointer;font-size:15px}
.go:hover{filter:brightness(1.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel-2);border-radius:10px;padding:10px 12px}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
.stat b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.rank{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--accent);margin:4px 0 12px;text-wrap:balance}
.rep{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column}
.rep li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rep li span:first-child{min-width:0;overflow-wrap:anywhere}
.rep .x{color:var(--muted);white-space:nowrap}
.rep .sec{color:var(--bad)}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .list,.chat{grid-column:1}
  .app[data-view="list"] .chat{display:none}
  .app[data-view="chat"] .list{display:none}
  .back{display:block}
  .stats .hide-s{display:none}
  .top{gap:12px}
  .bar{display:none}
  .bn{display:none}
  .shift{justify-content:flex-end}
  .stats{flex:none}
  .card h1{font-size:36px}
  .card{padding:22px}
  .opt{grid-template-columns:minmax(0,1fr);gap:6px}
  .opt .cost{justify-self:start}
}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}.bar i{transition:none}}
</style>

<div class="app" id="app" data-view="list">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span class="bn">Tandem</span></div>

    <div class="stats">

    <div><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></div>

  <section class="list" aria-label="Conversations">

</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=(h,m=0)=>h*60+m;
const START=H(9),END=H(17);
const fmt=m=>{const h=Math.floor(m/60),mm=m%60;return ((h+11)%12+1)+':'+String(mm).padStart(2,'0')+' '+(h>=12?'PM':'AM')};
const leftTxt=m=>m<=0?'Overdue':m>=60?Math.floor(m/60)+'h '+(m%60)+'m left':m+'m left';
const starTxt=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const initials=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');

/* ---------- People and tickets ----------
 Every shift draws 8 issue types at random, gives each a random root cause, and assigns people from a roster of 120.
 A fix is F(text, quality, user reply, debrief note, extras). Quality: g great, d good, k ok, b bad.
 Text starting with "say:" is sent as a chat message, anything else is an action you run. */
const FIRST=["Aaliyah","Abel","Adriana","Akira","Amara","Andre","Anika","Arjun","Beatriz","Bram","Camille","Carlos","Chidi","Chloe","Dalia","Dmitri","Elena","Emeka","Farah","Felix","Fatima","Gabriel","Greta","Hana","Hector","Imani","Ingrid","Isaac","Jada","Jonas","Kai","Keiko","Lars","Leila","Linus","Lucia","Mateo","Maya","Nadia","Nikhil","Noor","Olga","Omar","Paloma","Quentin","Rafael","Renata","Sana","Soren","Talia","Tomas","Uma","Viktor","Wen","Xavier","Yara","Yusuf","Zainab","Zoe","Ezra","Aiden","Bianca","Callum","Dara","Eitan","Freya","Gideon","Hiro","Ilse","Jasper","Kira","Lior","Mina","Niko","Orla","Pavel","Rhea","Sven","Tessa","Ugo","Vera","Wyatt","Xiomara","Yael","Zane","Alma","Basil","Cora","Dev","Elif","Finn","Gia","Hugo","Ivy","Joaquin","Kofi","Lena","Milo","Nina","Oskar"];
const LAST=["Abbott","Adeyemi","Alvarez","Andersson","Bakshi","Barros","Bianchi","Bose","Castillo","Chen","Cohen","Dube","Duarte","Eze","Fischer","Flores","Garcia","Gill","Haddad","Hayashi","Hoang","Ibrahim","Ivanov","Jansen","Kapoor","Kim","Kowalski","Lindqvist","Lopez","Mahlangu","Marsh","Mendes","Mishra","Morales","Nakamura","Novak","Obi","Okonkwo","Park","Patel","Petrov","Quinn","Ramos","Reyes","Rossi","Saito","Santos","Schmidt","Sharma","Silva","Singh","Tanaka","Torres","Usman","Varga","Walsh","Yilmaz","Zielinski","Moreau","Nasser","Aguilar","Baptiste","Blum","Brandt","Cardoso","Dimitrov","Ekstrom","Fernandez","Gallo","Hassan","Ito","Jovanovic","Karlsson","Lemaire","Maldonado","Nguyen","Oyelaran","Pereira","Rahman","Sandhu","Takahashi","Underwood","Vasquez","Weber","Xu","Yamada","Zhou","Amadi","Berg","Costa","Dlamini","Esposito","Fontaine","Grover","Hughes","Iyer","Jung","Kasprzak","Lindgren","Okoye"];
const ROLES=["Accounting","Sales","Marketing","Engineering","Human Resources","Facilities","Legal","Operations","Customer Support","Finance","Warehouse","Procurement","Design","Product","IT Security","Executive Office","Quality Assurance","Training","Logistics","Data Analytics"];
const MOODNAMES=["polite","panicked","grumpy","chill","chatty"];
const ROSTER=Array.from({length:300},(_,i)=>({
  id:i,
  name:FIRST[i%FIRST.length]+' '+LAST[(i*7+3+Math.floor(i/FIRST.length)*11)%LAST.length],
  role:ROLES[(i*5+Math.floor(i/ROLES.length))%ROLES.length],
  mood:MOODNAMES[(i*3+1)%5],
  hue:(i*47)%360}));
const MOOD={
  polite:{pre:["Hi! ","Hello. "],post:["",""," Thank you!"],fin:[" Thank you so much!"," Really appreciate it."]},
  panicked:{pre:["HELP. ","Quick!! ","Okay, don't panic. "],post:[" PLEASE HURRY."," This is urgent!!"],fin:[" Phew."," I was about to cry."],sla:0.8},
  grumpy:{pre:["Ugh. ","Seriously? ","Again. "],post:[" Fix it."," I don't have all day."],fin:[" Finally."," About time."],sla:0.9},
  chill:{pre:["Hey. ","No rush. "],post:[" Whenever you can."," No worries if it takes a while."],fin:[" Cheers."," Easy."],sla:1.3},
  chatty:{pre:["Hey hey! ","Morning! "],post:[" Anyway, how's your day going?"," Also, did you hear about the office move?"],fin:[" Got a minute to hear about my weekend?"," Anyway, you should see my cat's new trick."],sla:1.1}
};

const F=(d,q,r,n,x)=>Object.assign({d,q,r,n},x||{});
const C=(clue,f,w)=>({clue:[].concat(clue),f,w});

SC('lost',"Laptop left on a train",'P1',45,

  C("It had client files on it, and I don't think I saved anything to OneDrive.",[
    F("Remote wipe the device, revoke sessions and report the theft to Security and the police",'g',"It's wiped. Thank you for handling this so fast.","A stolen device with client data needs a wipe, session revocation and a report.",{t:20}),

    F("Give them the master badge to use today",'b',"Cool, I can go anywhere.","A master badge is a huge security risk.",{sec:1,t:5})]),
  C("It fails at every door except that one, and it just started this morning.",[
    F("say:Try the next door while I report the faulty reader to Facilities",'g',"That door works. Thanks for reporting the reader.","If everyone fails at one door, the reader is the suspect.",{t:8}),
    F("Disable and re-issue their badge",'k',"New badge issued. The old one worked anyway.","The badge wasn't the problem.")])]),
SC('rdp',"Cannot connect to office PC",'P3',140,
 ["I can't remote into my office computer from home.","Remote desktop says it can't connect to my PC."],
 "What error do you see, and did it work last time?",
 [C("It times out. I haven't been at the office all week.",[
    F("Send a wake-up signal and change their PC's power plan to never sleep",'g',"Connected! Thank you.","A sleeping PC is the usual cause of timeouts.",{t:10}),
    F("Order a new computer",'b',"A whole new computer?","Check power settings before replacing anything.")]),
  C("It says 'The connection was denied because the user account is not authorized for remote login.'",[
    F("Add them to the Remote Desktop Users group after manager approval",'g',"It works now. Thanks!","Remote access needs approval and the right group.",{t:12}),
    F("Make them a local administrator",'b',"I'm an admin now? Cool.","Admin rights are too broad for a remote-login fix.",{sec:1,t:5})])]),
SC('block',"Website blocked",'P3',130,
 ["Our supplier's portal is blocked and I need to place an order.","A website I need is blocked by the company filter."],
 "Which site is it, and what does the block page say?",
 [C("It says 'Uncategorized'. It's our usual freight supplier's portal.",[
    F("Submit a category review and allow the supplier site after checking it",'g',"I'm in! Thanks.","Check the site, then fix the category. Don't turn the filter off.",{t:12}),
    F("Turn off the web filter for them",'b',"The filter is off? Okay.","Disabling security controls for one site is a bad trade.",{sec:1,t:5})]),
  C("It says 'Phishing'. I got the link in an email from a vendor.",[
    F("say:The filter is right. Don't visit it, and report the email to Security",'g',"Okay, I forwarded it. Glad it blocked.","Believe the block page when it names a threat.",{t:10}),
    F("Unblock it so she can finish their task",'b',"Thanks, I'll open it.","Unblocking a flagged phishing site gets accounts compromised.",{sec:1,t:5})])]),
SC('popup',"Browser full of pop-ups",'P3',140,
 ["My browser is full of pop-ups and ads.","Weird ads keep popping up on my screen."],
 "When did it start, and did you install any new extensions or visit anything new?",
 [C("It started after I added a coupon extension last week.",[
    F("Remove the unknown extension and reset the browser settings",'g',"Pop-ups are gone. Thanks!","Rogue extensions are a common source of ad injection."),
    F("Reimage the computer",'b',"A reimage for pop-ups?","Match the fix to the problem size.")]),
  C("Pop-ups appear even with the browser closed, but only a notification box.",[
    F("Block notification permissions for the site and clear site data",'g',"Quiet at last. Thank you.","Notification abuse is a permission problem, not malware.",{t:8}),
    F("Run a full antivirus scan",'k',"Scan finished: nothing found. Still got notifications.","Scans won't change a permission the user granted.",{t:20})])]),
SC('guest',"Guest Wi-Fi for visitors",'P3',150,
 ["We have a client visiting at 2 PM. Can you get them on Wi-Fi?","Visitors need internet in the boardroom this afternoon."],
 "How many visitors, and how long do they need access?",
 [C("Three visitors, just this afternoon.",[
    F("Create a time-limited guest account that expires tonight",'g',"Perfect. Thanks!","Guest access should expire by itself and stay off the corporate network."),
    F("Give them the corporate Wi-Fi password",'b',"Here's the password, everyone!","Never put visitors on the internal network.",{sec:1,t:5})]),
  C("A vendor needs to connect a device that can't do guest login.",[
    F("Register the device on the isolated vendor network with a manager's approval",'g',"Registered. Thank you!","Devices that can't do a login need a separate, restricted network.",{t:15}),
    F("Put the device on the corporate network",'b',"It's on the corporate network now.","Never connect unmanaged devices to the internal network.",{sec:1,t:5})])]),
SC('spill',"Coffee spilled on laptop",'P2',80,
 ["I spilled coffee on my keyboard. It's still on but acting weird.","Someone knocked a water bottle onto my laptop."],
 "First, press and hold the power button until it shuts off and unplug it. Is it off now?",
 [C("It's off. There's coffee under the keys. What now?",[
    F("say:Leave it unplugged, flip it upside down and bring it to IT. Don't use a hairdryer",'g',"Done. Thanks for the quick advice.","Power off, unplug, keep liquid out of circuits, and get it to IT quickly.",{t:8}),
    F("say:Turn it back on to see if it still works",'b',"Smells like burning now...","Powering on a wet laptop can short the board.",{t:5})]),
  C("It's off. It's my tablet, and the screen looks foggy inside.",[
    F("say:Remove the case, don't charge it, and bring it in so we can dry it properly",'g',"Okay, bringing it over. Thanks.","Don't charge a wet device. Remove the case and get it dried.",{t:8}),
    F("Remote wipe the tablet",'k',"It's wiped. I lost my notes.","A wipe isn't needed if the device can be recovered.")])]),
SC('ransom',"Files renamed, ransom note on screen",'P1',30,
 ["All my files have weird extensions and there's a note demanding Bitcoin!","A red screen popped up saying my files are encrypted. Help!!"],
 "Unplug the network cable or turn off Wi-Fi right now. Don't power it off or click anything. What does the note say?",
 [C("The note says I have 48 hours to pay. My desktop and the shared drive files are renamed .locked.",[
    F("Isolate the device, disable their account and call Security to start the incident process",'g',"Security is on it. Thank you for moving fast.","Contain first, then escalate. Ransomware spreads through shared drives.",{t:8}),
    F("Restore from backup first, then tell Security",'d',"Backups are restoring...","Backups matter, but containment and Security come first.",{sec:1}),
    F("Reboot the computer",'b',"It rebooted. The note's still there.","Rebooting can destroy evidence and doesn't stop the spread.")]),
  C("Only my desktop files are affected, I think.",[
    F("Isolate it, check the shared drive for spread and report to Security",'g',"Security says three more folders were affected. Good thing you checked.","Never assume it's contained. Always check shared storage.",{t:12}),
    F("say:Pay it, it's only $300",'b',"Okay... paying it.","Paying doesn't guarantee recovery and funds attackers.",{sec:1,t:5})])],
 {roles:["Accounting","Finance","Operations","Human Resources","Legal","Sales"]}),
SC('cal',"Meetings missing from calendar",'P3',130,
 ["Half my meetings have vanished from my calendar.","My calendar is showing someone else's meetings."],
 "Is it only on your laptop, or on your phone too? And did anything change recently?",
 [C("It's only on my laptop. My phone looks right.",[
    F("Clear the Outlook cache and re-add the calendar",'g',"Meetings are back! Thanks.","If devices disagree, the problem is a local cache."),
    F("Delete their mailbox profile",'b',"Why did you delete my profile?","Don't destroy a profile when a cache refresh will do.",{sec:1})]),
  C("My manager's meetings are showing as mine. I think I clicked something last week.",[
    F("Remove the extra delegate permission and the shared calendar",'g',"Fixed. I only see mine now.","Delegate permissions can overlay someone else's calendar."),
    F("Reset their password",'k',"Reset done. Same calendar problem.","A password reset doesn't touch calendar permissions.")])]),
SC('phone',"Work phone email not syncing",'P3',140,
 ["My work email isn't updating on my phone.","The email app on my phone stopped syncing yesterday."],
 "Did you change your password recently, and does the phone say anything in the app?",
 [C("I changed my password two days ago. The app shows a red warning.",[
    F("say:Re-enter the new password in the mail app",'g',"It's syncing again. Thanks!","A password change breaks sync until the app is updated."),
    F("Reset the phone to factory settings",'b',"A factory reset for email?","Don't wipe a phone to fix a stale password.")]),
  C("The phone says storage is full and the app won't download new mail.",[
    F("say:Clear the app cache and move photos off the device",'g',"I freed up space and it's syncing. Thanks.","Full storage stops sync. Free space first.",{t:12}),
    F("Replace the phone",'b',"A new phone?","Check storage before replacing hardware.")])]),
SC('newhire',"New hire cannot sign in",'P2',90,
 ["It's my first day and I can't sign in to anything.","New employee here. My login isn't working."],
 "Welcome! Can I get your employee ID and your manager's name?",
 [C(["Sure. Employee ID and manager's name.","~HR record: start date is TOMORROW. Account not yet enabled."],[
    F("say:Ask their manager to confirm and enable the account for them start date",'g',"Manager confirmed. I'm in! Thank you.","Don't enable accounts early without approval.",{t:15}),
    F("Enable the account without confirmation",'k',"I'm in. Is that okay?","Skipping approval breaks the onboarding process.",{sec:1})]),
  C(["Sure, details match.","~Account is enabled. The temporary password was never delivered."],[
    F("Send the one-time setup link to their personal phone on file",'g',"Got it! I'm in.","One-time links beat reading passwords aloud.",{t:10}),
    F("Read their the password over chat",'k',"Typing it in... works.","Passwords in chat linger in the history.",{sec:1})])]),
SC('keys',"Keyboard types the wrong characters",'P3',130,
 ["My keyboard is typing the wrong characters. The @ and \" keys are swapped.","Half my keys type something else. It's driving me crazy."],
 "Did anything change recently, like a new keyboard or a shortcut you pressed?",
 [C("I think I pressed some shortcut. The language bar says something different now.",[
    F("say:Press Win+Space to switch the keyboard layout back to English (US)",'g',"That fixed it! Thank you.","Layout shortcuts are a common accidental trigger.",{t:5}),
    F("Replace the keyboard",'b',"A new keyboard? The old one is fine.","Check settings before replacing hardware.")]),
  C("I plugged in an external keyboard from home, and now it types differently from the laptop.",[
    F("Set the external keyboard's layout to match in Windows settings",'g',"Matched. Typing normally now.","Different keyboards can need different layouts.",{t:10}),
    F("Reinstall the keyboard driver",'k',"Reinstalled. Same issue.","A driver reinstall can't fix a layout mismatch.")])]),
SC('serverheat',"Server room temperature alarm",'P1',35,
 ["The server room temperature alarm is going off. It says 38 degrees.","Alarm in the server closet. It's really warm in here and the fans are screaming."],
 "Don't touch anything yet. What does the display say, and is the door closed with the AC running?",
 [C("The AC unit is dead. The display reads 38°C and rising.",[
    F("Shut down non-critical servers, prop the door and call Facilities for emergency HVAC",'g',"Temperature is dropping. Facilities is on the way. Thank you!","Protect the critical systems first, then fix the cooling. Shutting down non-critical load buys time.",{t:8}),
    F("say:Leave it, servers are built to handle heat",'b',"It's 40 degrees now. This isn't good.","Heat kills hardware quickly. Act on alarms immediately.",{t:5}),
    F("Open every window and bring in a fan",'k',"A little cooler, but the AC is still dead.","A fan helps, but it doesn't replace real cooling or shutting down load.")]),
  C("The AC is running but a sensor shows 35°C near the top rack. Airflow looks blocked.",[
    F("say:Clear the boxes blocking the vents and rebalance the load across racks",'g',"Temperatures are normalizing. Whoever stacked boxes there...","Blocked airflow causes hot spots even when cooling works.",{t:10}),
    F("Replace the temperature sensor",'k',"The new sensor says the same thing. The old one was right.","Don't blame the sensor before checking the room.",{t:20})])],
 {roles:["Operations","Engineering","Facilities","IT Security","Logistics"]}),
SC('payroll',"Payroll system down before the run",'P1',40,
 ["The payroll system is down and the run is due in an hour!","Payroll won't open. We have a hard deadline to pay everyone today."],
 "I'm on it. What error do you see, and when did it last work?",
 [C(["It says 'Service unavailable'. It worked yesterday.","~Monitoring: PayrollSvc stopped at 2:14 AM after an overnight patch."],[
    F("Restart the payroll service and verify a test login",'g',"It's up! Running payroll now. You saved us.","Check the service status first. Many outages are a service that didn't restart after a patch.",{t:8}),
    F("Reinstall the payroll application",'b',"A reinstall? We don't have time for that!","Don't reinstall a production system when a restart may do.",{t:15}),
    F("say:Wait for the vendor to call back",'k',"The vendor says four hours. That won't work.","Check your own side before waiting on a vendor.")]),
  C(["It says 'Certificate expired'. It worked yesterday.","~Payroll portal: TLS certificate expired at midnight."],[
    F("Renew and install the certificate, then restart the web service",'g',"Portal is back! Thank you!!","Expired certificates cause sudden outages. Track expiry dates.",{t:15}),
    F("say:Tell everyone to click through the browser warning",'b',"We're clicking through the warning...","Training users to ignore warnings is dangerous.",{sec:1,t:5})])],
 {roles:["Accounting","Finance","Human Resources"]}),
SC('misdeliver',"Email sent to the wrong person",'P1',45,
 ["I just emailed a spreadsheet with customer data to the wrong person. Help!","I think I sent confidential salary details to the entire sales list!"],
 "Don't reply to the email. Who received it, and is it inside the company or outside?",
 [C("It went to one external address that looks like a customer's old domain.",[
    F("Recall the message, notify Security and the privacy team, and document the incident",'g',"Thank you for helping me handle this properly.","Data misdelivery needs fast containment and a paper trail for compliance.",{t:12}),
    F("say:Email them politely and ask them to delete it",'k',"I asked nicely. They haven't replied.","Asking isn't enough. Escalate to Security.",{sec:1,t:8}),
    F("say:Don't worry about it",'b',"Okay... thanks.","A data leak must be reported. Silence is the worst option.",{sec:1,t:5})]),
  C("It went to an internal distribution list with about 400 people.",[
    F("Purge the message from all mailboxes and ask Security to confirm",'g',"Gone from everyone's inbox. Thank you!","Purging internal copies limits exposure when you act fast.",{t:12}),
    F("say:Email the whole list and ask them to delete it",'k',"Now everyone has seen two emails about it.","A request to delete can amplify the leak.",{sec:1,t:8})])]),
SC('out-email',"Email won't connect",'P2',70,
 ["Outlook says 'Disconnected' and won't send or receive.","I can't get my email. It's stuck on 'Trying to connect'."],
 "Is anyone near you affected too, and does the service status page show anything?",
 [C(["Three of us have the same problem. Webmail is down too.","~Status board: Mail gateway degraded since 9:12 AM. Engineering is working on it."],[
    F("say:Confirm it's a known outage, give them the ETA and post an update in the team channel",'g',"Okay, that makes sense. Thanks for the update.","When several people report the same issue, check for an outage before troubleshooting one machine.",{t:6}),
    F("Rebuild their Outlook profile",'b',"That took forever and it's still down.","Don't fix a client when the server is the problem.",{t:15}),
    F("Reinstall Office",'k',"Reinstalled. Same problem.","Check the status board before touching the client.",{t:20})]),
  C(["Everyone on my team is disconnected, but the phones work fine.","~Status board: DNS resolver failing for internal mail servers. Network team notified."],[
    F("say:Confirm it's a DNS issue, give them the workaround and the ETA",'g',"The workaround got me back in. Thanks.","A widespread failure points at shared infrastructure. Use the workaround while the fix is rolled out.",{t:8}),
    F("Reset their network adapter",'k',"Reset. Still disconnected.","The fault is upstream, not on their laptop.",{t:15})])],
 {cluster:true}),
SC('out-wifi',"Wi-Fi is down on the floor",'P2',70,
 ["The Wi-Fi is totally down on our floor.","No internet at all. Nobody on the third floor can connect."],
 "Is it the whole floor, and can you see the network name at all?",
 [C(["The whole floor. The network name shows but nothing connects.","~Network: Switch 3F-A offline since 9:40 AM (power)."],[
    F("Power-cycle the switch, verify the uplink and tell the floor it's being fixed",'g',"Wi-Fi's back! Thank you!","A whole floor going down together points at a switch or uplink.",{t:12}),
    F("Reset each laptop's network settings",'b',"We've reset all our laptops. Nothing changed.","Don't treat a shared outage as many individual problems.",{t:15}),
    F("say:Try again in an hour",'k',"We'll check again later.","Outages don't fix themselves. Investigate.")]),
  C(["Everyone sees the network but gets 'No internet'.","~Network: DHCP scope on VLAN 30 is exhausted (0 leases available)."],[
    F("Expand the DHCP scope and shorten lease times",'g',"We're all connected again. Thank you!","'Connected, no internet' for many users often means DHCP exhaustion.",{t:12}),
    F("Restart the access points",'k',"Restarted. A few devices got in, but not all.","A restart hides the problem for a moment but doesn't free up addresses.",{t:12})])],
 {cluster:true}),
SC('out-sso',"Cannot sign in to company portal",'P2',70,
 ["I can't sign in to the HR portal. It keeps saying something went wrong.","The company portal rejects my login even though my password is right."],
 "Does your regular email login work, and is anyone else having this issue?",
 [C(["Email works, but the portal doesn't. Others are reporting the same thing.","~Identity: SSO signing certificate for the portal expired at 8:00 AM."],[
    F("Renew the SSO certificate and tell affected users it's fixed",'g',"Portal works now. Thanks!","When many users can't sign in but passwords work, think shared authentication.",{t:12}),
    F("Reset their password",'b',"I reset my password. It still doesn't work.","A password reset won't fix a broken authentication service.",{t:8}),
    F("Create a local account for them on the portal",'k',"That works, but now I have two logins.","Bypassing SSO creates security and audit problems.",{sec:1,t:15})]),
  C(["Everyone in my department can't sign in since the maintenance window.","~Change log: portal upgrade last night changed the redirect URL."],[
    F("Correct the redirect URL in the SSO app settings",'g',"We're in. Thank you!","A recent change is the first suspect when everything breaks at once.",{t:12}),
    F("Roll back the portal upgrade without checking",'k',"Rolled back. It works but we lost the new features.","Rollback works, but fixing the setting is less disruptive.",{t:20})])],
 {cluster:true}),
SC('out-print',"Print server is down",'P2',70,
 ["Nobody can print. All the printers say 'Unable to connect'.","Printing is dead across the whole office."],
 "Is it every printer, and did it stop at a specific time?",
 [C(["Every printer, since about 9:30.","~Server: PRINT01 spooler stopped. Disk C: 100% full."],[
    F("Clear the spool folder, free disk space and restart the print service",'g',"Printing again! Thanks!","A full disk can stop a service silently. Check basic resources.",{t:12}),
    F("Reinstall every printer on every laptop",'b',"We tried that for an hour already!","Don't touch clients when the server is the problem.",{t:20}),
    F("Order a new print server",'b',"A new print server? It was a full disk!","Check the cheap causes first.")]),
  C(["Every printer, after last night's patch.","~Server: PRINT01 driver store corrupted after patch KB5039."],[
    F("Roll back the patch and restore the driver store",'g',"Printing again. Thank you.","A recent patch is the main suspect when everything breaks together.",{t:15}),
    F("Reboot the print server and hope",'k',"It rebooted. Still broken.","A reboot doesn't fix corruption.",{t:10})])],
 {cluster:true}),
SC('noboot',"Laptop will not power on",'P2',90,
 ["My laptop won't turn on at all and I have a presentation this afternoon.","The laptop's dead. Black screen, no lights."],
 "Does the charger light come on, and have you tried holding the power button for 30 seconds?",
 [C("The charger light is on, but the laptop does nothing. I haven't held the button.",[
    F("say:Hold the power button for 30 seconds to drain residual power, then try again",'g',"It booted! Thank you!","A power drain resets stuck hardware states with no tools.",{t:5}),
    F("Replace the motherboard",'b',"A motherboard?! I just need it on.","Never jump to the most expensive part.")]),
  C("The charger light is off and the cable is warm. I tried another outlet.",[
    F("Swap the charger and cable for loaners and test the port",'g',"The loaner works. Thank you!","If the charger is dead, the laptop may be fine.",{t:12}),
    F("Reimage the laptop",'b',"It won't even turn on! How would that help?","Don't reimage a machine that doesn't power on.")])]),
SC('compromise',"Unrecognized sign-in alerts",'P2',80,
 ["I got an alert about a sign-in from another country. That wasn't me!","The system says someone logged in to my account from Brazil."],
 "Thanks for reporting. Have you been traveling, and did you approve any MFA prompts today?",
 [C("I haven't traveled. And I did approve a push prompt I didn't expect.",[
    F("Revoke their sessions, reset the password, remove unknown MFA devices and report to Security",'g',"Thank you. I should have been more careful.","MFA fatigue attacks spam prompts until someone approves. Reset, remove devices and report.",{t:15}),
    F("Reset their password only",'k',"Done. Is that enough?","A password alone doesn't remove an attacker's MFA device or open sessions.",{sec:1,t:8}),
    F("say:It's probably just a VPN glitch",'b',"Okay... if you say so.","Impossible travel is a classic breach indicator.",{sec:1,t:5})]),
  C("I'm traveling this week, so that might be me. I'm in Lisbon.",[
    F("Check the sign-in logs, confirm the location and device, and note it as expected",'g',"Good to know it's logged. Thanks for checking.","Verify before assuming it's an attack or a false alarm.",{t:10}),
    F("Lock their account to be safe",'k',"I'm locked out in Lisbon now.","An overreaction can strand a legitimate user.",{t:10})])]),
SC('restore',"Deleted an important folder",'P2',90,
 ["I deleted a whole project folder by accident. I need it back today!","My entire proposal folder is gone. Please tell me you can restore it."],
 "Don't create or save anything in that location. Where was the folder, and when did you last see it?",
 [C("It was on my desktop, synced to OneDrive. I deleted it about ten minutes ago.",[
    F("Restore it from the OneDrive recycle bin",'g',"It's back! You're a lifesaver.","Cloud sync usually keeps deleted files in a recycle bin for weeks.",{t:8}),
    F("Restore the laptop from a full backup",'b',"A full restore would wipe my other work!","Use the narrowest restore possible.",{t:20})]),
  C("It was on the shared drive. I deleted it yesterday.",[
    F("Restore the folder from yesterday's shadow copy or backup",'g',"Everything's back. Thank you!","Shared drives usually have snapshots. Use the most recent one.",{t:15}),
    F("say:We can't recover shared files",'b',"What?! That can't be right.","Never say something is unrecoverable before you check backups.",{t:5})])]),
SC('crm',"CRM will not load",'P2',90,
 ["The CRM won't load and I have a customer on the phone.","I'm trying to open the customer system. It just spins."],
 "Does it fail in every browser, and did anything change for your account recently?",
 [C("It works in another browser but not my usual one.",[
    F("Clear the browser cache and cookies for the CRM and sign in again",'g',"It loads! Thanks.","If another browser works, the problem is local browser state.",{t:6}),
    F("Reinstall the CRM",'b',"It's a website...","Match the fix to the system.")]),
  C(["It says 'No access'. My manager changed my role last week.","~CRM: user role 'Sales Rep' was removed during a permission cleanup."],[
    F("Restore the 'Sales Rep' role after checking with their manager",'g',"I'm in. Thanks for confirming with my manager.","Permission cleanups can remove needed access. Confirm before restoring.",{t:12}),
    F("Give them admin rights so it can't happen again",'b',"Admin rights? Cool, but is that okay?","Never give blanket admin to fix a role mismatch.",{sec:1,t:5})])]),
SC('onedrive',"OneDrive stuck syncing",'P3',130,
 ["OneDrive has been stuck on 'Syncing' for days.","My files aren't syncing. The cloud icon just spins."],
 "Does the icon show any errors, and are there files with very long names or special characters?",
 [C("There's a red X on a few files. They have very long names.",[
    F("Shorten the file paths and restart OneDrive sync",'g',"Synced! Thanks.","Long paths and special characters often block syncing.",{t:8}),
    F("Reinstall OneDrive",'k',"Reinstalled. Same files fail.","The files, not the client, were the problem.",{t:15})]),
  C("It says 'Your OneDrive is full'. I have lots of old videos.",[
    F("Move videos to a shared team drive and clear the recycle bin",'g',"Space freed. Syncing again.","A full quota stops sync. Clear space or move large media.",{t:10}),
    F("Raise their storage quota to 5 TB",'k',"That's a lot of space. Works, though.","Raising quotas without a reason doesn't scale.",{t:8})])]),
SC('secondmon',"Second monitor looks wrong",'P3',130,
 ["My second monitor is blurry and the text is tiny.","The extra screen has the wrong size and everything looks stretched."],
 "What resolution is the monitor set to in display settings, and what cable connects it?",
 [C("It's set to 1024x768 and looks fuzzy. It's a 4K monitor.",[
    F("Set the resolution to the monitor's native 4K and adjust scaling",'g',"Crisp! Thank you.","Non-native resolution blurs the image. Match it.",{t:6}),
    F("Replace the monitor",'b',"A new one? Mine is fine!","Check settings before hardware.")]),
  C("It's stuck at 30 Hz and looks laggy. I'm using an old HDMI cable.",[
    F("Swap in a DisplayPort or HDMI 2.0 cable for 60 Hz",'g',"Smooth now. Thanks.","Old cables limit refresh rate. Upgrade the cable.",{t:10}),
    F("Update the graphics driver",'k',"Updated. Still 30 Hz.","Drivers can't overcome a cable's limit.",{t:12})])]),
SC('mouse',"Mouse cursor is jumpy",'P3',130,
 ["My mouse cursor jumps around and sometimes freezes.","The cursor stutters. It's driving me crazy."],
 "Is it wired or wireless, and what surface is it on?",
 [C("It's wireless, and the battery light is red.",[
    F("say:Replace the batteries and move the receiver to a front USB port",'g',"Smooth again! Thanks.","Low batteries cause jumps. Check the simple causes.",{t:5}),
    F("Reinstall the mouse driver",'k',"Reinstalled. No change.","Check the batteries first.",{t:12})]),
  C("It's wired, but I use it on a glass desk.",[
    F("say:Use a mouse pad. Optical sensors struggle on glass",'g',"It works perfectly on a mouse pad.","Optical sensors need a textured surface.",{t:5}),
    F("Replace the mouse",'k',"A new mouse didn't fix it. The glass did.","The surface was the issue.",{t:15})])]),
SC('restartnag',"Update keeps asking to restart",'P3',140,
 ["My laptop keeps nagging me to restart for updates. I never have time.","There's a pop-up asking me to restart every hour."],
 "When did you last restart, and does it show an update stuck at a percentage?",
 [C("Not in about a month. I just sleep the laptop.",[
    F("say:Restart now. Updates install only on a restart. I'll schedule one outside work hours next time",'g',"Restarted and updated. No more nags.","Updates install on restart. Long uptime means missed patches.",{t:10}),
    F("Disable Windows Update for them",'b',"No more nags, but is that safe?","Disabling updates is a security risk.",{sec:1,t:5})]),
  C("I restarted, but it says 'Working on updates' and goes back to the same prompt.",[

function buildTicket(sc,cause,person,at,id,opt){
  opt=opt||{};
  const mood=MOOD[person.mood],nodes={};
  let opener=pick(mood.pre)+pick(sc.open)+pick(mood.post);
  if(opt.followup)opener="Remember me? You never properly fixed this last time. "+opener;
  const prem=sc.prem||pick(GEN_FIX.filter(f=>f.q==='b'));
  const extras=shuffle(GEN_FIX.filter(f=>f.d!==prem.d));
  let fixes=cause.f.slice();
  while(fixes.length<3)fixes.push(extras.shift());
  if(fixes.length<4&&Math.random()<0.6)fixes.push(extras.shift());
  fixes=shuffle(fixes);
  const QMAP={g:'great',d:'good',k:'ok',b:'bad'},QTIME={g:10,d:10,k:15,b:6};
  const ch=(txt,to,t,sat)=>{const say=txt.indexOf('say:')===0;const o={to,t};o[say?'say':'do']=say?txt.slice(4):txt;if(sat)o.sat=sat;return o;};
  const end=(nid,f)=>{
    const lines=[].concat(f.r);
    if(f.q!=='b'&&Math.random()<0.6)lines[0]=lines[0]+pick(mood.fin);
    nodes[nid]={m:lines,end:QMAP[f.q],note:f.n,sec:!!f.sec};
  };
  nodes.n0={m:[opener],c:shuffle([
    {say:sc.ask,to:'n1',t:10},
    {say:"Have you tried restarting it?",to:'n1r',sat:-1,t:12},
    ch(prem.d,'ePrem',prem.t||QTIME[prem.q])])};
  end('ePrem',prem);
  const cs=[];
  fixes.forEach((f,i)=>{
    if(f.q==='g'&&cause.w){
      nodes['w'+i]={m:[cause.w.m],c:shuffle([ch(cause.w.g[0],'wg'+i,8),ch(cause.w.l[0],'wl'+i,5)])};
      nodes['wg'+i]={m:[cause.w.g[1]],end:'great',note:cause.w.g[2],sec:false};
      nodes['wl'+i]={m:[cause.w.l[1]],end:'good',note:cause.w.l[2],sec:false};
      cs.push(ch(f.d,'w'+i,f.t||QTIME.g));
    }else{
      end('e'+i,f);
      cs.push(ch(f.d,'e'+i,f.t||QTIME[f.q]));
    }
  });
  nodes.n1={m:cause.clue.slice(),c:cs};
  nodes.n1r={m:["I already tried that first. Still happening."].concat(cause.clue),c:cs};
  const sla=Math.max(20,Math.round(sc.sla*(mood.sla||1)/5)*5);
  return {id:'INC-'+id,pid:person.id,scId:sc.id,who:person.name,role:person.role,pri:sc.pri,sla,at,hue:person.hue,subject:sc.title,start:'n0',nodes,sat0:opt.followup?-1:0};
}

function buildShift(){
  const used=new Set();
  let follow=null;
  if(MEM.grudges.length){
    const g=MEM.grudges.shift();saveMem();
    const sc=SCENARIOS.find(s=>s.id===g.sc);
    if(sc&&ROSTER[g.pid]){follow={sc,pid:g.pid};used.add(g.pid);}
  }
  const solo=SCENARIOS.filter(s=>!s.cluster&&!(follow&&s.id===follow.sc.id));
  const pool=p=>shuffle(solo.filter(s=>s.pri===p));
  const hasCluster=Math.random()<0.7;
  const need=hasCluster?{P1:2,P2:1,P3:4,P4:3}:{P1:2,P2:3,P3:5,P4:3};
  if(follow&&need[follow.sc.pri]>0)need[follow.sc.pri]--;
  const items=[];
  ['P1','P2','P3','P4'].forEach(p=>pool(p).slice(0,need[p]).forEach(sc=>items.push({sc})));
  if(follow)items.push(follow);
  shuffle(items);
  /* arrival waves: three tickets open the shift together, the rest land in bursts at five shared times */
  const waves=[];
  while(waves.length<5){const w=20+5*Math.floor(Math.random()*69);if(waves.indexOf(w)<0)waves.push(w);}
  waves.sort((a,b)=>a-b);
  items.forEach((it,i)=>{it.at=i<3?0:pick(waves);});
  if(hasCluster){
    const sc=pick(SCENARIOS.filter(s=>s.cluster)),cause=pick(sc.causes),at=pick(waves),grp='g-'+sc.id;
    for(let k=0;k<3;k++)items.push({sc,cause,at,grp});
  }
  items.sort((a,b)=>a.at-b.at);
  const base=5000+Math.floor(Math.random()*400);
  return items.map((it,i)=>{
    let person;
    if(it.pid!=null)person=ROSTER[it.pid];
    else{
      let p=ROSTER.filter(x=>!used.has(x.id)&&(!it.sc.roles||it.sc.roles.indexOf(x.role)>=0));
      if(!p.length)p=ROSTER.filter(x=>!used.has(x.id));
      person=pick(p);used.add(person.id);
    }
    const t=buildTicket(it.sc,it.cause||pick(it.sc.causes),person,START+it.at,base+i,{followup:it.pid!=null});
    if(it.grp)t.grp=it.grp;
    return t;
  });
}

/* ---------- What Jose remembers (kept for as long as this browser session lasts) ---------- */
const MEM_KEY='tier-one-jose-memory';
const freshMem=()=>({shifts:0,fired:0,strikesTotal:0,snarks:0,ignored:0,best:null,last:null,chats:[],met:[],grudges:[]});
let MEM=(()=>{try{const s=sessionStorage.getItem(MEM_KEY);if(s)return Object.assign(freshMem(),JSON.parse(s));}catch(e){}return freshMem();})();
const saveMem=()=>{try{sessionStorage.setItem(MEM_KEY,JSON.stringify(MEM));}catch(e){}};

function makeDistList(){
  let list=shuffle(DISTRACTIONS);
  if(MEM.chats.length){
    const k=pick(MEM.chats),d=DISTRACTIONS.find(x=>x.k===k);
    if(d){
      list=list.filter(x=>x.k!==k);
      list.unshift({k:'cb:'+k,topic:d.topic,
        open:["Hey, remember "+d.topic+"? I've been thinking about it all week.","Got a minute?"],
        engage:"Of course I remember! Tell me more.",
        reply:["Great, so as I was saying...","~Jose talks for what feels like twenty minutes."],
        safe:["I'm working on tickets right now, Jose. Not now.","Working. We can talk about "+d.topic+" after my shift."]});
    }
  }
  return list;
}
function introLines(){
  const L=MEM.last,n=MEM.shifts+1;
  if(!MEM.shifts)return["Morning. The queue is yours today.","Answer every ticket fast. If I message you about anything else, tell me you're working. Do not chat with me."];
  const out=[];
  if(L.fired)out.push("Shift "+n+". I haven't forgotten how last shift ended.","This time it's two strikes and you're out. Tickets only. I'm watching.");
  else if(L.strikes>0)out.push("Shift "+n+". Last shift I put "+L.strikes+" strike"+(L.strikes>1?"s":"")+" on your record. Don't give me a reason for more.","I'm checking the queue more often now.");
  else out.push("Shift "+n+". Last shift was clean, so I'll give you some slack.","Your first slip this shift is on the house. After that, tickets only.");
  if(MEM.snarks>0&&Math.random()<0.5)out.push("And I haven't forgotten the attitude, either.");
  else if(MEM.shifts>=3)out.push("Total strikes on your file: "+MEM.strikesTotal+". I keep a list.");
  if(MEM.grudges.length)out.push("Also, someone called asking for the person who 'never fixed their problem.' Expect a callback.");
  return out;
}
function remember(score){
  MEM.shifts++;MEM.strikesTotal+=S.strikes;if(S.fired)MEM.fired++;
  const newBest=MEM.best===null||score>MEM.best;
  if(newBest)MEM.best=score;
  MEM.last={strikes:S.strikes,fired:S.fired,score};
  S.tickets.forEach(t=>{
    if(!t.arrived)return;
    if(MEM.met.indexOf(t.pid)<0)MEM.met.push(t.pid);
    if((t.status!=='done'||t.stars<=2)&&!MEM.grudges.some(g=>g.pid===t.pid))MEM.grudges.push({pid:t.pid,sc:t.scId});
  });
  MEM.grudges=MEM.grudges.slice(-4);
  saveMem();
  const done=S.tickets.filter(t=>t.status==='done').length;
  let verdict;
  if(S.fired)verdict="Jose: \"I told you what would happen. I'll remember this next shift.\"";
  else if(S.strikes===0&&done>=Math.round(S.tickets.length*0.6))verdict="Jose: \"Clean shift. I noticed. I won't forget it.\"";
  else if(S.strikes===0)verdict="Jose: \"No strikes, but I've seen better queues. Do more next time.\"";
  else verdict="Jose: \""+S.strikes+" strike"+(S.strikes>1?"s":"")+" on my sheet. I keep a list.\"";
  if(MEM.shifts>1&&newBest&&!S.fired)verdict+=" New personal best.";
  return{n:MEM.shifts,met:MEM.met.length,verdict};
}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- State ---------- */
let S=null,GEN=0,armTimer=null,toastTimer=null;
function newGame(){
  GEN++;
  const L=MEM.last;
  MAX_STRIKES=(L&&L.fired)?2:3;
  NAG_MULT=L?(L.fired?0.6:L.strikes>0?0.8:MEM.fired?0.9:1.2):1;
  FREE_PASS=!!(L&&!L.fired&&L.strikes===0);
  S={clock:START,gen:GEN,active:null,over:false,fired:false,strikes:0,bossQ:[],
    nextDist:START+35+Math.floor(Math.random()*20),distLeft:makeDistList(),
    boss:{id:'JOSE',isBoss:true,who:'Jose Martinez',role:'Your manager',hue:5,log:[],unread:0,busy:false,prompt:null},
    tickets:buildShift().map(d=>({...d,arrived:false,status:'new',node:d.start,log:[],unread:0,busy:false,sat:d.sat0||0,breached:false,stars:null,sec:false,outcome:null,closedAt:null,note:'',touched:false,nagged:false}))};
}
const act=()=>S&&(S.active==='JOSE'?S.boss:S.tickets.find(t=>t.id===S.active));

function strike(why){
  if(FREE_PASS){FREE_PASS=false;S.freed=true;toast('Jose lets it slide: '+why+'. The next one counts.');return false;}
  S.freed=false;S.strikes++;renderHud();
  toast('Strike '+S.strikes+' of '+MAX_STRIKES+': '+why);
  return true;
}
const strikeLine=()=>S.freed?"~Jose lets this one slide because of your last shift. The next one counts.":"~Strike "+S.strikes+" of "+MAX_STRIKES;
function bossSay(lines,done){
  const B=S.boss,gen=S.gen;B.busy=true;render();
  lines.forEach((s,i)=>setTimeout(()=>{
    if(S.gen!==gen)return;
    const sys=s[0]==='~';
    push(B,{k:sys?'sys':'them',text:sys?s.slice(1):s});
    if(i===0&&!sys&&S.active!==B.id)toast('Jose Martinez sent you a message');
  },(i+1)*900));
  setTimeout(()=>{
    if(S.gen!==gen)return;
    B.busy=false;if(done)done();render();bossNext();
  },lines.length*900+500);
}
function bossNext(){
  const B=S.boss;
  if(S.over||B.busy||B.prompt||!S.bossQ.length)return;
  const q=S.bossQ.shift();
  if(q.type==='info')return bossSay(q.lines);
  if(q.type==='nag'){
    const t=q.t;
    if(t.touched||t.status!=='open')return bossNext();
    const mins=S.clock-t.at;
    const lines=t.pri==='P1'
      ?[t.who+"'s ticket is flagged P1 and it's been "+mins+" minutes. Why haven't you answered??","Move. Now."]
      :["Why is "+t.who+"'s ticket still sitting there? It's been "+mins+" minutes.","People notice when tickets go unanswered."];
    return bossSay(lines,()=>{B.prompt={k:'nag',since:S.clock,warned:false,choices:shuffle([
      {say:"On it. I'm working through the queue now."},
      {say:"I'm working on tickets right now. I'll get to it."},
      {say:"If we had a second person, the queue wouldn't be backed up.",engage:true,reply:["Excuse me?? Don't talk back to me."]}
    ])};});
  }
  if(q.type==='dist'){
    const d=q.d;
    return bossSay(d.open,()=>{B.prompt={k:d.k,since:S.clock,warned:false,choices:shuffle([
      {say:d.engage,engage:true,reply:d.reply},{say:d.safe[0]},{say:d.safe[1]}])};});
  }
}
function bossEvents(){
  if(S.over)return;
  if(S.clock>=S.nextDist&&S.distLeft.length){
    S.bossQ.push({type:'dist',d:S.distLeft.shift()});
    S.nextDist=S.clock+50+Math.floor(Math.random()*40);
  }
  if(!S.bossQ.some(q=>q.type==='nag')&&S.clock-(S.lastNag===undefined?-999:S.lastNag)>=25){
    const late=S.tickets.filter(t=>t.arrived&&t.status==='open'&&!t.touched&&!t.nagged&&S.clock-t.at>=Math.round(NAG_AFTER[t.pri]*NAG_MULT))
      .sort((x,y)=>(x.at+x.sla)-(y.at+y.sla));
    if(late.length){late[0].nagged=true;S.lastNag=S.clock;S.bossQ.push({type:'nag',t:late[0]});}
  }
  bossNext();
}
function bossTimers(){
  const B=S.boss,p=B.prompt;
  if(!p||B.busy||S.over)return;
  const w=S.clock-p.since;
  if(!p.warned&&w>=45){p.warned=true;p.since=S.clock;bossSay(["Hello? Did you see my message? I'm waiting."]);}
  else if(p.warned&&w>=30){
    B.prompt=null;MEM.ignored++;saveMem();strike('you ignored Jose');
    bossSay(["Ignoring your manager doesn't look good.",strikeLine()],()=>{if(S.strikes>=MAX_STRIKES)endShift('fired');});
  }
}
function bossChoose(i){
  const B=S.boss,p=B.prompt;
  if(S.over||B.busy||!p)return;
  const c=p.choices[i];if(!c)return;
  push(B,{k:'me',text:c.say});B.prompt=null;
  if(c.engage){
    if(p.k&&p.k!=='nag')MEM.chats.push(p.k.replace(/^cb:/,''));else MEM.snarks++;
    saveMem();
    strike('you chatted with Jose');
    bossSay([...c.reply,strikeLine()+" That chat cost you 25 minutes."],()=>{if(S.strikes>=MAX_STRIKES)endShift('fired');});
    tick(25);
  }else{
    bossSay([pick(SAFE_REPLY)]);
    tick(2);
  }
}

function toast(txt){
  const el=$('#toast');el.textContent=txt;el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},3600);
}
function push(t,msg){
  t.log.push({time:S.clock,...msg});
  if(msg.k==='them'&&S.active!==t.id)t.unread++;
  render();
}
function arrive(t){
  t.arrived=true;t.status='open';
  t.nodes[t.start].m.forEach(s=>{
    const sys=s[0]==='~';
    t.log.push({time:t.at,k:sys?'sys':'them',text:sys?s.slice(1):s});
    if(!sys)t.unread++;
  });
}
function arrivals(){
  const fresh=[];
  S.tickets.forEach(t=>{if(!t.arrived&&t.at<=S.clock){arrive(t);fresh.push(t);}});
  if(fresh.length&&S.clock>START){
    const order=['P1','P2','P3','P4'],top=fresh.map(t=>t.pri).sort((x,y)=>order.indexOf(x)-order.indexOf(y))[0];
    const grp=fresh.filter(t=>t.grp).length>1;
    toast(fresh.length===1?'New ticket from '+fresh[0].who+' ('+top+')'
      :fresh.length+' new tickets, highest priority '+top+(grp?'. Several people report the same problem.':'.'));
  }
  bossEvents();
}
function breaches(){
  S.tickets.forEach(t=>{
    if(t.arrived&&t.status==='open'&&!t.breached&&S.clock>t.at+t.sla){
      t.breached=true;t.sat-=1;
      push(t,{k:'them',text:pick(NUDGE[t.pri])});
      toast(t.who+"'s ticket is past its deadline");
      S.bossQ.push({type:'info',lines:[t.who+"'s ticket just missed its deadline. That goes in your review."]});
    }
  });
}
function tick(mins){
  S.clock+=mins;
  arrivals();breaches();bossTimers();bossNext();
  if(S.clock>=END)endShift();
}

/* ---------- Gameplay ---------- */
function choose(i){
  const t=act();
  if(t&&t.isBoss)return bossChoose(i);
  if(!t||S.over||t.busy||t.status!=='open')return;
  const c=t.nodes[t.node].c[i];if(!c)return;
  push(t,c.say?{k:'me',text:c.say}:{k:'do',text:c.do});
  t.sat+=c.sat||0;t.busy=true;t.touched=true;
  tick(c.t||12);
  if(S.over)return;
  go(t,c.to);
}
function go(t,nid){
  const node=t.nodes[nid],gen=S.gen;
  t.node=nid;t.busy=true;render();
  node.m.forEach((s,i)=>setTimeout(()=>{
    if(S.gen!==gen)return;
    const sys=s[0]==='~';
    push(t,{k:sys?'sys':'them',text:sys?s.slice(1):s});
  },(i+1)*950));
  setTimeout(()=>{
    if(S.gen!==gen)return;
    if(node.end)closeTicket(t,node);else{t.busy=false;render();}
  },node.m.length*950+600);
}
function closeTicket(t,node){
  let st=Math.round({great:5,good:4,ok:3,bad:1}[node.end]+t.sat);
  st=Math.max(1,Math.min(5,st));if(node.end==='bad')st=Math.min(st,2);
  Object.assign(t,{busy:false,status:'done',stars:st,sec:!!node.sec,outcome:node.end,closedAt:S.clock,note:node.note||''});
  push(t,{k:'close',stars:st,note:t.note,sec:t.sec,late:t.breached});
  idleCheck();
}
function idleCheck(){
  if(S.over)return;
  const open=S.tickets.some(t=>t.arrived&&t.status==='open');
  if(open)return;
  const next=S.tickets.filter(t=>!t.arrived).sort((a,b)=>a.at-b.at)[0];
  if(next){
    if(next.at>S.clock){S.clock=next.at;toast('Quiet spell. The clock moves to '+fmt(next.at)+'.');}
    arrivals();render();
  }else{
    const gen=S.gen;setTimeout(()=>{if(S.gen===gen)endShift();},1800);
  }
}
function endShift(reason){
  if(S.over)return;
  S.over=true;S.fired=reason==='fired';S.gen=++GEN;
  S.tickets.forEach(t=>{if(t.status==='open')t.status='abandoned';});
  render();showReport();
}

/* ---------- Rendering ---------- */
function deadline(t){return t.at+t.sla-S.clock;}
function renderHud(){
  $('#clock').textContent=fmt(Math.min(S.clock,END));
  $('#bar').style.width=Math.min(100,(S.clock-START)/(END-START)*100)+'%';
  const done=S.tickets.filter(t=>t.status==='done');
  $('#csat').textContent=done.length?(done.reduce((a,t)=>a+t.stars,0)/done.length).toFixed(1):'–';
  $('#solved').textContent=done.length+'/'+S.tickets.length;
  const sk=$('#strikes');sk.textContent=S.strikes+'/'+MAX_STRIKES;sk.classList.toggle('hot',S.strikes>0);
}
function renderList(){
  const vis=S.tickets.filter(t=>t.arrived);
  const open=vis.filter(t=>t.status==='open'||t.status==='abandoned').sort((a,b)=>(a.at+a.sla)-(b.at+b.sla));
  const done=vis.filter(t=>t.status==='done').sort((a,b)=>b.closedAt-a.closedAt);
  $('#openCount').textContent=open.filter(t=>t.status==='open').length+' open';
  const B=S.boss,lastB=B.log[B.log.length-1];
  const bossRow=(B.log.length||B.busy)?'<button class="row'+(S.active===B.id?' sel':'')+'" data-id="JOSE" type="button">'
    +'<span class="av" style="background:hsl('+B.hue+' 42% 40%)" aria-hidden="true">JM</span>'
    +'<span class="row-main"><span class="row-top"><span class="nm">Jose Martinez</span><span class="pri boss">BOSS</span></span>'
    +'<span class="prev" style="display:block">'+esc(lastB?lastB.text:'...')+'</span></span>'
    +'<span class="row-side">'+(B.prompt&&!B.busy?'<span class="sla urgent">Reply needed</span>':'')+(B.unread?'<span class="badge">'+B.unread+'</span>':'')+'</span></button>':'';
  if(!vis.length){$('#rows').innerHTML=bossRow+'<div class="empty-list">No tickets yet. They arrive here.</div>';return;}
  $('#rows').innerHTML=bossRow+[...open,...done].map(t=>{
    const last=[...t.log].reverse().find(m=>m.k!=='close');
    const l=deadline(t);
    const side=t.status==='done'?'<span class="stars" aria-label="'+t.stars+' of 5 stars">'+starTxt(t.stars)+'</span>'
      :t.status==='abandoned'?'<span class="sla urgent">Unresolved</span>'
      :'<span class="sla'+(l<=30?' urgent':'')+'">'+leftTxt(l)+'</span>'+(t.unread?'<span class="badge">'+t.unread+'</span>':'');
    return '<button class="row'+(S.active===t.id?' sel':'')+(t.status==='done'?' done':'')+'" data-id="'+t.id+'" type="button">'
      +'<span class="av" style="background:hsl('+t.hue+' 42% 40%)" aria-hidden="true">'+esc(initials(t.who))+'</span>'
      +'<span class="row-main"><span class="row-top"><span class="nm">'+esc(t.who)+'</span><span class="pri '+t.pri.toLowerCase()+'">'+t.pri+'</span></span>'
      +'<span class="prev" style="display:block">'+esc(last?last.text:t.subject)+'</span></span>'
      +'<span class="row-side">'+side+'</span></button>';
  }).join('');
}
function msgHtml(t,m){
  const meta=(who)=>'<span class="meta">'+esc(who)+' · '+fmt(m.time)+'</span>';
  if(m.k==='them')return '<div class="msg them"><span class="av" style="background:hsl('+t.hue+' 42% 40%)" aria-hidden="true">'+esc(initials(t.who))+'</span><div class="bubble">'+meta(t.who)+esc(m.text)+'</div></div>';
  if(m.k==='me')return '<div class="msg me"><div class="bubble">'+meta('You')+esc(m.text)+'</div></div>';
  if(m.k==='do')return '<div class="do"><b>RUN</b>'+esc(m.text)+'</div>';
  if(m.k==='sys')return '<div class="sys">'+esc(m.text)+'</div>';
  if(m.k==='close')return '<div class="close"><h4>Ticket closed · '+t.id+'</h4><div class="big" aria-label="'+m.stars+' of 5 stars">'+starTxt(m.stars)+'</div>'
    +(m.note?'<p>'+esc(m.note)+'</p>':'')+(m.late?'<span class="flag" style="margin-right:6px">Missed deadline</span>':'')+(m.sec?'<span class="flag">Security slip</span>':'')+'</div>';
  return '';
}
function renderChat(){
  const t=act(),el=$('#chat');
  if(!t){
    el.innerHTML='<div class="chat-empty"><h3>Pick a conversation</h3><p>Open a ticket from the list. Every action costs shift time, and everyone else keeps waiting while you work.</p></div>';
    return;
  }
  if(t.isBoss){renderBoss(t,el);return;}
  const l=deadline(t);
  const sla=t.status==='done'?'Closed '+fmt(t.closedAt):t.status==='abandoned'?'Unresolved':leftTxt(l);
  let foot='';
  if(t.status==='open'&&!t.busy&&!S.over){
    const cs=t.nodes[t.node].c;
    foot='<div class="choices"><div class="choices-label">Your move</div>'+cs.map((c,i)=>
      '<button class="opt'+(c.do?' runs':'')+'" data-i="'+i+'" type="button"><span class="tag">'+(i+1)+' · '+(c.do?'Run':'Say')+'</span><span class="txt">'+esc(c.say||c.do)+'</span><span class="cost">~'+(c.t||12)+' min</span></button>').join('')+'</div>';
  }else if(t.status==='done'){foot='<div class="notice">This ticket is closed. Pick another conversation.</div>';}
  else if(t.status==='abandoned'||S.over){foot='<div class="notice">The shift is over.</div>';}
  const typing=(t.busy&&t.status==='open')?'<div class="msg them"><span class="av" style="background:hsl('+t.hue+' 42% 40%)" aria-hidden="true">'+esc(initials(t.who))+'</span><div class="bubble"><span class="typing" aria-label="typing"><i></i><i></i><i></i></span></div></div>':'';
  el.innerHTML='<div class="chat-head"><button class="back" id="back" type="button" aria-label="Back to conversations">&lsaquo;</button>'
    +'<span class="av" style="background:hsl('+t.hue+' 42% 40%)" aria-hidden="true">'+esc(initials(t.who))+'</span>'
    +'<div class="ch-main"><div class="ch-name">'+esc(t.who)+'</div><div class="ch-sub">'+esc(t.role)+' · '+t.id+' · '+t.pri+' · '+esc(t.subject)+'</div></div>'
    +'<div class="ch-sla'+(t.status==='open'&&l<=30?' urgent':'')+'">'+sla+'</div></div>'
    +'<div class="msgs" id="msgs">'+t.log.map(m=>msgHtml(t,m)).join('')+typing+'</div>'+foot;
  const ms=$('#msgs');ms.scrollTop=ms.scrollHeight;
}
function renderBoss(B,el){
  let foot;
  if(S.over)foot='<div class="notice">The shift is over.</div>';
  else if(B.prompt&&!B.busy){
    foot='<div class="choices"><div class="choices-label">Your move</div>'+B.prompt.choices.map((c,i)=>
      '<button class="opt" data-i="'+i+'" type="button"><span class="tag">'+(i+1)+' · Say</span><span class="txt">'+esc(c.say)+'</span></button>').join('')+'</div>';
  }else foot='<div class="notice">Nothing needs your reply right now. Get back to the queue.</div>';
  const typing=B.busy&&!S.over?'<div class="msg them"><span class="av" style="background:hsl('+B.hue+' 42% 40%)" aria-hidden="true">JM</span><div class="bubble"><span class="typing" aria-label="typing"><i></i><i></i><i></i></span></div></div>':'';
  el.innerHTML='<div class="chat-head"><button class="back" id="back" type="button" aria-label="Back to conversations">&lsaquo;</button>'
    +'<span class="av" style="background:hsl('+B.hue+' 42% 40%)" aria-hidden="true">JM</span>'
    +'<div class="ch-main"><div class="ch-name">Jose Martinez</div><div class="ch-sub">Your manager · Shift '+(MEM.shifts+1)+' · Strikes '+S.strikes+'/'+MAX_STRIKES+'</div></div>'
    +'<div class="ch-sla'+(B.prompt?' urgent':'')+'">'+(B.prompt&&!S.over?'Reply needed':'')+'</div></div>'
    +'<div class="msgs" id="msgs">'+B.log.map(m=>msgHtml(B,m)).join('')+typing+'</div>'+foot;
  const ms=$('#msgs');ms.scrollTop=ms.scrollHeight;
}
function render(){renderHud();renderList();renderChat();}

function openTicket(id){
  S.active=id;const t=act();t.unread=0;
  $('#app').dataset.view='chat';render();
}
function showBrief(){
  const o=$('#overlay');o.hidden=false;
  o.innerHTML='<div class="card"><h1 id="ovTitle">Help Desk</h1><p class="lede">Thursday, 9:00 AM. You are the entire help desk at Brightwell Logistics.</p>'
   +'<p>Employees message you in Tandem. Open a conversation, then choose what to say or which fix to run. Each choice shows how many minutes it costs on the shift clock.</p>'
   +'<p>Every waiting ticket keeps aging while you work on another. The deadline is next to each name, and P1 means someone is blocked right now. Your shift ends at 5:00 PM.</p>'
   +'<p>Every shift is different: new people, new problems, new causes. Tickets arrive in bursts, and a P1 can land at the same moment as three routine requests. Your manager, Jose, watches the queue. If a ticket sits unanswered, he will let you know. If he messages you about anything else, tell him you are working. Chat back and you get a strike. Three strikes and you are fired. He remembers everything for as long as this browser session lasts, including across shifts.</p>'
   +'<p>You are graded on customer satisfaction, deadlines met, and whether you kept the company safe.</p>'
   +'<button class="go" id="start" type="button">Clock in</button></div>';
  $('#start').focus();
}
function showReport(){
  const T=S.tickets,done=T.filter(t=>t.status==='done');
  const avg=done.length?done.reduce((a,t)=>a+t.stars,0)/done.length:0;
  const breaches=T.filter(t=>t.breached).length,sec=T.filter(t=>t.sec).length,miss=T.length-done.length;
  const score=done.reduce((a,t)=>a+t.stars*20,0)-sec*50-miss*30-breaches*10-S.strikes*40;
  const mx=Math.max(100,T.length*100);
  const rank=S.fired?'Fired for chatting on the clock':score>=mx*.85?'Help Desk Legend':score>=mx*.65?'Senior Technician':score>=mx*.45?'Solid Tier 1':score>=mx*.25?'Probationary Hire':'Have you tried turning yourself off and on again?';
  const mem=remember(score);
  const o=$('#overlay');o.hidden=false;
  o.innerHTML='<div class="card"><h2 id="ovTitle">'+(S.fired?"You're fired":'Shift report')+'</h2><p class="lede">'+(S.fired?'Jose called you into his office at ':'Clocked out at ')+fmt(Math.min(S.clock,END))+'</p>'
   +'<div class="rank">'+esc(rank)+'</div>'
   +'<p>'+esc(mem.verdict)+'</p><p style="color:var(--muted);font-size:13.5px;margin-top:-4px">Shift '+mem.n+' this session · '+mem.met+' of '+ROSTER.length+' people met</p>'
   +'<div class="grid"><div class="stat"><span>Score</span><b>'+score+'</b></div><div class="stat"><span>Avg CSAT</span><b>'+(done.length?avg.toFixed(1):'–')+'</b></div>'
   +'<div class="stat"><span>Solved</span><b>'+done.length+'/'+T.length+'</b></div><div class="stat"><span>Late</span><b>'+breaches+'</b></div><div class="stat"><span>Security</span><b>'+sec+'</b></div><div class="stat"><span>Strikes</span><b>'+S.strikes+'</b></div></div>'
   +'<ul class="rep">'+T.map(t=>'<li><span>'+esc(t.who)+' · '+esc(t.subject)+(t.sec?' <span class="sec">(security slip)</span>':'')+'</span><span class="x">'
     +(t.status==='done'?starTxt(t.stars):t.arrived?'Unresolved':'Never picked up')+'</span></li>').join('')+'</ul>'
   +'<button class="go" id="again" type="button">Clock in again</button></div>';
  $('#again').focus();
}
function startShift(){
  $('#overlay').hidden=true;
  arrivals();$('#app').dataset.view='list';render();
  S.bossQ.push({type:'info',lines:introLines()});
  bossNext();
}

/* ---------- Events ---------- */
$('#rows').addEventListener('click',e=>{const b=e.target.closest('.row');if(b)openTicket(b.dataset.id);});
$('#chat').addEventListener('click',e=>{
  if(e.target.closest('#back')){$('#app').dataset.view='list';S.active=null;render();return;}
  const o=e.target.closest('.opt');if(o)choose(+o.dataset.i);
});
$('#overlay').addEventListener('click',e=>{
  if(e.target.id==='start')startShift();
  if(e.target.id==='again'){newGame();startShift();}
});
$('#out').addEventListener('click',()=>{
  const b=$('#out');
  if(!S||S.over)return;
  if(b.classList.contains('arm')){clearTimeout(armTimer);b.classList.remove('arm');b.textContent='Clock out';endShift();return;}
  b.classList.add('arm');b.textContent='Sure? Click again';
  armTimer=setTimeout(()=>{b.classList.remove('arm');b.textContent='Clock out';},3000);
});
document.addEventListener('keydown',e=>{
  if(!$('#overlay').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key))choose(+e.key-1);
});

newGame();render();showBrief();
</script>

</body></html>
